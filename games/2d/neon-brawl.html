// moves: st startup, act active, rec recovery, dmg, hs hitstun, bs blockstun, kb knockback, hb [forward, bottom, width, height] (px from the fighter), lv mid|low|high
const MV = {

const SP = {

  rush: { st: 7, act: 14, rec: 20, dmg: 88, hs: 22, bs: 16, kb: 7, hb: [10, 58, 60, 40], lv: 'mid', pose: 'rush', vel: 11, kd: 1, chip: 1 },
  rushS: { st: 6, act: 34, rec: 22, dmg: 38, hs: 18, bs: 10, kb: 1, hb: [8, 40, 64, 70], lv: 'mid', pose: 'rush', vel: 9, every: 5, last: { kd: 1, dmg: 70 }, chip: 1, inv: 10, sup: 1 },
  grab: { st: 6, act: 3, rec: 30, dmg: 165, grab: 100, pose: 'grab', snd: 2 },
  grabS: { st: 4, act: 4, rec: 32, dmg: 340, grab: 140, pose: 'grab', inv: 8, sup: 1, snd: 2 },
  rise: { st: 3, act: 14, rec: 10, dmg: 92, hs: 24, bs: 16, kb: 2, hb: [4, 50, 52, 90], lv: 'mid', pose: 'rise', jump: 14, kd: 1, launch: 13, inv: 8, chip: 1 },
  riseS: { st: 3, act: 26, rec: 10, dmg: 50, hs: 20, bs: 10, kb: 1, hb: [0, 40, 64, 110], lv: 'mid', pose: 'rise', jump: 17, every: 5, launch: 9, last: { kd: 1, dmg: 80, launch: 15 }, inv: 14, chip: 1, sup: 1 },
  spin: { st: 8, act: 24, rec: 14, dmg: 30, hs: 16, bs: 9, kb: 2, hb: [-30, 44, 120, 40], lv: 'mid', pose: 'spin', vel: 4.5, every: 6, last: { kd: 1 }, chip: 1 },
  spinS: { st: 6, act: 42, rec: 16, dmg: 32, hs: 16, bs: 8, kb: 1, hb: [-34, 40, 130, 50], lv: 'mid', pose: 'spin', vel: 6, every: 5, last: { kd: 1, dmg: 60, launch: 12 }, inv: 8, chip: 1, sup: 1 },
  counter: { st: 2, act: 32, rec: 20, pose: 'counter', counter: 140 },
  counterS: { st: 6, act: 26, rec: 20, dmg: 52, hs: 20, bs: 12, kb: 1, hb: [0, 30, 80, 100], lv: 'mid', pose: 'rush', warp: 1, every: 5, last: { kd: 1, dmg: 90, launch: 12 }, inv: 12, chip: 1, sup: 1 },
};
const mvOf = (f, name) => name === 'special' ? SP[CH[f.c].sp] : name === 'super' ? SP[CH[f.c].sp + 'S'] : MV[name];

// ---------- poses (angles in degrees from straight down; 90 = forward, 180 = up) ----------
const P = {
  idle: { t: 10, fa: [45, 150], ba: [25, 135], fl: [24, 6], bl: [-22, -8] },
  walkA: { t: 12, fa: [45, 150], ba: [25, 135], fl: [34, 12], bl: [-30, -12] },
  walkB: { t: 12, fa: [45, 150], ba: [25, 135], fl: [-8, -30], bl: [18, 2] },
  crouch: { t: 24, fa: [55, 150], ba: [35, 140], fl: [85, 0], bl: [10, -110] },
  jump: { t: 6, fa: [70, 150], ba: [50, 130], fl: [80, -10], bl: [40, -70] },
  block: { t: -4, fa: [35, 172], ba: [25, 168], fl: [26, 8], bl: [-26, -10] },
  cblock: { t: 10, fa: [40, 172], ba: [28, 168], fl: [85, 0], bl: [10, -110] },
  jab: { t: 18, fa: [90, 90], ba: [25, 150], fl: [34, 8], bl: [-28, -10] },
  kick: { t: -22, fa: [60, 150], ba: [-30, 60], fl: [100, 95], bl: [-14, -6] },
  cjab: { t: 26, fa: [86, 86], ba: [35, 140], fl: [85, 0], bl: [10, -110] },
  sweep: { t: 40, fa: [-20, -20], ba: [30, 20], fl: [92, 90], bl: [-30, -120] },
  ajab: { t: 18, fa: [62, 62], ba: [40, 120], fl: [80, -10], bl: [40, -70] },
  akick: { t: -10, fa: [80, 160], ba: [40, 120], fl: [62, 58], bl: [40, -80] },
  throw: { t: 20, fa: [80, 60], ba: [75, 55], fl: [34, 8], bl: [-30, -12] },
  hit: { t: -24, h: -20, fa: [10, 60], ba: [-25, 40], fl: [16, 0], bl: [-26, -14] },
  air: { t: -45, h: -25, fa: [130, 160], ba: [-60, -20], fl: [50, 20], bl: [15, -20] },
  win: { t: 4, fa: [168, 178], ba: [25, 140], fl: [22, 6], bl: [-22, -8] },
  fire: { t: 22, fa: [92, 92], ba: [88, 92], fl: [40, 10], bl: [-32, -14] },
  rush: { t: 38, fa: [96, 96], ba: [-30, 20], fl: [45, 12], bl: [-55, -32] },
  grab: { t: 25, fa: [88, 70], ba: [82, 64], fl: [38, 10], bl: [-32, -12] },
  rise: { t: -4, fa: [176, 180], ba: [30, 110], fl: [60, -30], bl: [0, -6] },
  spin: { t: -10, fa: [100, 110], ba: [-90, -100], fl: [96, 92], bl: [-6, 0] },
  counter: { t: 0, fa: [110, 168], ba: [70, 150], fl: [30, 10], bl: [-30, -12] },
  dash: { t: 34, fa: [60, 120], ba: [30, 100], fl: [50, 20], bl: [-50, -34] },
};
const lerpP = (a, b, k) => { const o = {}; for (const key of ['t', 'h']) o[key] = (a[key] || 0) + ((b[key] || 0) - (a[key] || 0)) * k; for (const key of ['fa', 'ba', 'fl', 'bl']) o[key] = [a[key][0] + (b[key][0] - a[key][0]) * k, a[key][1] + (b[key][1] - a[key][1]) * k]; return o; };

// ---------- fighters ----------
function mkF(c, side) { return { c, x: side ? 900 : 600, y: 0, vx: 0, vy: 0, face: side ? -1 : 1, hp: CH[c].hp, mhp: CH[c].hp, meter: 0, st: 'idle', mv: null, fr: 0, stun: 0, hit: {}, hitN: 0, combo: 0, inv: 0, buf: [], lastF: -99, lastB: -99, wins: 0, airUsed: 0, juggle: 0, inp: { x: 0, y: 0 }, confirm: 0, chainN: 0, cd: 0 }; }
const grounded = (f) => f.y <= 0 && f.vy >= 0;
const H = (f) => (f.st === 'crouch' || f.st === 'cblock' || (f.st === 'atk' && mvOf(f, f.mv)?.crouch) ? 80 : 128) * CH[f.c].sc;
function hurt(f) { if (f.st === 'down' || f.st === 'ko') return null; const w = 24 * CH[f.c].sc; return { x1: f.x - w, x2: f.x + w, y1: f.y, y2: f.y + H(f) }; }
function hbox(f, m) { const [fx, by, w, h] = m.hb, sc = CH[f.c].sc; const a = f.x + f.face * fx * sc, b = f.x + f.face * (fx + w) * sc; return { x1: Math.min(a, b), x2: Math.max(a, b), y1: f.y + by * sc, y2: f.y + (by + h) * sc }; }
const overlap = (a, b) => a && b && a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;

K.game({
  bg: '#07051a',
  touch: { stick: true, buttons: K.local ? [['KeyF', 'P'], ['KeyG', 'K'], ['KeyH', 'SP']] : [['KeyJ', 'PUNCH'], ['KeyK', 'KICK'], ['KeyL', 'SPECIAL']], buttons2: [['KeyJ', 'P'], ['KeyK', 'K'], ['KeyL', 'SP']] },
  init(s) {
    s.mode = K.attract ? 'demo' : K.net ? 'net' : K.local ? 'local' : 'solo';
    s.ph = 'select'; s.sel = [K.irand(0, 5), K.irand(0, 5)]; s.ready = [false, false]; s.acc = 0; s.frame = 0; s.spark = []; s.proj = []; s.ann = null; s.hitstop = 0; s.slow = 0; s.cam = (SW - 960) / 2; s.shake = 0;
    s.ladder = []; s.stage = 0; s.score = 0; s.sendT = 0; s.over = false; s.fx = []; s.seq = 0; s.taps = []; s.netIn = { x: 0, y: 0, taps: [] };
    if (s.mode === 'demo') { s.sel = [K.irand(0, 5), K.irand(0, 5)]; startMatch(s); }
  },
  onNet(s, d) {
    const host = K.net.isHost;
    if (host && d.t === 'pick') { s.sel[1] = d.c; s.ready[1] = true; }
    if (host && d.t === 'in') { s.netIn.x = d.x; s.netIn.y = d.y; s.netIn.taps.push(...(d.taps || [])); }
    if (!host && d.t === 'st') applySnap(s, d);
  },
  onLeave(s) { if (!s.over) { s.over = true; K.end(s, { score: 1000, won: true, stats: { won: 1 }, title: 'OPPONENT LEFT', text: 'You win by default.' }); } },
  update(s, dt) {
    if (s.over) return;
    const host = K.isHost();
    if (s.ph === 'select') return selectUpdate(s, dt);
    if (s.mode === 'net' && !host) { clientUpdate(s, dt); return; }
    // collect taps every rendered frame, the fixed 60 Hz simulation eats them
    gatherTaps(s);
    s.acc += Math.min(dt, 0.1) * (s.slow > 0 ? 0.3 : 1);
    while (s.acc >= 1 / FPS) { s.acc -= 1 / FPS; step(s); if (s.over) return; }
    stepSparks(s, dt);
    s.fx.forEach((e) => playFx(s, e));
    if (K.net) { s.sendT -= dt; if (s.sendT <= 0 || s.fx.length) { K.net.send(snap(s)); s.sendT = 0.05; } }
    s.fx = [];
  },
  ai(s) { /* attract: both fighters are CPU (see step) */ },
  draw(s) {
    if (s.ph === 'select') return selectDraw(s);
    const c = K.ctx(), sh = s.shake > 0 ? K.rand(-s.shake, s.shake) : 0;
    c.save(); c.translate(-Math.round(s.cam) + sh, sh * 0.5);
    drawStage(s, c);
    const order = s.f.slice().sort((a, b) => (a.st === 'atk') - (b.st === 'atk'));
    order.forEach((f) => { K.alpha(0.35); c.fillStyle = '#000'; c.beginPath(); c.ellipse(f.x, FLOOR + 4, 34 * CH[f.c].sc * Math.max(0.4, 1 - f.y / 300), 7, 0, 0, 7); c.fill(); K.alpha(1); });
    order.forEach((f) => drawFighter(c, f, s));
    s.proj.forEach((p) => drawProj(c, p, s));
    s.spark.forEach((p) => { K.alpha(Math.max(0, p.life / p.max)); if (p.ring) K.ring(p.x, p.y, p.r * (1.6 - p.life / p.max), p.col, 3); else { K.glow(p.col, 10); K.rect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz, p.col); K.noGlow(); } K.alpha(1); });
    c.restore();
    if (s.superT > 0) { K.alpha(Math.min(0.5, s.superT / 20)); K.rect(0, 0, 960, 540, '#000'); K.alpha(1); }
    hud(s);
  },
});

// ---------- character select ----------
function selectUpdate(s, dt) {
  const pick = (i, l, r, ok) => { if (s.ready[i]) return; if (K.tap(...l)) { s.sel[i] = (s.sel[i] + 5) % 6; K.sfx('click'); } if (K.tap(...r)) { s.sel[i] = (s.sel[i] + 1) % 6; K.sfx('click'); } if (K.tap(...ok)) { s.ready[i] = true; K.sfx('select'); } };
  if (K.mouse.clicked) { const i = cardAt(K.mouse.x, K.mouse.y); if (i >= 0) { const me = s.mode === 'net' ? 0 : s.mode === 'local' ? (s.ready[0] ? 1 : 0) : 0; if (s.sel[me] === i && !s.ready[me]) s.ready[me] = true; s.sel[me] = i; K.sfx('click'); } }
  if (s.mode === 'local') { pick(0, ['KeyA'], ['KeyD'], ['KeyF', 'Space']); pick(1, ['ArrowLeft'], ['ArrowRight'], ['KeyJ', 'Enter']); }
  else pick(0, ['KeyA', 'ArrowLeft'], ['KeyD', 'ArrowRight'], ['KeyJ', 'Space', 'Enter']);
  if (s.mode === 'solo' && s.ready[0]) { s.ladder = K.shuffle([0, 1, 2, 3, 4, 5].filter((i) => i !== s.sel[0])); s.stage = 0; s.sel[1] = s.ladder[0]; startMatch(s); }
  if (s.mode === 'local' && s.ready[0] && s.ready[1]) startMatch(s);
  if (s.mode === 'net') {
    const host = K.net.isHost;
    if (!host && s.ready[0] && !s.sentPick) { s.sentPick = true; K.net.send({ t: 'pick', c: s.sel[0] }); }
    if (!host && s.ready[0]) { s.pickT = (s.pickT || 0) - dt; if (s.pickT <= 0) { s.pickT = 1; K.net.send({ t: 'pick', c: s.sel[0] }); } }   // resend until the match starts
    if (host && s.ready[0] && s.ready[1]) startMatch(s);
  }
}
const cardAt = (x, y) => { for (let i = 0; i < 6; i++) { const cx = 120 + (i % 3) * 150, cy = 140 + Math.floor(i / 3) * 170; if (x > cx && x < cx + 136 && y > cy && y < cy + 156) return i; } return -1; };
function selectDraw(s) {
  const c = K.ctx();
  c.fillStyle = K.grad(0, 0, 0, 540, ['#1a0b33', '#07051a']); c.fillRect(0, 0, 960, 540);
  K.text('NEON BRAWL', 480, 50, 44, '#fff', 'center', 'd', 18);
  K.text(s.mode === 'local' ? 'P1: A D + F   ·   P2: ← → + J' : s.mode === 'net' ? 'pick your fighter · the other player picks theirs' : 'pick your fighter · ← → and J (or tap twice)', 480, 88, 14, '#8e88b8', 'center', 'u');
  for (let i = 0; i < 6; i++) {
    const cx = 120 + (i % 3) * 150, cy = 140 + Math.floor(i / 3) * 170, ch = CH[i];
    const p1 = s.sel[0] === i, p2 = s.mode === 'local' && s.sel[1] === i;
    K.rect(cx, cy, 136, 156, '#120d26', 12); K.stroke(cx, cy, 136, 156, p1 ? '#22e6ff' : p2 ? '#ff2bd6' : '#2c2850', p1 || p2 ? 3 : 2, 12);
    const f = mkF(i, 0); f.x = cx + 68; f.y = 0; f.face = 1; f.st = 'idle';
    c.save(); c.translate(0, cy + 128 - FLOOR); c.translate(cx + 68, FLOOR); c.scale(0.72, 0.72); c.translate(-(cx + 68), -FLOOR); drawFighter(c, f, s); c.restore();
    K.text(ch.n, cx + 68, cy + 144, 15, ch.col === '#2a2a3a' ? '#b8b0d8' : ch.col, 'center', 'd');
    if (p1) K.text(s.mode === 'local' ? 'P1' : 'YOU', cx + 14, cy + 16, 11, '#22e6ff', 'left', 'd');
    if (p2) K.text('P2', cx + 122, cy + 16, 11, '#ff2bd6', 'right', 'd');
  }
  const show = (i, x, col) => { const ch = CH[s.sel[i]]; K.rect(x, 140, 250, 326, '#120d26', 12); K.stroke(x, 140, 250, 326, col, 2, 12); K.text(ch.n, x + 125, 174, 26, col, 'center', 'd', 10); K.wrapText(ch.blurb, x + 125, 210, 220, 14, '#d6d2f5', 1.3);
    [['POWER', ch.hp / 1180], ['SPEED', ch.spd / 1.18], ['JUMP', ch.jmp / 1.12]].forEach(([n, v], k) => { K.text(n, x + 20, 270 + k * 34, 11, '#8e88b8', 'left', 'd'); K.rect(x + 90, 264 + k * 34, 140, 10, '#2a2440', 5); K.rect(x + 90, 264 + k * 34, 140 * v, 10, col, 5); });
    K.text(s.ready[i] ? 'READY!' : s.mode === 'local' ? (i ? 'J / Enter to lock in' : 'F / Space to lock in') : 'J / Space to lock in', x + 125, 440, 14, s.ready[i] ? '#3dffa0' : '#8e88b8', 'center', 'd'); };
  show(0, 600, '#22e6ff');
  if (s.mode === 'local' && s.ready[0]) show(1, 600, '#ff2bd6');
  if (s.mode === 'net') K.text(K.net.isHost ? (s.ready[1] ? 'opponent is ready' : 'waiting for the opponent to pick…') : s.ready[0] ? 'waiting for the host…' : '', 480, 515, 14, '#8e88b8', 'center', 'u');
}

// ---------- match flow ----------
function startMatch(s) {
  s.f = [mkF(s.sel[0], 0), mkF(s.sel[1], 1)]; s.round = 0; s.ph = 'fight'; s.over = false;
  s.ctl = s.mode === 'demo' ? ['cpu', 'cpu'] : s.mode === 'local' ? ['l1', 'l2'] : s.mode === 'net' ? ['me', 'net'] : ['me', 'cpu'];
  s.lv = s.mode === 'solo' ? s.stage : 2; s.ai = [{}, {}];
  newRound(s);
}
function newRound(s) {
  s.f.forEach((f, i) => { const w = f.wins; Object.assign(f, mkF(f.c, i)); f.wins = w; f.x = SW / 2 + (i ? 170 : -170); });
  s.proj = []; s.spark = []; s.time = ROUND_T; s.cam = (SW - 960) / 2; s.slow = 0; s.hitstop = 0; s.superT = 0; s.roundOver = 0;
  s.intro = 110; s.ann = { t: `ROUND ${s.round + 1}`, n: 70, col: '#fff' }; s.fx.push('round');
}
function endRound(s, winner, why) {
  s.roundOver = 150;
  if (winner >= 0) s.f[winner].wins++;
  s.ann = { t: why === 'ko' ? 'K.O.' : why === 'time' ? 'TIME' : 'DRAW', n: 150, col: why === 'ko' ? '#ff3355' : '#ffd93a', big: 1 };
  s.rWinner = winner; s.fx.push(why === 'ko' ? 'ko' : 'time');
  if (winner >= 0 && s.f[winner].hp === s.f[winner].mhp) s.perfect = 1; else s.perfect = 0;
}
function afterRound(s) {
  const [a, b] = s.f;
  if (a.wins >= WIN_R || b.wins >= WIN_R || s.round >= 4) return endMatch(s, a.wins > b.wins ? 0 : b.wins > a.wins ? 1 : -1);
  s.round++; newRound(s);
}
function endMatch(s, w) {
  if (s.mode === 'demo') { s.sel = [K.irand(0, 5), K.irand(0, 5)]; return startMatch(s); }
  if (s.mode === 'solo') {
    if (w === 0) {
      s.score += 1000 * (s.stage + 1) + Math.round(s.f[0].hp);

// ---------- CPU ----------
function cpu(s, f, o, i) {

function drawProj(c, p, s) {
