<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"tic-tac-toe","n":4,"title":"TIC TAC TOE","genre":"mind","modes":["sp","online","local"],"minPlayers":2,"maxPlayers":2,"desc":"Best of 9 rounds. Solo, the CPU starts sloppy and gets sharper every round until it plays perfectly. Or play a friend on the same screen or online; the starting player swaps each round.","controls":"Click / tap a square (or 1-9 on the number pad layout)","scoreLabel":"WINS","tasks":[{"stat":"score","target":3,"text":"Win 3 rounds of Tic Tac Toe in one match"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const L = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
const CS = 130, BX = 480 - CS * 1.5, BY = 75;
const win = (b) => { for (const l of L) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[1]] === b[l[2]]) return l; return null; };
const mode = () => (K.net ? 'net' : K.local ? 'local' : 'cpu');
const mine = () => (mode() === 'net' ? (K.net.index === 0 ? 'X' : 'O') : 'X');
function minimax(b, me, turn) {
  const w = win(b); if (w) return b[w[0]] === me ? 10 : -10;
  if (b.every(Boolean)) return 0;
  const scores = [];
  for (let i = 0; i < 9; i++) if (!b[i]) { b[i] = turn; scores.push(minimax(b, me, turn === 'X' ? 'O' : 'X') * 0.9); b[i] = null; }
  return turn === me ? Math.max(...scores) : Math.min(...scores);
}
function cpuMove(s) {
  const free = s.b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0);
  if (Math.random() < Math.max(0, 0.55 - s.round * 0.08)) return K.pick(free);
  let best = -99, pick = free[0];
  for (const i of K.shuffle(free.slice())) { s.b[i] = 'O'; const v = minimax(s.b, 'O', 'X'); s.b[i] = null; if (v > best) { best = v; pick = i; } }
  return pick;
}
function newRound(s) { s.b = Array(9).fill(null); s.turn = s.round % 2 ? 'O' : 'X'; s.line = null; s.wait = 0.5; s.over = 0; }
function place(s, i, send) {
  if (s.b[i] || s.over) return;
  s.b[i] = s.turn; K.sfx(s.turn === 'X' ? 'click' : 'blip');
  if (send && K.net) K.net.send({ t: 'mv', i });
  const w = win(s.b);
  if (w) { s.line = w; s.wins[s.b[w[0]]]++; K.sfx(mode() === 'local' || s.b[w[0]] === mine() ? 'win' : 'lose'); s.over = 1.4; }
  else if (s.b.every(Boolean)) { s.draws++; K.sfx('wrong'); s.over = 1.1; }
  else { s.turn = s.turn === 'X' ? 'O' : 'X'; s.wait = K.rand(0.35, 0.7); }
}
K.game({
  bg: '#08061a',
  init(s) { s.round = 0; s.wins = { X: 0, O: 0 }; s.draws = 0; s.anim = Array(9).fill(0); newRound(s); },
  onNet(s, d) { if (d.t === 'mv' && s.turn !== mine()) place(s, d.i, false); },
  onLeave(s) { if (!s.done) { s.done = true; K.end(s, { score: s.wins[mine()], won: true, stats: {}, title: 'OPPONENT LEFT', text: 'You win the match.' }); } },
  update(s, dt) {
    s.anim = s.anim.map((a, i) => (s.b[i] ? Math.min(1, a + dt * 5) : 0));
    if (s.over > 0) {
      s.over -= dt;
      if (s.over <= 0) {
        s.round++;
        const me = mine(), them = me === 'X' ? 'O' : 'X';
        if (s.round >= 9 || s.wins.X >= 5 || s.wins.O >= 5) {
          s.done = true;
          const title = mode() === 'local' ? (s.wins.X === s.wins.O ? 'TIED MATCH' : s.wins.X > s.wins.O ? 'X WINS THE MATCH' : 'O WINS THE MATCH') : s.wins[me] > s.wins[them] ? 'YOU WIN THE MATCH' : s.wins[me] === s.wins[them] ? 'TIED MATCH' : mode() === 'cpu' ? 'CPU WINS' : 'THEY WIN';
          return K.end(s, { score: s.wins[me], won: mode() === 'local' ? null : s.wins[me] > s.wins[them], title, text: `X ${s.wins.X} · O ${s.wins.O} · ${s.draws} draws` });
        }
        newRound(s);
      }
      return;
    }
    if (mode() === 'cpu' && s.turn === 'O') { s.wait -= dt; if (s.wait <= 0) place(s, cpuMove(s), false); return; }
    if (mode() === 'net' && s.turn !== mine()) return;
    let pick = -1;
    for (let i = 0; i < 9; i++) if (K.tap('Numpad' + (i + 1)) || K.tap('Digit' + (i + 1))) pick = [6, 7, 8, 3, 4, 5, 0, 1, 2][i];
    if (K.mouse.clicked) { const cx = Math.floor((K.mouse.x - BX) / CS), cy = Math.floor((K.mouse.y - BY) / CS); if (cx >= 0 && cx < 3 && cy >= 0 && cy < 3) pick = cy * 3 + cx; }
    if (pick >= 0) place(s, pick, true);
  },
  draw(s) {
    K.text(`ROUND ${Math.min(9, s.round + 1)} / 9`, 480, 38, 18, '#8e88b8', 'center', 'd');
    const names = mode() === 'net' ? [K.net.players[0]?.username, K.net.players[1]?.username] : mode() === 'local' ? ['PLAYER X', 'PLAYER O'] : ['YOU', 'CPU'];
    K.text(names[0] || 'X', 120, 200, 18, '#22e6ff', 'center', 'd'); K.text(String(s.wins.X), 120, 250, 60, '#22e6ff', 'center', 'd', 16);
    K.text(names[1] || 'O', 840, 200, 18, '#ff2bd6', 'center', 'd'); K.text(String(s.wins.O), 840, 250, 60, '#ff2bd6', 'center', 'd', 16);
    K.text(`DRAWS ${s.draws}`, 480, 500, 14, '#8e88b8', 'center', 'm');
    if (mode() === 'cpu') K.text(s.round >= 6 ? 'CPU: PERFECT' : s.round >= 3 ? 'CPU: SHARP' : 'CPU: SLOPPY', 840, 300, 13, '#8e88b8', 'center', 'm');
    else if (!s.over) K.text(mode() === 'net' ? (s.turn === mine() ? 'YOUR TURN' : 'THEIR TURN') : `${s.turn} TO PLAY`, 480, 470, 16, s.turn === 'X' ? '#22e6ff' : '#ff2bd6', 'center', 'd');
    K.glow('#8b5cf6', 10);
    for (let i = 1; i < 3; i++) { K.line(BX + i * CS, BY + 10, BX + i * CS, BY + CS * 3 - 10, '#8b5cf6', 4); K.line(BX + 10, BY + i * CS, BX + CS * 3 - 10, BY + i * CS, '#8b5cf6', 4); }
    K.noGlow();
    for (let i = 0; i < 9; i++) {
      const x = BX + (i % 3) * CS + CS / 2, y = BY + Math.floor(i / 3) * CS + CS / 2, a = s.anim[i], r = 40;
      if (s.b[i] === 'X') { K.glow('#22e6ff', 18); K.line(x - r * a, y - r * a, x + r * a, y + r * a, '#22e6ff', 10); K.line(x + r * a, y - r * a, x - r * a, y + r * a, '#22e6ff', 10); }
      if (s.b[i] === 'O') { K.glow('#ff2bd6', 18); K.ctx().strokeStyle = '#ff2bd6'; K.ctx().lineWidth = 10; K.ctx().beginPath(); K.ctx().arc(x, y, r, 0, Math.PI * 2 * a); K.ctx().stroke(); }
      K.noGlow();
    }
    if (s.line) { const p = (i) => [BX + (i % 3) * CS + CS / 2, BY + Math.floor(i / 3) * CS + CS / 2]; const [a, b] = [p(s.line[0]), p(s.line[2])]; K.glow('#ffd93a', 20); K.line(a[0], a[1], b[0], b[1], '#ffd93a', 8); K.noGlow(); }
  },
  ai(s) { if (s.turn === 'X' && !s.over) { s.aw = (s.aw || 0) + 1; if (s.aw % 30 === 0) { const f = s.b.map((v, i) => (v ? -1 : i)).filter((i) => i >= 0); place(s, K.pick(f), false); } } },
});
</script></body></html>
