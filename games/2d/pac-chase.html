<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pac-Chase</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"pac-chase","n":25,"title":"PAC-CHASE","genre":"fun","desc":"Gobble every dot in the neon maze while four ghosts hunt you, each with its own personality. Eat a power pellet and the hunters become the hunted for a few seconds. Clear the maze to move on.","controls":"Arrow keys / WASD or swipe (you can turn early)","scoreLabel":"POINTS","tasks":[{"stat":"score","target":2000,"text":"Score 2000 in Pac-Chase"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const MAZE = ['###################', '#........#........#', '#o##.###.#.###.##o#', '#.................#', '#.##.#.#####.#.##.#', '#....#...#...#....#', '####.### # ###.####', '   #.#   G   #.#   ', '####.# ##-## #.####', '    .  #GGG#  .    ', '####.# ##### #.####', '   #.#       #.#   ', '####.# ##### #.####', '#........#........#', '#.##.###.#.###.##.#', '#o.#.....P.....#.o#', '##.#.#.#####.#.#.##', '#....#...#...#....#', '#.######.#.######.#', '#.................#', '###################'];
const T = 25, OX = 480 - (19 * T) / 2, OY = 7, DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const GC = ['#ff3355', '#ff9bc8', '#22e6ff', '#ff8a3a'];
const open = (x, y, ghost) => { x = (x + 19) % 19; const c = MAZE[y]?.[x]; return c !== undefined && c !== '#' && (ghost || c !== '-'); };
function level(s) {
  s.dots = new Set(); s.pow = new Set();
  MAZE.forEach((r, y) => [...r].forEach((c, x) => { if (c === '.') s.dots.add(x + ',' + y); if (c === 'o') s.pow.add(x + ',' + y); if (c === 'P') s.start = [x, y]; }));
  reset(s);
}
function reset(s) { s.p = { x: s.start[0], y: s.start[1], px: s.start[0], py: s.start[1], d: 'left', want: 'left', t: 0 }; s.g = [[9, 7], [8, 9], [9, 9], [10, 9]].map(([x, y], i) => ({ x, y, px: x, py: y, d: 'up', t: 0, out: i * 2.5, home: [x, y] })); s.fright = 0; s.ready = 1.5; }
K.game({
  bg: '#05040f',
  init(s) { s.score = 0; s.lives = 3; s.lvl = 0; s.eatChain = 0; level(s); },
  update(s, dt) {
    if (s.ready > 0) { s.ready -= dt; return; }
    const d = K.tapDir(); if (d) s.p.want = d;
    s.fright = Math.max(0, s.fright - dt);
    const p = s.p, pSpeed = 7.5 + s.lvl * 0.3;
    p.t += dt * pSpeed;
    if (p.t >= 1) {
      p.t = 0; p.px = p.x; p.py = p.y;
      if (open(p.x + DIRS[p.want][0], p.y + DIRS[p.want][1])) p.d = p.want;
      if (open(p.x + DIRS[p.d][0], p.y + DIRS[p.d][1])) { p.x = (p.x + DIRS[p.d][0] + 19) % 19; p.y += DIRS[p.d][1]; if (Math.abs(p.x - p.px) > 1) p.px = p.x; }
      const k = p.x + ',' + p.y;
      if (s.dots.delete(k)) { s.score += 10; if (s.dots.size % 2) K.tone(440, 0.05, 'square', 0.03); }
      if (s.pow.delete(k)) { s.score += 50; s.fright = Math.max(4, 8 - s.lvl); s.eatChain = 0; K.sfx('power'); }
      if (!s.dots.size && !s.pow.size) { s.lvl++; s.score += 500; K.sfx('win'); level(s); return; }
    }
    s.g.forEach((g, i) => {
      if (g.out > 0) { g.out -= dt; return; }
      const sp = (s.fright ? 4 : 6.5 + s.lvl * 0.4) * (g.dead ? 2 : 1); g.t += dt * sp;
      if (g.t < 1) return;
      g.t = 0; g.px = g.x; g.py = g.y;
      let target = [p.x, p.y];
      if (g.dead) target = [9, 9];
      else if (i === 1) target = [p.x + DIRS[p.d][0] * 4, p.y + DIRS[p.d][1] * 4];
      else if (i === 2) target = [p.x * 2 - s.g[0].x, p.y * 2 - s.g[0].y];
      else if (i === 3 && Math.hypot(g.x - p.x, g.y - p.y) < 6) target = [0, 20];
      if (s.fright && !g.dead) target = [K.irand(0, 18), K.irand(0, 20)];
      const back = { up: 'down', down: 'up', left: 'right', right: 'left' }[g.d];
      const opts = Object.keys(DIRS).filter((k) => k !== back && open(g.x + DIRS[k][0], g.y + DIRS[k][1], true));
      if (!opts.length) opts.push(back);
      opts.sort((a, b) => Math.hypot(g.x + DIRS[a][0] - target[0], g.y + DIRS[a][1] - target[1]) - Math.hypot(g.x + DIRS[b][0] - target[0], g.y + DIRS[b][1] - target[1]));
      g.d = opts[0]; g.x = (g.x + DIRS[g.d][0] + 19) % 19; g.y += DIRS[g.d][1]; if (Math.abs(g.x - g.px) > 1) g.px = g.x;
      if (g.dead && g.x === 9 && g.y === 9) g.dead = false;
    });
    for (const g of s.g) {
      if (g.out > 0 || g.dead) continue;
      const gx = K.lerp(g.px, g.x, g.t), gy = K.lerp(g.py, g.y, g.t), px = K.lerp(p.px, p.x, p.t), py = K.lerp(p.py, p.y, p.t);
      if (Math.hypot(gx - px, gy - py) < 0.7) {
        if (s.fright) { g.dead = true; s.eatChain++; const pts = 200 * 2 ** (s.eatChain - 1); s.score += pts; K.sfx('coin'); K.floatText(String(pts), OX + gx * T, OY + gy * T, '#22e6ff', 16); }
        else { s.lives--; K.sfx('lose'); K.shake(10); if (s.lives <= 0) return K.end(s, { score: s.score, won: null, title: 'CAUGHT', text: `Maze ${s.lvl + 1}` }); reset(s); return; }
      }
    }
  },
  draw(s) {
    MAZE.forEach((r, y) => [...r].forEach((c, x) => { if (c === '#') { K.rect(OX + x * T + 2, OY + y * T + 2, T - 4, T - 4, '#0d0b30', 4); K.stroke(OX + x * T + 2, OY + y * T + 2, T - 4, T - 4, '#4f8bff', 1.5, 4); } if (c === '-') K.rect(OX + x * T, OY + y * T + T / 2 - 2, T, 4, '#ff9bc8'); }));
    s.dots.forEach((k) => { const [x, y] = k.split(',').map(Number); K.circle(OX + x * T + T / 2, OY + y * T + T / 2, 2.5, '#ffd59a'); });
    s.pow.forEach((k) => { const [x, y] = k.split(',').map(Number); if (Math.sin(K.time() * 8) > -0.3) { K.glow('#fff', 10); K.circle(OX + x * T + T / 2, OY + y * T + T / 2, 7, '#fff'); K.noGlow(); } });
    s.g.forEach((g, i) => {
      const x = OX + K.lerp(g.px, g.x, g.t) * T + T / 2, y = OY + K.lerp(g.py, g.y, g.t) * T + T / 2, col = g.dead ? 'transparent' : s.fright ? (s.fright < 1.5 && Math.sin(K.time() * 20) > 0 ? '#fff' : '#3a4aff') : GC[i];
      if (!g.dead) { K.glow(col, 10); K.circle(x, y - 2, 11, col); K.rect(x - 11, y - 2, 22, 11, col); for (let k = 0; k < 3; k++) K.poly([[x - 11 + k * 7.3, y + 9], [x - 7.3 + k * 7.3, y + 4], [x - 3.7 + k * 7.3, y + 9]], '#05040f'); K.noGlow(); }
      K.circle(x - 4, y - 3, 3.5, '#fff'); K.circle(x + 4, y - 3, 3.5, '#fff'); K.circle(x - 4 + DIRS[g.d][0] * 1.5, y - 3 + DIRS[g.d][1] * 1.5, 1.8, '#111'); K.circle(x + 4 + DIRS[g.d][0] * 1.5, y - 3 + DIRS[g.d][1] * 1.5, 1.8, '#111');
    });
    const p = s.p, px = OX + K.lerp(p.px, p.x, p.t) * T + T / 2, py = OY + K.lerp(p.py, p.y, p.t) * T + T / 2, ang = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 }[p.d], m = Math.abs(Math.sin(K.time() * 14)) * 0.7;
    const c = K.ctx(); K.glow('#ffd93a', 14); c.fillStyle = '#ffd93a'; c.beginPath(); c.moveTo(px, py); c.arc(px, py, 11, ang + m / 2, ang + Math.PI * 2 - m / 2); c.closePath(); c.fill(); K.noGlow();
    K.text(String(s.score), 120, 60, 26, '#fff', 'center', 'd'); K.text('●'.repeat(Math.max(0, s.lives)), 120, 100, 20, '#ffd93a'); K.text(`MAZE ${s.lvl + 1}`, 120, 140, 14, '#8e88b8', 'center', 'd');
    if (s.ready > 0) K.text('READY!', OX + 9.5 * T, OY + 11.5 * T, 18, '#ffd93a', 'center', 'd');
  },
  ai(s) {
    const p = s.p; if (p.t > 0.2) return;
    const danger = (x, y) => s.g.some((g) => !g.dead && !s.fright && g.out <= 0 && Math.abs(g.x - x) + Math.abs(g.y - y) < 3);
    let best = null, bd = 1e9;
    for (const k of Object.keys(DIRS)) { const nx = p.x + DIRS[k][0], ny = p.y + DIRS[k][1]; if (!open(nx, ny) || danger(nx, ny)) continue; let d = 1e9; s.dots.forEach((q) => { const [a, b] = q.split(',').map(Number); d = Math.min(d, Math.abs(a - nx) + Math.abs(b - ny)); }); if (d < bd) { bd = d; best = k; } }
    if (best) K.vtap({ up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' }[best]);
  },
});
</script></body></html>
