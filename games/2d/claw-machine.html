<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Claw Machine</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"claw-machine","n":169,"title":"CLAW MACHINE","genre":"fun","desc":"Ten coins, one glass box full of plushies. Slide the claw over a prize, drop it, and pray: the claw grabs, lifts... and sometimes the prize slips. Line it up dead centre for a better grip, big plushies are heavier, and the shiny rare ones are worth a lot. Drop your catch in the chute to keep it.","controls":"← → (or drag) to move the claw · Space / DROP to grab · it carries the prize to the chute by itself","scoreLabel":"PRIZE PTS","tasks":[{"stat":"score","target":100,"text":"Win 100 prize points at the Claw Machine"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const KINDS = [['🧸', 10, 30, 1], ['🐻', 12, 34, 1.2], ['🐰', 10, 28, 0.9], ['🦊', 15, 30, 1], ['🐸', 10, 26, 0.8], ['🐼', 20, 34, 1.3], ['🦄', 40, 30, 1.1], ['💎', 60, 22, 0.6], ['👑', 80, 26, 1]];
const BX = 200, BW = 560, FLOOR = 470, CHUTE = { x: 210, w: 90 };
function fill(s) { s.prizes = []; for (let i = 0; i < 26; i++) { const r = Math.random(), k = r < 0.03 ? 8 : r < 0.07 ? 7 : r < 0.13 ? 6 : K.irand(0, 5); const [e, v, sz, w] = KINDS[k]; s.prizes.push({ e, v, sz, w, x: K.rand(CHUTE.x + CHUTE.w + 30, BX + BW - 30), y: FLOOR - sz - K.rand(0, 60), rare: k >= 6 }); } settle(s); }
function settle(s) { for (let it = 0; it < 60; it++) { s.prizes.forEach((p) => { if (p.held) return; p.y = Math.min(p.y + 6, FLOOR - p.sz); s.prizes.forEach((q) => { if (q === p || q.held) return; const dx = p.x - q.x, dy = p.y - q.y, d = Math.hypot(dx, dy), m = p.sz + q.sz - 12; if (d < m && d > 0) { const push = (m - d) / 2; p.x += (dx / d) * push; p.y += (dy / d) * push; q.x -= (dx / d) * push; q.y -= (dy / d) * push; } }); p.x = K.clamp(p.x, CHUTE.x + CHUTE.w + p.sz, BX + BW - p.sz); }); } }
K.game({
  touch: { buttons: [['Space', 'DROP']] },
  bg: '#1a0f2a',
  init(s) { s.coins = 10; s.pts = 0; s.won = []; s.claw = { x: 480, y: 90, st: 'move', open: 1 }; fill(s); },
  update(s, dt) {
    const c = s.claw, d = K.dir();
    if (c.st === 'move') {
      if (s.coins <= 0) return K.end(s, { score: s.pts, won: s.won.length > 0, stats: { won: s.won.length ? 1 : 0 }, title: s.won.length ? 'NICE HAUL' : 'NOTHING THIS TIME', text: s.won.length ? `You won ${s.won.join(' ')}` : 'The claw machine always wins. Almost.' });
      c.x = K.clamp(c.x + d.x * 260 * dt, BX + 20, BX + BW - 20);
      if (K.mouse.down && K.mouse.y < 440 && K.mouse.x > BX && K.mouse.x < BX + BW) c.x = K.lerp(c.x, K.mouse.x, Math.min(1, dt * 10));
      if (K.tap('Space') || (K.mouse.clicked && K.inRect(K.mouse.x, K.mouse.y, { x: 800, y: 380, w: 130, h: 70 }))) { c.st = 'down'; s.coins--; K.sfx('click'); K.tone(220, 1.2, 'triangle', 0.03, 80); }
    } else if (c.st === 'down') {
      c.y += 220 * dt;
      const under = s.prizes.filter((p) => Math.abs(p.x - c.x) < p.sz).sort((a, b) => a.y - b.y)[0];
      if (c.y >= (under ? under.y - under.sz + 6 : FLOOR - 10)) { c.st = 'close'; c.t = 0.5; }
    } else if (c.st === 'close') {
      c.open = Math.max(0, c.open - dt * 3); c.t -= dt;
      if (c.t <= 0) {
        const p = s.prizes.filter((q) => Math.hypot(q.x - c.x, q.y - (c.y + 20)) < q.sz + 10).sort((a, b) => Math.abs(a.x - c.x) - Math.abs(b.x - c.x))[0];
        if (p) { const off = Math.abs(p.x - c.x) / p.sz; p.held = true; c.prize = p; c.grip = K.clamp(1 - off * 0.9 - (p.w - 1) * 0.6 + K.rand(-0.15, 0.15), 0.05, 0.95); }
        c.st = 'up'; K.sfx('knock');
      }
    } else if (c.st === 'up' || c.st === 'carry') {
      if (c.st === 'up') { c.y -= 160 * dt; if (c.y <= 90) { c.y = 90; c.st = 'carry'; } }
      else { c.x -= 200 * dt; if (c.x <= CHUTE.x + CHUTE.w / 2) { c.x = CHUTE.x + CHUTE.w / 2; c.st = 'drop'; c.t = 0.6; } }
      if (c.prize) { c.prize.x = c.x; c.prize.y = c.y + 34; if (Math.random() < dt * (1 - c.grip) * 1.6) { c.prize.held = false; c.prize = null; K.sfx('wrong'); s.msg = 'IT SLIPPED!'; s.msgT = 1.2; } }
    } else if (c.st === 'drop') {
      c.open = Math.min(1, c.open + dt * 3); c.t -= dt;
      if (c.prize) { const p = c.prize; s.prizes = s.prizes.filter((q) => q !== p); s.pts += p.v; s.won.push(p.e); c.prize = null; K.sfx('win'); s.msg = `WON ${p.e} +${p.v}`; s.msgT = 1.5; }
      if (c.t <= 0) { c.st = 'home'; }
    } else if (c.st === 'home') { c.x += 300 * dt; if (c.x >= 480) { c.x = 480; c.st = 'move'; c.open = 1; settle(s); } }
    s.prizes.forEach((p) => { if (!p.held && p.y < FLOOR - p.sz) p.y = Math.min(FLOOR - p.sz, p.y + 400 * dt); });
    s.msgT = (s.msgT || 0) - dt;
  },
  draw(s) {
    const c = s.claw;
    K.rect(BX - 20, 30, BW + 40, 470, '#ff2bd6', 14); K.rect(BX, 50, BW, FLOOR - 40, '#1d2a44', 6);
    K.rect(CHUTE.x, FLOOR - 70, CHUTE.w, 70, '#0a0f1a'); K.text('PRIZE', CHUTE.x + CHUTE.w / 2, FLOOR - 82, 11, '#ffd93a', 'center', 'd');
    s.prizes.slice().sort((a, b) => a.y - b.y).forEach((p) => { if (p.rare) K.glow('#ffd93a', 14); K.text(p.e, p.x, p.y, p.sz * 2, '#fff'); K.noGlow(); });
    K.line(c.x, 50, c.x, c.y, '#c9c9d0', 3); K.rect(c.x - 16, c.y - 6, 32, 12, '#c9c9d0', 4);
    const o = 10 + c.open * 14; K.line(c.x - 8, c.y + 6, c.x - o, c.y + 34, '#c9c9d0', 4); K.line(c.x + 8, c.y + 6, c.x + o, c.y + 34, '#c9c9d0', 4);
    K.alpha(0.12); K.rect(BX, 50, BW, FLOOR - 40, '#bff6ff'); K.alpha(1);
    K.button(800, 380, 130, 70, 'DROP', { color: '#ffd93a', size: 18 });
    K.text(`COINS ${s.coins}`, 865, 90, 18, '#ffd93a', 'center', 'd'); K.text(`PTS ${s.pts}`, 865, 120, 16, '#3dffa0', 'center', 'd');
    K.wrapText(s.won.join(' ') || 'no prizes yet', 865, 170, 150, 22, '#fff', 1.2);
    if (s.msgT > 0) K.text(s.msg, 480, 20, 18, '#ffd93a', 'center', 'd');
  },
  ai(s) { const c = s.claw; if (c.st !== 'move') return; const t = s.prizes[0]; if (!t) return; K.vhold('ArrowLeft', t.x < c.x - 4); K.vhold('ArrowRight', t.x > c.x + 4); if (Math.abs(t.x - c.x) < 6) K.vtap('Space'); },
});
</script></body></html>
