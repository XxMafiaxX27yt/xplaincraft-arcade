<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Memory</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"number-memory","n":44,"title":"NUMBER MEMORY","genre":"mind","desc":"A number flashes on screen. When it disappears, type it back. Every correct answer adds one more digit. The average person remembers 7. How long can your number get?","controls":"Type the digits (or the on-screen keypad) + Enter","scoreLabel":"DIGITS","tasks":[{"stat":"score","target":8,"text":"Remember an 8-digit number"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const PAD = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '↵'];
function next(s) { s.len++; s.num = Array.from({ length: s.len }, (_, i) => (i === 0 ? K.irand(1, 9) : K.irand(0, 9))).join(''); s.phase = 'show'; s.t = 1 + s.len * 0.6; s.max = s.t; s.input = ''; }
K.game({
  bg: '#0c1426', touch: { stick: false, buttons: [] },
  init(s) { s.len = 0; next(s); },
  update(s, dt) {
    if (s.phase === 'show') { s.t -= dt; if (s.t <= 0) s.phase = 'type'; return; }
    if (s.phase === 'result') { s.t -= dt; if (s.t <= 0) { if (s.ok) next(s); else K.end(s, { score: s.len - 1, won: null, title: 'NOT QUITE', text: `It was ${s.num}. You typed ${s.input || 'nothing'}.` }); } return; }
    let key = null;
    for (let i = 0; i <= 9; i++) if (K.tap('Digit' + i, 'Numpad' + i)) key = String(i);
    if (K.tap('Backspace')) key = '⌫'; if (K.tap('Enter', 'NumpadEnter')) key = '↵';
    if (K.mouse.clicked) PAD.forEach((p, i) => { if (K.inRect(K.mouse.x, K.mouse.y, { x: 360 + (i % 3) * 82, y: 250 + Math.floor(i / 3) * 66, w: 74, h: 58 })) key = p; });
    if (!key) return;
    if (key === '⌫') s.input = s.input.slice(0, -1);
    else if (key === '↵') { s.ok = s.input === s.num; s.phase = 'result'; s.t = 1.4; K.sfx(s.ok ? 'coin' : 'lose'); }
    else if (s.input.length < 24) { s.input += key; K.sfx('tick'); }
  },
  draw(s) {
    if (s.phase === 'show') { K.text(s.num, 480, 230, Math.min(80, 900 / s.len), '#fff', 'center', 'd', 12); K.rect(330, 300, 300, 8, '#222', 4); K.rect(330, 300, 300 * (s.t / s.max), 8, '#22e6ff', 4); }
    else if (s.phase === 'type') { K.text('WHAT WAS THE NUMBER?', 480, 120, 22, '#8e88b8', 'center', 'd'); K.text(s.input + '_', 480, 190, Math.min(60, 900 / Math.max(6, s.input.length)), '#fff', 'center', 'd'); PAD.forEach((p, i) => { const x = 360 + (i % 3) * 82, y = 250 + Math.floor(i / 3) * 66; K.rect(x, y, 74, 58, '#1a2440', 8); K.text(p, x + 37, y + 29, 22, p === '↵' ? '#3dffa0' : '#fff', 'center', 'd'); }); }
    else { K.text(s.ok ? 'CORRECT' : 'WRONG', 480, 150, 40, s.ok ? '#3dffa0' : '#ff3355', 'center', 'd', 14); K.text(s.num, 480, 230, 34, '#fff', 'center', 'm'); K.text(s.input, 480, 280, 28, s.ok ? '#3dffa0' : '#ff8a3a', 'center', 'm'); }
    K.text(`LEVEL ${s.len}`, 480, 40, 18, '#22e6ff', 'center', 'd');
  },
  ai(s) { if (s.phase !== 'type') return; s.aw = (s.aw || 0) + 1; if (s.aw % 6) return; if (s.input.length < s.num.length) K.vtap('Digit' + s.num[s.input.length]); else K.vtap('Enter'); },
});
</script></body></html>
