<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chain Reaction</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"chain-reaction","n":149,"title":"CHAIN REACTION","genre":"mystery","desc":"The screen is full of drifting coloured dots. You get one click. Your click blooms into a bubble, every dot that touches it blooms too, and those catch more... Pick the perfect moment and place and watch the whole screen go off. Each level asks for a bigger chain. Missed? Try the level again.","controls":"One click / tap per level - choose the moment","scoreLabel":"POINTS","tasks":[{"stat":"score","target":2000,"text":"Score 2000 in Chain Reaction"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const LV = [[5, 1], [10, 2], [15, 4], [20, 7], [25, 11], [30, 16], [35, 22], [40, 29], [45, 36], [50, 43], [55, 50], [60, 57]];
const PENTA = [261.6, 293.7, 329.6, 392, 440, 523.3, 587.3, 659.3, 784, 880];
function level(s) {
  const [n, goal] = LV[s.lv]; s.goal = goal;
  s.dots = Array.from({ length: n }, () => { const a = K.rand(0, 6.28), v = K.rand(40, 80); return { x: K.rand(30, 930), y: K.rand(30, 510), vx: Math.cos(a) * v, vy: Math.sin(a) * v, h: K.rand(0, 360), st: 0, r: 8, t: 0 }; });
  s.used = false; s.popped = 0; s.end = 0; s.phase = 'play';
}
K.game({
  bg: '#0a0a16', touch: { stick: false, buttons: [] },
  init(s) { s.lv = K.attract ? 9 : 0; s.score = 0; s.tries = 0; level(s); if (K.attract) { s.used = true; const d = s.dots[0]; s.dots.push({ x: d.x, y: d.y, vx: 0, vy: 0, h: 0, st: 1, r: 8, t: 0, me: true }); } },
  update(s, dt) {
    const m = K.mouse;
    if (s.phase === 'result') { s.end -= dt; if (s.end <= 0) { if (s.popped >= s.goal) { s.lv++; if (s.lv >= LV.length) return K.end(s, { score: s.score, won: true, stats: { won: 1 }, title: 'TOTAL CHAIN', text: `Every level, ${s.tries} retries` }); } else s.tries++; level(s); } return; }
    if (!s.used && m.clicked) { s.used = true; s.dots.push({ x: m.x, y: m.y, vx: 0, vy: 0, h: 0, st: 1, r: 8, t: 0, me: true }); K.sfx('pop'); }
    const R = 52;
    for (const d of s.dots) {
      if (d.st === 0) { d.x += d.vx * dt; d.y += d.vy * dt; if (d.x < 8 || d.x > 952) d.vx *= -1; if (d.y < 8 || d.y > 532) d.vy *= -1; }
      else if (d.st === 1) { d.r = Math.min(R, d.r + 140 * dt); if (d.r >= R) { d.st = 2; d.t = 1; } }
      else if (d.st === 2) { d.t -= dt; if (d.t <= 0) d.st = 3; }
      else if (d.st === 3) { d.r -= 90 * dt; if (d.r <= 0) { d.r = 0; d.st = 4; } }
    }
    for (const d of s.dots) if (d.st === 0) for (const e of s.dots) if ((e.st === 1 || e.st === 2) && Math.hypot(d.x - e.x, d.y - e.y) < e.r + 8) { d.st = 1; s.popped++; s.score += 10 * s.popped; K.tone(PENTA[s.popped % PENTA.length], 0.25, 'sine', 0.05); break; }
    if (s.used && !s.dots.some((d) => d.st >= 1 && d.st <= 3)) { s.phase = 'result'; s.end = 1.8; K.sfx(s.popped >= s.goal ? 'win' : 'lose'); }
  },
  draw(s) {
    const c = K.ctx(); c.globalCompositeOperation = 'lighter';
    s.dots.forEach((d) => { if (d.st === 4) return; const col = d.me ? '#ffffff' : `hsl(${d.h},90%,60%)`; K.alpha(d.st === 0 ? 0.9 : 0.45); K.circle(d.x, d.y, d.r, col); if (d.st > 0) { K.alpha(0.8); K.ring(d.x, d.y, d.r, col, 2); } });
    K.alpha(1); c.globalCompositeOperation = 'source-over';
    K.text(`LEVEL ${s.lv + 1}`, 20, 24, 15, '#fff', 'left', 'd');
    K.text(`${s.popped} / ${s.goal}`, 480, 30, 26, s.popped >= s.goal ? '#3dffa0' : '#fff', 'center', 'd');
    K.text(`${s.score}`, 940, 24, 15, '#ffd93a', 'right', 'd');
    if (!s.used && !K.attract) K.text(`one click - set off ${s.goal} of ${s.dots.length}`, 480, 520, 14, '#8e88b8', 'center', 'u');
    if (s.phase === 'result') K.text(s.popped >= s.goal ? 'CHAIN COMPLETE!' : 'NOT ENOUGH - AGAIN', 480, 270, 34, s.popped >= s.goal ? '#3dffa0' : '#ff8a3a', 'center', 'd', 14);
  },
});
</script></body></html>
