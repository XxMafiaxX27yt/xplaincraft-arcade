<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Time Stops</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"time-stops","n":153,"title":"TIME STOPS","genre":"mystery","desc":"Time only moves when you move. Stand still and the red bullets hang in the air; take a step and the whole room comes alive. Plan your path between the shots, then throw your one shuriken at a gunman (it comes back to you). Clear every room without being touched. Ten rooms.","controls":"WASD / arrows (or the stick) to move · click / tap to throw the shuriken where you point · time only runs while you move or throw","scoreLabel":"ROOMS","tasks":[{"stat":"score","target":5,"text":"Clear 5 rooms in Time Stops"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
function room(s) {
  s.p = { x: 120, y: 270 }; s.bul = []; s.star = null; s.flash = 0; s.phase = 'play';
  const n = Math.min(7, 2 + Math.floor(s.lv * 0.6));
  s.en = Array.from({ length: n }, (_, i) => ({ x: K.rand(520, 900), y: 60 + (i + 0.5) * (420 / n), cool: K.rand(0.8, 2.4), alive: true, walk: s.lv >= 3 && i % 2 === 0, ph: K.rand(0, 6) }));
  s.walls = s.lv >= 2 ? Array.from({ length: Math.min(4, s.lv - 1) }, () => ({ x: K.rand(260, 600), y: K.rand(60, 420), w: 26, h: K.rand(70, 140) })) : [];
}
const inWall = (s, x, y, r) => s.walls.some((w) => x + r > w.x && x - r < w.x + w.w && y + r > w.y && y - r < w.y + w.h);
K.game({
  touch: { buttons: [] },
  bg: '#e8e8ee',
  init(s) { s.lv = 0; s.cleared = 0; room(s); },
  update(s, rdt) {
    if (s.phase === 'clear') { s.t -= rdt; if (s.t <= 0) { s.lv++; s.cleared++; if (s.lv >= 10) return K.end(s, { score: s.cleared, won: true, stats: { won: 1 }, title: 'SUPER. HOT.', text: 'Ten rooms, not a scratch.' }); room(s); } return; }
    if (s.phase === 'dead') { s.t -= rdt; if (s.t <= 0) room(s); return; }
    const d = K.dir(), moving = d.x || d.y, m = K.mouse;
    if (m.clicked && !s.star) { const a = Math.atan2(m.y - s.p.y, m.x - s.p.x); s.star = { x: s.p.x, y: s.p.y, vx: Math.cos(a) * 520, vy: Math.sin(a) * 520, back: false, t: 0 }; s.boost = 0.35; K.sfx('whoosh'); }
    s.boost = Math.max(0, (s.boost || 0) - rdt);
    // the trick: the world only moves as fast as you do
    const scale = moving || s.boost > 0 || s.star ? 1 : 0.04, dt = rdt * scale;
    s.slow = K.lerp(s.slow || 0, scale < 1 ? 1 : 0, rdt * 8);
    if (moving) { const L = Math.hypot(d.x, d.y), nx = s.p.x + (d.x / L) * 190 * rdt, ny = s.p.y + (d.y / L) * 190 * rdt; if (!inWall(s, nx, s.p.y, 12)) s.p.x = K.clamp(nx, 14, 946); if (!inWall(s, s.p.x, ny, 12)) s.p.y = K.clamp(ny, 14, 526); }
    for (const e of s.en) {
      if (!e.alive) continue;
      if (e.walk) { e.ph += dt; e.y = K.clamp(e.y + Math.sin(e.ph) * 60 * dt, 30, 510); }
      e.cool -= dt;
      if (e.cool <= 0) { e.cool = K.rand(1.6, 2.8) - s.lv * 0.08; const a = Math.atan2(s.p.y - e.y, s.p.x - e.x) + K.rand(-0.08, 0.08); s.bul.push({ x: e.x, y: e.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260 }); K.noise(0.05, 0.03, 2000); }
    }
    s.bul.forEach((b) => { b.x += b.vx * dt; b.y += b.vy * dt; if (inWall(s, b.x, b.y, 2)) b.dead = true; });
    s.bul = s.bul.filter((b) => !b.dead && b.x > -20 && b.x < 980 && b.y > -20 && b.y < 560);
    if (s.star) {
      const st = s.star; st.t += rdt;
      if (st.back) { const a = Math.atan2(s.p.y - st.y, s.p.x - st.x); st.vx = Math.cos(a) * 560; st.vy = Math.sin(a) * 560; if (Math.hypot(st.x - s.p.x, st.y - s.p.y) < 18) s.star = null; }
      else if (st.t > 0.9 || st.x < 0 || st.x > 960 || st.y < 0 || st.y > 540 || inWall(s, st.x, st.y, 4)) st.back = true;
      if (s.star) { st.x += st.vx * rdt; st.y += st.vy * rdt; for (const e of s.en) if (e.alive && Math.hypot(e.x - st.x, e.y - st.y) < 20) { e.alive = false; K.sfx('hit'); K.burst(e.x, e.y, ['#ff3355', '#fff'], 18); } }
      s.bul.forEach((b) => { if (s.star && Math.hypot(b.x - s.star.x, b.y - s.star.y) < 12) b.dead = true; });
    }
    if (s.bul.some((b) => Math.hypot(b.x - s.p.x, b.y - s.p.y) < 12)) { s.phase = 'dead'; s.t = 1.2; K.sfx('scare'); K.shake(10); K.flash('#ff3355', 0.3); return; }
    if (s.en.every((e) => !e.alive)) { s.phase = 'clear'; s.t = 1.4; K.sfx('win'); }
  },
  draw(s) {
    s.walls.forEach((w) => K.rect(w.x, w.y, w.w, w.h, '#b8b8c8', 3));
    s.bul.forEach((b) => { const a = Math.atan2(b.vy, b.vx); K.line(b.x - Math.cos(a) * 16, b.y - Math.sin(a) * 16, b.x, b.y, '#ff335566', 3); K.circle(b.x, b.y, 4, '#ff3355'); });
    s.en.forEach((e) => { if (!e.alive) return; K.rect(e.x - 11, e.y - 18, 22, 36, '#ff3355', 6); K.circle(e.x, e.y - 24, 9, '#ff3355'); });
    if (s.star) { const c = K.ctx(); c.save(); c.translate(s.star.x, s.star.y); c.rotate(K.time() * 20); K.poly([[0, -10], [3, -3], [10, 0], [3, 3], [0, 10], [-3, 3], [-10, 0], [-3, -3]], '#333'); c.restore(); }
    K.rect(s.p.x - 10, s.p.y - 16, 20, 32, '#22303c', 6); K.circle(s.p.x, s.p.y - 21, 8, '#22303c');
    if (!s.star && !K.attract) K.circle(s.p.x + 14, s.p.y - 4, 4, '#333');
    if (s.slow > 0.5) { K.alpha((s.slow - 0.5) * 0.3); K.rect(0, 0, 960, 540, '#5a8aff'); K.alpha(1); }
    K.text(`ROOM ${s.lv + 1} / 10`, 20, 22, 15, '#22303c', 'left', 'd');
    if (s.slow > 0.5 && s.phase === 'play') K.text('TIME IS FROZEN', 480, 26, 16, '#3a5aaa', 'center', 'd');
    if (s.phase === 'clear') K.text('SUPER. HOT.', 480, 270, 48, '#ff3355', 'center', 'd');
    if (s.phase === 'dead') K.text('HIT - AGAIN', 480, 270, 36, '#ff3355', 'center', 'd');
  },
  ai(s) { const e = s.en.find((q) => q.alive); if (e && !s.star && Math.random() < 0.05) K.vmouse(e.x, e.y, true); const b = s.bul.find((q) => Math.hypot(q.x - s.p.x, q.y - s.p.y) < 120); K.vhold('ArrowUp', !!b && b.y > s.p.y); K.vhold('ArrowDown', !!b && b.y <= s.p.y); },
});
</script></body></html>
