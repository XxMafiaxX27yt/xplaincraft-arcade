    Object.entries(ROOMS).forEach(([k, nm]) => { const t = roomTiles[k][0]; K.text(nm.toUpperCase(), t[0] * T + 6, t[1] * T + 12, 10, '#ffffff22', 'left', 'd'); });
    s.books.forEach((b) => { K.rect(b.x - 10, b.y - 7, 20, 14, '#e8dcc0', 2); if (b.w) for (let i = 0; i < 3; i++) K.line(b.x - 7, b.y - 3 + i * 3, b.x + 7 - i * 3, b.y - 3 + i * 3, '#8a1010', 1); });
    // UV fingerprints + camera orbs only through the right tool
    if (me.alive && me.tool === 3 && me.fl) s.fp.forEach((f) => { const a = Math.atan2(f.y - me.y, f.x - me.x), d = Math.hypot(f.x - me.x, f.y - me.y); if (d < 230 && Math.abs(Math.atan2(Math.sin(a - me.fa), Math.cos(a - me.fa))) < 0.6) { K.glow('#6aff6a', 8); for (let i = 0; i < 5; i++) K.circle(f.x - 6 + i * 3, f.y - 4 - (i % 2) * 3, 2, '#7aff7a'); K.circle(f.x, f.y + 3, 5, '#7aff7a'); K.noGlow(); } });
    // players
    s.p.forEach((p) => { if (p.hid) return; K.alpha(p.alive ? 1 : 0.35); K.circle(p.x, p.y, 11, p.col); K.circle(p.x + Math.cos(p.fa) * 7, p.y + Math.sin(p.fa) * 7, 3, '#fff'); K.alpha(1); });
    c.restore();
    // darkness: lit rooms, torches, the van
    const lights = [{ x: 90 - cx, y: 440 - cy, r: 140 }];
    s.p.forEach((p) => { if (!p.alive || p.hid) return; lights.push({ x: p.x - cx, y: p.y - cy, r: 46 }); if (p.fl && !(s.hunt > 0 && Math.sin(K.time() * 30) > 0.3)) for (let k = 1; k <= 4; k++) lights.push({ x: p.x - cx + Math.cos(p.fa) * k * 55, y: p.y - cy + Math.sin(p.fa) * k * 55, r: 30 + k * 16 }); });
    Object.keys(s.lights).forEach((rm) => { if (!s.lights[rm] || (s.hunt > 0 && Math.sin(K.time() * 25) > 0)) return; roomTiles[rm].forEach(([x, y], i) => { if (i % 3 === 0) lights.push({ x: x * T + 20 - cx, y: y * T + 20 - cy, r: 70 }); }); });
    if (me.alive) K.darkness(lights, 0.95); else { K.alpha(0.35); K.rect(0, 0, 960, 540, '#000'); K.alpha(1); }
    // the ghost glows in the dark when it shows itself (the dead can always see it)
    if (s.g.vis > 0 || !me.alive) { const gx = s.g.x - cx, gy = s.g.y - cy; K.alpha(me.alive ? 0.7 : 0.35); K.glow('#c8e8ff', 16); K.circle(gx, gy - 10, 13, '#c8d8e8'); K.poly([[gx - 13, gy - 10], [gx - 15, gy + 22], [gx - 5, gy + 14], [gx + 5, gy + 22], [gx + 15, gy + 14], [gx + 13, gy - 10]], '#c8d8e8'); K.noGlow(); K.circle(gx - 5, gy - 12, 3, '#111'); K.circle(gx + 5, gy - 12, 3, '#111'); K.alpha(1); }
    // camera: night vision window
    if (me.alive && me.tool === 4) { const vx = 480 + (me.x - cx - 480) + Math.cos(me.fa) * 110, vy = 270 + (me.y - cy - 270) + Math.sin(me.fa) * 110; c.save(); c.beginPath(); c.arc(vx, vy, 90, 0, 6.28); c.clip(); K.alpha(0.55); K.rect(vx - 90, vy - 90, 180, 180, '#1a4a1a'); K.alpha(1); if (s.type[1].includes(3)) s.orbs.forEach((o, i) => { const ox = o.x - cx + Math.sin(s.time * 0.7 + o.a) * 30, oy = o.y - cy + Math.cos(s.time * 0.5 + o.a) * 22; K.glow('#e8ffe8', 10); K.circle(ox, oy, 3, '#f0fff0'); K.noGlow(); }); c.restore(); K.ring(vx, vy, 90, '#6aff6a', 2); K.text('REC ●', vx - 60, vy - 72, 10, '#ff4a4a', 'left', 'd'); }
    if (s.hunt > 0 && me.alive) { K.alpha(0.15 + 0.1 * Math.sin(K.time() * 9)); K.rect(0, 0, 960, 540, '#ff0000'); K.alpha(1); K.text('IT IS HUNTING - RUN OR HIDE', 480, 70, 22, '#ff4a4a', 'center', 'd', 12); }
    // HUD: tool readout
    const rm = roomOf(me.x, me.y);
    K.rect(0, 0, 960, 44, '#000a'); K.text(rm ? ROOMS[rm] : inVan(me.x, me.y) ? 'THE VAN' : 'OUTSIDE', 14, 22, 15, '#e8e0f0', 'left', 'd');
    K.text(`sanity ${Math.round(me.san)}%`, 250, 22, 13, me.san < 40 ? '#ff6a7a' : '#c8c0e8', 'left', 'd');
    TOOLS.forEach((t, i) => { const on = me.tool === i; K.rect(380 + i * 76, 8, 70, 28, on ? '#2a6a8a' : '#1a1a28', 6); K.text(`${i + 1} ${t}`, 415 + i * 76, 22, 9, on ? '#fff' : '#8a88a8', 'center', 'd'); });
    K.rect(850, 8, 100, 30, s.journal ? '#5a4a2a' : '#2a2238', 6); K.text('JOURNAL (J)', 900, 23, 10, '#ffd93a', 'center', 'd');
    const box = (txt, col = '#c8f0ff') => { K.rect(380, 470, 200, 56, '#0a0a14e8', 8); K.text(txt, 480, 498, 18, col, 'center', 'd'); };
    if (me.alive) {
      if (me.tool === 0) { const lv = s.emf.reduce((a, e) => Math.max(a, Math.hypot(e.x - me.x, e.y - me.y) < 130 ? e.lv : 1), 1); K.rect(380, 470, 200, 56, '#0a0a14e8', 8); for (let i = 0; i < 5; i++) K.rect(396 + i * 36, 482, 28, 30, i < lv ? ['#3dffa0', '#9aff4a', '#ffd93a', '#ff8a3a', '#ff2a2a'][i] : '#2a2a34', 4); if (lv >= 5) K.text('EMF 5!', 480, 462, 14, '#ff4a4a', 'center', 'd'); }
      if (me.tool === 1) { const t = tempOf(s, rm, s.time); box(`${t.toFixed(1)} °C`, t < 0 ? '#9ad8ff' : t < 10 ? '#c8e8ff' : '#e8e0d0'); }
      if (me.tool === 2) box(s.sbT > 0 ? s.sb : 'Space: ask', s.sbT > 0 && s.sb.length < 7 && s.sb === s.sb.toUpperCase() ? '#ff6a6a' : '#c8c0e8');
      if (me.tool === 3) box(me.fl ? 'UV on - look at doors' : 'turn your torch on (F)', '#c89aff');
      if (me.tool === 4) box('looking for orbs...', '#6aff6a');
      if (me.tool === 5) box(s.books.some((b) => b.by === me.id) ? 'book placed' : 'Space: put the book down', '#e8dcc0');
    } else box('you died · you can see it now', '#ff8a8a');
    const hint = inVan(me.x, me.y) ? (me.san < 70 && !me.pills ? 'E: take sanity pills' : 'E: LEAVE (everyone alive must be in the van)') : wardrobeNear(me.x, me.y) ? 'E: hide in the wardrobe' : rm ? `E: lights ${s.lights[rm] ? 'off' : 'on'}` : '';
    if (hint) K.text(hint, 480, 452, 13, '#ffffffcc', 'center', 'u');
    if (s.msgT > 0) K.text(s.msg, 480, 100, 16, '#ffd93a', 'center', 'u', 8);
    if (me.hid) K.text('hiding... (E to come out)', 480, 270, 18, '#c8c0e8', 'center', 'u');
    // journal page
    if (s.journal) {
      K.rect(150, 70, 680, 420, '#e8dcc0', 12); K.text('JOURNAL', 490, 96, 20, '#3a2a1a', 'center', 'd');
      EV.forEach((e, i) => { const v = s.jr.ev[i]; K.rect(180, 120 + i * 40, 220, 34, v === 1 ? '#7ab87a' : v === 2 ? '#c88a7a' : '#f4ecd8', 6); K.text(`${v === 1 ? '✔' : v === 2 ? '✘' : '·'}  ${e}`, 196, 137 + i * 40, 15, '#2a1a10', 'left', 'u'); });
      K.text('click: found ✔ / ruled out ✘', 290, 372, 11, '#6a5a4a', 'center', 'u');
      TYPES.forEach((t, i) => { const fits = t[1].every((e) => s.jr.ev[e] !== 2) && s.jr.ev.every((v, e) => v !== 1 || t[1].includes(e)), x = 470 + (i % 2) * 160, y = 120 + Math.floor(i / 2) * 50; K.rect(x, y, 150, 40, s.jr.pick === i ? '#3a2a1a' : fits ? '#f4ecd8' : '#d8ccb0', 6); K.text(t[0], x + 75, y + 14, 14, s.jr.pick === i ? '#ffd93a' : fits ? '#2a1a10' : '#a89878', 'center', 'd'); K.text(t[1].map((e) => ['EMF 5', 'Spirit Box', 'Prints', 'Orbs', 'Writing', 'Freezing'][e]).join(' · '), x + 75, y + 30, 8, s.jr.pick === i ? '#e8dcc0' : '#7a6a5a', 'center', 'u'); });
      K.text(s.jr.pick >= 0 ? `your answer: ${TYPES[s.jr.pick][0]} - now get everyone to the van and press E` : 'pick the ghost when you are sure', 490, 470, 13, '#3a2a1a', 'center', 'u');
    }
  },
  ai(s, dt) {
    const me = meP(s); if (!me || !s.ready) return; ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach((k) => K.vhold(k, false));
    if (!s.aiT || Math.hypot(s.aiT[0] - me.x, s.aiT[1] - me.y) < 20) { const t = K.pick(roomTiles[Math.random() < 0.5 ? s.groom : 'h']); s.aiT = [t[0] * T + 20, t[1] * T + 20]; }
    const nx = path(Math.floor(me.x / T), Math.floor(me.y / T), Math.floor(s.aiT[0] / T), Math.floor(s.aiT[1] / T)); if (!nx) return;
    if (Math.abs(nx[0] - me.x) > 4) K.vhold(nx[0] > me.x ? 'ArrowRight' : 'ArrowLeft'); if (Math.abs(nx[1] - me.y) > 4) K.vhold(nx[1] > me.y ? 'ArrowDown' : 'ArrowUp');
    K.vmouse(480 + (nx[0] - me.x) * 5, 270 + (nx[1] - me.y) * 5); if (Math.random() < dt * 0.3) me.tool = K.irand(0, 4);
  },
});
function sendJr(s) { if (K.net) K.net.send({ t: 'jr', jr: s.jr }); K.sfx('click'); }
function onEvent(s, e) {
  if (e.kind === 'throw') sfxAt(s, 'knock', e.x, e.y);
  if (e.kind === 'door') sfxAt(s, 'creak', e.x, e.y);
  if (e.kind === 'light' || e.kind === 'switch') sfxAt(s, 'click', e.x, e.y);
  if (e.kind === 'appear') { sfxAt(s, 'whisper', e.x, e.y); }
  if (e.kind === 'write') sfxAt(s, 'whisper', e.x, e.y);
  if (e.kind === 'hunt') { K.sfx('scare'); K.shake(10); s.msg = 'the lights are flickering... IT IS HUNTING'; s.msgT = 3; }
  if (e.kind === 'huntEnd') { s.msg = 'it has stopped hunting'; s.msgT = 2.5; }
  if (e.kind === 'kill') { K.sfx('scare'); K.flash('#fff', 0.3); s.msg = `${e.who} was killed`; s.msgT = 3; }
  if (e.kind === 'noPick') { s.msg = 'pick the ghost in the JOURNAL (J) before you leave'; s.msgT = 2.5; }
  if (e.kind === 'notAll') { s.msg = `${e.n} still inside - everyone alive must be in the van`; s.msgT = 2.5; }
}
