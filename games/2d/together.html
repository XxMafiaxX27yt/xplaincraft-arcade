<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Together</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"together","n":100,"title":"TOGETHER","genre":"mystery","modes":["sp","online","local"],"minPlayers":2,"maxPlayers":4,"desc":"A co-op puzzle platformer: nobody gets out alone. Stand on each other's heads to reach high ledges, hold buttons so a friend can pass, carry the key to the door. Eight levels. Everyone must reach the exit. Solo, you swap between two little blobs.","controls":"← → / A D move · ↑ / W / Space jump · solo: Tab or Q swaps blob (same screen: P1 WASD, P2 arrows + Enter to jump)","scoreLabel":"LEVELS","tasks":[{"stat":"score","target":4,"text":"Clear 4 levels of Together"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const T = 32, GW = 30, GH = 15, OY = 60, PW = 0.78, PH = 0.9, COL = ['#22e6ff', '#ff2bd6', '#3dffa0', '#ffd93a'];
// levels: walls [x,y,w,h], spikes [x,y,w], buttons [x,y], doors [x,y,h] (open while any button is held),
// steps [x,y,w,h] (solid only while any button is held), key [x,y]. Jump = 2.3 tiles, standing on a head adds 0.9.
const LEVELS = [
  { name: 'STACK UP', hint: 'Too high for one: jump on a friend’s head. The button up top makes a step for the last one.', spawn: [3, 13], exit: [27, 10], walls: [[22, 11, 7, 3]], buttons: [[24, 10]], steps: [[19, 12, 2, 2]] },
  { name: 'HOLD THE DOOR', hint: 'A button opens the door only while someone stands on it.', spawn: [3, 13], exit: [27, 13], walls: [[14, 1, 2, 3]], doors: [[15, 4, 10]], buttons: [[7, 13], [21, 13]] },
  { name: 'THE KEY', hint: 'The exit is locked. Somebody has to fetch the key.', spawn: [3, 13], exit: [27, 13], key: [11, 10], walls: [[10, 11, 4, 1]], locked: true },
  { name: 'MIND THE SPIKES', hint: 'Spikes send everyone back to the start. Jump the pits.', spawn: [2, 13], exit: [27, 13], spikes: [[7, 13, 3], [15, 13, 3], [23, 13, 2]], walls: [[11, 12, 2, 2], [19, 12, 2, 2]] },
  { name: 'STAIRS FOR TWO', hint: 'Climb on each other, twice. Buttons make steps for whoever is last.', spawn: [3, 13], exit: [27, 7], walls: [[12, 11, 8, 3], [20, 8, 9, 6]], buttons: [[14, 10], [24, 7]], steps: [[9, 12, 2, 2], [17, 9, 2, 2]] },
  { name: 'BRIDGE OF FRIENDS', hint: 'Hold the button on top so the others can pass. Then someone holds the other one.', spawn: [2, 13], exit: [27, 13], walls: [[8, 11, 4, 3]], doors: [[18, 1, 13]], buttons: [[9, 10], [22, 13]] },
  { name: 'KEY ON THE TOWER', hint: 'Stack to the key, then hold the door for the carrier.', spawn: [12, 13], exit: [27, 13], key: [6, 10], locked: true, walls: [[5, 11, 4, 3], [17, 1, 2, 4]], doors: [[18, 5, 9]], buttons: [[14, 13], [23, 13]] },
  { name: 'ALL TOGETHER', hint: 'Key, buttons, steps and spikes. Everything at once.', spawn: [2, 13], exit: [27, 7], key: [14, 10], locked: true, spikes: [[8, 13, 3]], walls: [[13, 11, 3, 3], [20, 8, 9, 6]], buttons: [[18, 13], [22, 7]], steps: [[11, 12, 2, 2], [17, 9, 2, 1]] },
];
function build(s) {
  const L = LEVELS[s.lv]; s.L = L;
  s.g = Array.from({ length: GH }, (_, y) => Array.from({ length: GW }, (_, x) => (x === 0 || x === GW - 1 || y === 0 || y === GH - 1 ? 1 : 0)));
  (L.walls || []).forEach(([x, y, w, h]) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) s.g[y + j][x + i] = 1; });
  s.spikes = (L.spikes || []).flatMap(([x, y, w]) => Array.from({ length: w }, (_, i) => [x + i, y]));
  s.buttons = (L.buttons || []).map(([x, y]) => ({ x, y, on: false }));
  s.doors = (L.doors || []).map(([x, y, h]) => ({ x, y, h }));
  s.steps = (L.steps || []).flatMap(([x, y, w, h]) => { const c = []; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) c.push([x + i, y + j]); return c; });
  s.key = L.key ? { x: L.key[0], y: L.key[1], holder: null } : null; s.unlocked = !L.locked;
  s.pl.forEach((p, i) => { p.x = L.spawn[0] + i * 1.1; p.y = L.spawn[1] + 0.1 - PH + 1; p.vx = 0; p.vy = 0; p.done = false; });
  s.clear = 0; s.deathT = 0;
}
const solidTile = (s, x, y) => {
  const gx = Math.floor(x), gy = Math.floor(y);
  if (gy < 0 || gx < 0 || gx >= GW || gy >= GH) return true;
  if (s.g[gy][gx]) return true;
  const open = s.buttons.some((b) => b.on);
  if (open && s.steps.some(([x, y]) => x === gx && y === gy)) return true;
  return !open && s.doors.some((d) => gx === d.x && gy >= d.y && gy < d.y + d.h);
};
const boxHits = (s, x, y) => solidTile(s, x, y) || solidTile(s, x + PW, y) || solidTile(s, x, y + PH) || solidTile(s, x + PW, y + PH) || solidTile(s, x + PW / 2, y + PH) || solidTile(s, x + PW / 2, y);
function sim(s, dt) {
  if (s.clear > 0) { s.clear -= dt; if (s.clear <= 0) { s.lv++; s.score = s.lv; if (s.lv >= LEVELS.length) s.done = true; else build(s); } return; }
  if (s.deathT > 0) { s.deathT -= dt; if (s.deathT <= 0) build(s); return; }
  const steps = 3, h = dt / steps;
  for (const p of s.pl) {
    const inp = p.input || { x: 0, y: 0, a: false };
    p.vx = inp.x * 5.6;
    const ground = p.grounded;
    if ((inp.y < 0 || inp.a) && ground && !p.jumpHeld) { p.vy = -11.8; s.fx.push('jump'); }
    p.jumpHeld = inp.y < 0 || inp.a;
    p.grounded = false;
    for (let k = 0; k < steps; k++) {
      p.vy = Math.min(16, p.vy + 30 * h);
      const nx = p.x + p.vx * h; if (!boxHits(s, nx, p.y)) p.x = nx;
      const ny = p.y + p.vy * h;
      if (!boxHits(s, p.x, ny)) {
        // land on a friend's head
        const head = p.vy > 0 && s.pl.find((o) => o !== p && Math.abs(o.x - p.x) < PW * 0.9 && p.y + PH <= o.y + 0.05 && ny + PH >= o.y);
        if (head) { p.y = head.y - PH; p.vy = 0; p.grounded = true; p.x += (head.vx || 0) * h; }
        else p.y = ny;
      } else { if (p.vy > 0) p.grounded = true; p.vy = 0; }
    }
  }
  // buttons, key, spikes, exit
  s.buttons.forEach((b) => (b.on = s.pl.some((p) => p.x + PW > b.x + 0.1 && p.x < b.x + 0.9 && Math.abs(p.y + PH - (b.y + 1)) < 0.3)));
  const anyOn = s.buttons.some((b) => b.on); if (anyOn !== s.wasOn) { s.fx.push(anyOn ? 'power' : 'click'); s.wasOn = anyOn; }
  if (s.key && !s.key.holder) { const p = s.pl.find((p) => Math.abs(p.x + PW / 2 - (s.key.x + 0.5)) < 0.8 && Math.abs(p.y + PH / 2 - (s.key.y + 0.5)) < 0.9); if (p) { s.key.holder = p.id; s.fx.push('coin'); } }
  const ex = s.L.exit;
  if (s.key && s.key.holder && !s.unlocked) { const p = s.pl.find((q) => q.id === s.key.holder); if (Math.abs(p.x + PW / 2 - (ex[0] + 0.5)) < 1 && Math.abs(p.y + PH - (ex[1] + 1)) < 1.2) { s.unlocked = true; s.fx.push('chime'); } }
  for (const p of s.pl) if (s.spikes.some(([x, y]) => p.x + PW > x + 0.15 && p.x < x + 0.85 && p.y + PH > y + 0.4) || p.y > GH) { s.deathT = 0.9; s.fx.push('hit'); return; }
  s.pl.forEach((p) => (p.done = s.unlocked && Math.abs(p.x + PW / 2 - (ex[0] + 0.5)) < 1.3 && Math.abs(p.y + PH - (ex[1] + 1)) < 1.2));
  if (s.pl.every((p) => p.done)) { s.clear = 1.8; s.fx.push('win'); }
}
function finish(s) { if (s.over) return; s.over = true; K.end(s, { score: s.lv, won: s.lv >= LEVELS.length, title: s.lv >= LEVELS.length ? 'TOGETHER, YOU MADE IT' : 'NICE TEAMWORK', text: `${s.lv} of ${LEVELS.length} levels` }); }
K.game({
  get touch() { return K.local ? { buttons: [['Space', 'JUMP']], buttons2: [['Enter', 'JUMP']] } : { buttons: [['KeyQ', 'SWAP'], ['Space', 'JUMP']] }; },
  bg: '#0b0a1a',
  init(s) {
    const seats = K.seats(2).slice(0, 4);
    s.pl = seats.map((p, i) => ({ ...p, col: COL[i], bot: false }));
    s.solo = !K.net && !K.local; s.ctrl = 0; s.lv = 0; s.score = 0; s.inputs = {}; s.fx = []; s.sendT = 0; s.over = false;
    build(s);
  },
  onNet(s, d, from) {
    if (d.t === 'in' && K.net.isHost) s.inputs[from] = d.k;
    if (d.t === 'st' && !K.net.isHost) {
      if (d.lv !== s.lv) { s.lv = d.lv; build(s); }
      d.p.forEach((o, i) => { const p = s.pl[i]; if (p) Object.assign(p, { x: o[0], y: o[1], done: !!o[2], vx: o[3] }); });
      s.buttons.forEach((b, i) => (b.on = !!d.b[i])); if (s.key) s.key.holder = d.kh; s.unlocked = d.u; s.clear = d.c; s.deathT = d.dt;
      d.fx.forEach((f) => K.sfx(f)); if (d.done) finish(s);
    }
  },
  onLeave(s, id) { s.pl = s.pl.filter((p) => p.id !== id); if (s.pl.length < 1) finish(s); },
  update(s, dt) {
    if (!K.isHost()) { s.sendT -= dt; if (s.sendT <= 0) { K.net.send({ t: 'in', k: K.pad() }); s.sendT = 0.04; } return; }
    if (s.solo && K.tap('Tab', 'KeyQ')) { s.ctrl = (s.ctrl + 1) % s.pl.length; K.sfx('select'); }
    // solo: click / tap a blob to take it over (that tap does not also make it jump)
    if (s.solo && K.mouse.clicked) {
      const m = K.mouse, hit = s.pl.findIndex((p) => m.x > p.x * T - 10 && m.x < (p.x + PW) * T + 10 && m.y > OY + p.y * T - 14 && m.y < OY + (p.y + PH) * T + 10);
      if (hit >= 0) { if (hit !== s.ctrl) K.sfx('select'); s.ctrl = hit; s.selHold = true; }
    }
    if (!K.mouse.down) s.selHold = false;
    s.pl.forEach((p, i) => { p.input = s.solo ? (i === s.ctrl ? { ...K.pad(0), a: K.pad(0).a && !s.selHold } : { x: 0, y: 0, a: false }) : p.me ? K.pad(p.local || 0) : s.inputs[p.id] || { x: 0, y: 0, a: false }; });
    sim(s, dt);
    const fx = [...new Set(s.fx.splice(0))]; fx.forEach((f) => K.sfx(f));
    if (K.net) { s.sendT -= dt; if (s.sendT <= 0 || s.done || fx.length) { K.net.send({ t: 'st', lv: s.lv, p: s.pl.map((p) => [+p.x.toFixed(2), +p.y.toFixed(2), p.done ? 1 : 0, +p.vx.toFixed(1)]), b: s.buttons.map((b) => (b.on ? 1 : 0)), kh: s.key?.holder || null, u: s.unlocked, c: s.clear, dt: s.deathT, fx, done: !!s.done }); s.sendT = 0.045; } }
    if (s.done) finish(s);
  },
  draw(s) {
    const L = s.L, open = s.buttons.some((b) => b.on);
    K.text(`LEVEL ${s.lv + 1} · ${L.name}`, 480, 22, 18, '#fff', 'center', 'd');
    K.text(L.hint, 480, 46, 14, '#8e88b8', 'center', 'u');
    for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) if (s.g[y][x]) { K.rect(x * T, OY + y * T, T, T, '#2a2650'); K.rect(x * T, OY + y * T, T, 4, '#3d3870'); }
    s.spikes.forEach(([x, y]) => { for (let k = 0; k < 3; k++) K.poly([[x * T + k * 11, OY + (y + 1) * T], [x * T + k * 11 + 5.5, OY + y * T + 10], [x * T + k * 11 + 11, OY + (y + 1) * T]], '#ff3355'); });
    s.doors.forEach((d) => { if (!open) { K.rect(d.x * T + 6, OY + d.y * T, T - 12, d.h * T, '#c45cff'); for (let j = 0; j < d.h; j++) K.rect(d.x * T + 6, OY + (d.y + j) * T, T - 12, 3, '#8a3acc'); } else K.stroke(d.x * T + 6, OY + d.y * T, T - 12, d.h * T, '#c45cff44', 2); });
    s.steps.forEach(([x, y]) => { if (open) { K.rect(x * T, OY + y * T, T, T, '#1f8a6a'); K.rect(x * T, OY + y * T, T, 4, '#3dffa0'); } else K.stroke(x * T + 3, OY + y * T + 3, T - 6, T - 6, '#3dffa044', 2, 4); });
    s.buttons.forEach((b) => { K.rect(b.x * T + 4, OY + (b.y + 1) * T - (b.on ? 4 : 9), T - 8, b.on ? 4 : 9, b.on ? '#3dffa0' : '#ffd93a', 3); });
    const ex = L.exit; K.glow(s.unlocked ? '#3dffa0' : '#ff3355', 16); K.rect(ex[0] * T - 4, OY + (ex[1] - 1) * T, T + 8, T * 2, s.unlocked ? '#1f8a4a' : '#5a1a28', 6); K.noGlow();
    K.text(s.unlocked ? 'EXIT' : '🔒', ex[0] * T + T / 2, OY + (ex[1] - 1) * T - 10, 12, '#fff', 'center', 'd');
    if (s.key && !s.key.holder) { K.glow('#ffd93a', 14); K.text('🗝', s.key.x * T + T / 2, OY + s.key.y * T + T / 2, 24, '#ffd93a'); K.noGlow(); }
    s.pl.forEach((p, i) => {
      const x = p.x * T, y = OY + p.y * T, w = PW * T, h = PH * T;
      K.glow(p.col, s.solo && i === s.ctrl ? 18 : 8); K.rect(x, y, w, h, p.col, 8); K.noGlow();
      const look = (p.vx || 0) > 0.1 ? 3 : (p.vx || 0) < -0.1 ? -3 : 0;
      K.circle(x + w * 0.33 + look, y + h * 0.38, 3.5, '#111'); K.circle(x + w * 0.67 + look, y + h * 0.38, 3.5, '#111');
      if (s.key && s.key.holder === p.id) K.text('🗝', x + w / 2, y - 12, 16, '#ffd93a');
      if (p.done) K.text('✓', x + w / 2, y - 12, 16, '#3dffa0', 'center', 'd');
      K.text(s.solo ? (i === s.ctrl ? '▼' : 'zz') : p.me && !K.local ? 'YOU' : p.name, x + w / 2, y - (s.key?.holder === p.id || p.done ? 28 : 10), 10, p.col, 'center', 'd');
    });
    if (s.solo) K.text(K.isTouch ? 'SWAP or tap a blob = control the other one' : 'Q / TAB or click a blob = control the other one', 940, 22, 12, '#8e88b8', 'right', 'm');
    if (s.clear > 0) K.text('LEVEL CLEAR!', 480, 300, 40, '#3dffa0', 'center', 'd', 18);
    if (s.deathT > 0) K.text('OUCH - EVERYONE BACK TO THE START', 480, 300, 24, '#ff3355', 'center', 'd', 12);
  },
  ai(s) {
    const p = s.pl[s.ctrl] || s.pl[0], ex = s.L.exit, tx = s.key && !s.key.holder ? s.key.x : ex[0];
    K.vhold('ArrowRight', tx > p.x + 0.5); K.vhold('ArrowLeft', tx < p.x - 0.5);
    K.vhold('ArrowUp', Math.random() < 0.08 || s.g[Math.floor(p.y + 0.5)]?.[Math.floor(p.x + (tx > p.x ? 1.2 : -0.4))]);
    if (Math.random() < 0.01) K.vtap('Tab');
  },
});
</script></body></html>
