<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Knife Throw</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"knife-throw","n":95,"title":"KNIFE THROW","genre":"fun","desc":"Throw every knife into the spinning log without hitting a knife that's already there. Apples on the log are bonus points. Every fifth log is a boss that spins backwards and speeds up without warning.","controls":"Space / click / tap to throw","scoreLabel":"KNIVES","tasks":[{"stat":"score","target":40,"text":"Stick 40 knives in Knife Throw"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const CX = 480, CY = 190, R = 90;
function log(s) {
  s.n++; s.boss = s.n % 5 === 0; s.left = 5 + Math.min(5, s.n) + (s.boss ? 2 : 0); s.stuck = []; s.rot = 0; s.spin = 1.6 + s.n * 0.12; s.flip = 2;
  const pre = Math.min(4, Math.floor(s.n / 2)); for (let i = 0; i < pre; i++) s.stuck.push(K.rand(0, 6.28));
  s.apples = Math.random() < 0.6 ? [K.rand(0, 6.28)] : [];
  s.knife = { y: 470, fly: false };
}
K.game({
  bg: '#140e1e',
  init(s) { s.n = 0; s.score = 0; s.chunks = []; log(s); },
  update(s, dt) {
    s.flip -= dt;
    if (s.boss && s.flip <= 0) { s.spin *= K.pick([-1, -1, 1.6, 0.6]); s.spin = K.clamp(s.spin, -5, 5); if (Math.abs(s.spin) < 1) s.spin = Math.sign(s.spin || 1) * 1.4; s.flip = K.rand(0.8, 2); }
    s.rot += s.spin * dt;
    s.chunks.forEach((c) => { c.vy += 1200 * dt; c.x += c.vx * dt; c.y += c.vy * dt; c.a += c.va * dt; }); s.chunks = s.chunks.filter((c) => c.y < 700);
    const k = s.knife;
    if (!k.fly && (K.tap('Space') || K.mouse.clicked)) { k.fly = true; K.sfx('whoosh'); }
    if (!k.fly) return;
    k.y -= 1900 * dt;
    if (k.y > CY + R) return;
    // hit the log: the bottom of the log is angle PI/2 in world space
    const local = K.wrap(-s.rot, Math.PI * 2);
    if (s.stuck.some((a) => Math.abs(Math.atan2(Math.sin(a - local), Math.cos(a - local))) < 0.16)) { K.sfx('hit'); K.shake(10); s.chunks.push({ x: CX, y: CY + R, vx: K.rand(-200, 200), vy: 300, a: 0, va: 14, knife: true }); return K.end(s, { score: s.score, won: null, title: 'CLANG!', text: `Log ${s.n}, ${s.score} knives` }); }
    s.stuck.push(local); s.score++; s.left--; K.sfx('knock'); K.shake(3);
    s.apples = s.apples.filter((a) => { const hit = Math.abs(Math.atan2(Math.sin(a - local), Math.cos(a - local))) < 0.25; if (hit) { s.score += 3; K.sfx('coin'); K.floatText('+3', CX, CY - R - 20, '#ff3355'); } return !hit; });
    s.knife = { y: 470, fly: false };
    if (s.left <= 0) { K.sfx('win'); for (let i = 0; i < 6; i++) s.chunks.push({ x: CX + K.rand(-60, 60), y: CY + K.rand(-60, 60), vx: K.rand(-300, 300), vy: K.rand(-500, -200), a: 0, va: K.rand(-8, 8) }); log(s); }
  },
  draw(s) {
    const c = K.ctx();
    s.chunks.forEach((ch) => { c.save(); c.translate(ch.x, ch.y); c.rotate(ch.a); if (ch.knife) { K.rect(-4, -40, 8, 60, '#ddd'); } else K.rect(-26, -14, 52, 28, '#8a5a2a', 6); c.restore(); });
    c.save(); c.translate(CX, CY); c.rotate(s.rot);
    s.stuck.forEach((a) => { c.save(); c.rotate(a); K.rect(-4, R - 6, 8, 60, '#e8e8f0', 2); K.rect(-6, R + 54, 12, 26, '#4a2a1a', 3); c.restore(); });
    s.apples.forEach((a) => { c.save(); c.rotate(a); K.circle(0, R + 16, 14, '#ff3355'); K.rect(-1, R + 26, 2, 8, '#3a2a1a'); c.restore(); });
    K.glow(s.boss ? '#ff3355' : '#ffb43a', 20); K.circle(0, 0, R, s.boss ? '#5a1a1a' : '#8a5a2a'); K.noGlow();
    K.ring(0, 0, R * 0.7, s.boss ? '#3a0a0a' : '#6a4220', 3); K.ring(0, 0, R * 0.4, s.boss ? '#3a0a0a' : '#6a4220', 3);
    if (s.boss) { K.circle(-25, -15, 9, '#ffd93a'); K.circle(25, -15, 9, '#ffd93a'); K.circle(-25, -15, 4, '#111'); K.circle(25, -15, 4, '#111'); K.rect(-30, 25, 60, 8, '#111', 4); }
    c.restore();
    const k = s.knife; K.rect(CX - 4, k.y - 60, 8, 60, '#e8e8f0', 2); K.rect(CX - 6, k.y, 12, 26, '#4a2a1a', 3);
    for (let i = 0; i < s.left - 1; i++) { K.rect(40, 500 - i * 22, 26, 6, '#e8e8f0', 2); K.rect(66, 499 - i * 22, 10, 8, '#4a2a1a', 2); }
    K.text(String(s.score), 900, 40, 34, '#fff', 'right', 'd'); K.text(s.boss ? `BOSS LOG ${s.n}` : `LOG ${s.n}`, 900, 76, 14, s.boss ? '#ff3355' : '#8e88b8', 'right', 'd');
  },
  ai(s) { if (s.knife.fly) return; const local = K.wrap(-s.rot, Math.PI * 2); const ahead = K.wrap(local - s.spin * 0.12, Math.PI * 2); if (!s.stuck.some((a) => Math.abs(Math.atan2(Math.sin(a - ahead), Math.cos(a - ahead))) < 0.35)) K.vtap('Space'); },
});
</script></body></html>
