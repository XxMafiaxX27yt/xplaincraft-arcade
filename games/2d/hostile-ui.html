<script>

  { task: 'Close all the pop-ups.', init(L) { L.p = []; for (let i = 0; i < 3; i++) this.add(L); L.fake = 0; },

      else if (K.inRect(m.x, m.y, { x: p.x + 70, y: p.y + 108, w: 120, h: 24 })) { L.p.splice(i, 1); K.sfx('pop'); }

      if (L.fake >= 2) K.text('the X is not your friend', 480, 524, 13, '#ffffffcc', 'center', 'u'); } },
  { task: 'Set the volume to exactly 50.', init(L) { L.v = 87; L.drag = false; L.msg = ''; },

      if (m.clicked && hit({ x: 430, y: 350, w: 100, h: 34 })) { if (L.v === 50) return true; L.msg = `the volume is ${L.v}. that is not 50.`; K.sfx('wrong'); }

      K.rect(300, 292, 360, 6, '#666', 3); const kx = 300 + (L.v / 100) * 360; K.rect(kx - 9, 280, 18, 30, L.drag ? '#e8e8e8' : GREY); K.stroke(kx - 9, 280, 18, 30, '#333', 2);
      btn({ x: 430, y: 350, w: 100, h: 34 }, 'APPLY'); if (L.msg) K.text(L.msg, 480, 396, 12, '#7a1a1a', 'center', 'u'); } },
  { task: 'Click the button 10 times.', init(L) { L.n = 0; L.b = { x: 420, y: 250, w: 120, h: 44 }; },
    update(L) { if (m.clicked && hit(L.b)) { L.n++; K.tone(400 + L.n * 60, 0.06, 'square', 0.03); const sc = Math.pow(0.82, L.n); L.b.w = 120 * sc + 14; L.b.h = 44 * sc + 8; Object.assign(L.b, awayFrom(m.x, m.y, L.b.w, L.b.h, { x: 40, y: 50, w: 880, h: 430 }, 220)); } return L.n >= 10; },
    draw(L) { K.text(`clicks: ${L.n} / 10`, 480, 30, 16, '#fff', 'center', 'd'); btn(L.b, L.n < 6 ? 'CLICK ME' : 'pls', { size: Math.max(8, 14 * Math.pow(0.85, L.n)) }); } },
  { task: 'Read and agree to the terms.', init(L) { L.sc = 0; L.read = false; L.chk = false; L.cf = null; L.msg = ''; L.ly = null; L.lines = []; TERMS.forEach((t) => { const w = t.split(' '); let line = ''; w.forEach((x) => { if ((line + ' ' + x).length > 46) { L.lines.push(line); line = x; } else line = line ? line + ' ' + x : x; }); L.lines.push(line + '.'); L.lines.push(''); }); L.max = L.lines.length * 18 - 200; },
    update(L, dt) {
      if (L.cf) { const c = L.cf; c.cd -= dt; const yb = { x: c.yes ? 500 : 360, y: 300, w: 100, h: 32 }, nb = { x: c.yes ? 360 : 500, y: 300, w: 100, h: 32 };

      const box = { x: 270, y: 120, w: 420, h: 200 }, bar = { x: 672, y: 120, w: 18, h: 200 };

      else if (m.down && hit(box)) { if (L.ly != null) L.sc -= (m.y - L.ly) * 1.6; L.ly = m.y; held = true; } else L.ly = null;
      if (!held) L.sc -= 70 * dt;
      L.sc = K.clamp(L.sc, 0, L.max); if (L.sc >= L.max - 6) L.read = true;
      if (m.clicked && hit({ x: 268, y: 330, w: 260, h: 24 })) { if (L.read) { L.chk = !L.chk; K.sfx('click'); } else { L.msg = 'you have not read them yet'; K.sfx('wrong'); } }
      if (m.clicked && hit({ x: 590, y: 372, w: 100, h: 32 })) { if (L.chk) { L.cf = { yes: false, hops: 0, cd: 0 }; L.msg = ''; } else { L.msg = 'tick the box first'; K.sfx('wrong'); } }
    },

      const c = K.ctx(); K.rect(270, 120, 400, 200, '#fff'); c.save(); c.beginPath(); c.rect(270, 120, 400, 200); c.clip(); L.lines.forEach((t, i) => K.text(t, 278, 132 + i * 18 - L.sc, 12, '#222', 'left', 'u')); c.restore();
      K.rect(672, 120, 18, 200, '#a8a8a8'); K.rect(672, 120 + (L.sc / L.max) * 170, 18, 30, GREY); K.stroke(672, 120 + (L.sc / L.max) * 170, 18, 30, '#444', 1);
      K.rect(270, 333, 18, 18, L.read ? '#fff' : '#ddd'); K.stroke(270, 333, 18, 18, '#555', 2); if (L.chk) K.text('✔', 279, 342, 15, '#111', 'center', 'u'); K.text('I have read and agree to the terms', 296, 342, 12, L.read ? '#111' : '#888', 'left', 'u');
      btn({ x: 590, y: 372, w: 100, h: 32 }, 'AGREE'); if (L.msg) K.text(L.msg, 272, 388, 12, '#7a1a1a', 'left', 'u');
      if (L.cf) { win(330, 230, 300, 120, 'Confirm'); K.text('Are you sure?', 480, 275, 15, '#111', 'center', 'u'); btn({ x: L.cf.yes ? 500 : 360, y: 300, w: 100, h: 32 }, 'YES'); btn({ x: L.cf.yes ? 360 : 500, y: 300, w: 100, h: 32 }, 'NO'); } } },
  { task: 'Sign in: type HELLO and press Enter.', init(L) { L.f = ''; L.t = 2.4; L.shk = 0; },
    update(L, dt) { L.t -= dt; L.shk -= dt; if (L.t <= 0) { L.t = 2.4; if (L.f.length < 12) { const i = K.irand(0, L.f.length); L.f = L.f.slice(0, i) + String.fromCharCode(65 + K.irand(0, 25)) + L.f.slice(i); K.tone(900, 0.04, 'square', 0.02); } }
      const k = K.keyboard(255, 330, 450, {}, { h: 40 }); if (!k) return; if (k === 'BACK') L.f = L.f.slice(0, -1); else if (k === 'ENTER') { if (L.f === 'HELLO') return true; L.shk = 0.3; K.sfx('wrong'); } else if (L.f.length < 12) { L.f += k; K.sfx('tick'); } },
    draw(L) { win(280, 140, 400, 170, 'Sign in'); K.text('Username:', 300, 190, 13, '#111', 'left', 'u'); const sx = L.shk > 0 ? Math.sin(K.time() * 70) * 6 : 0;
      K.rect(300 + sx, 205, 360, 36, '#fff'); K.stroke(300 + sx, 205, 360, 36, '#555', 2); K.text(L.f + (Math.sin(K.time() * 6) > 0 ? '|' : ''), 310 + sx, 224, 20, '#111', 'left', 'd');
      K.text('autocorrect is ON and cannot be turned off', 480, 290, 11, '#7a1a1a', 'center', 'u'); K.keyboard(255, 330, 450, {}, { h: 40 }); } },
  { task: 'Log out.', init(L) { L.open = []; L.msg = ''; L.idle = 0; },
    opn(L, key, x, y) { const items = key === 'root' ? MENU.root.slice() : K.shuffle(MENU[key].slice()); const h = items.length * 26 + 6; L.open.push({ key, items, x, y: K.clamp(y, 40, 496 - h), w: 186, h }); L.idle = 0; },

      for (let d = L.open.length - 1; d >= 0; d--) { const o = L.open[d]; if (!hit(o)) continue; const i = Math.floor((m.y - o.y - 3) / 26); const it = o.items[i]; if (!it) return; L.open.length = d + 1;

function start(s) { s.L = {}; LV[s.lv].init(s.L); s.t = 30; }
K.game({
  bg: '#1a7a7a', typing: true, touch: { stick: false, buttons: [] },
  init(s) { s.lv = 0; s.lives = 3; s.score = 0; s.ok = 0; start(s); },
  update(s, dt) {
    if (s.ok > 0) { s.ok -= dt; if (s.ok <= 0) { s.lv++; if (s.lv >= LV.length) return K.end(s, { score: s.score, won: true, stats: { won: 1 }, title: 'LOGGED OUT', text: `All ${LV.length} jobs done. ${s.score} points. The computer is sulking.` }); start(s); } return; }
    if (s.fail > 0) { s.fail -= dt; if (s.fail <= 0) start(s); return; }

    K.rect(820, 506, 132, 26, '#b0b0b0'); K.text(`${Math.max(0, Math.ceil(s.t))}s`, 886, 519, 14, s.t < 8 ? '#a01010' : '#111', 'center', 'd');
    K.text(`JOB ${s.lv + 1}/${LV.length}: ${LV[s.lv].task}`, 120, 519, 13, '#111', 'left', 'u');
    for (let i = 0; i < 3; i++) K.text(i < s.lives ? '♥' : '♡', 770 + i * 16, 519, 14, '#a01010');

    else if (s.lv === 2) { const p = L.p[L.p.length - 1]; if (p) K.vmouse(p.x + 130, p.y + 120, true); }
    else if (s.lv === 4) K.vmouse(L.b.x + L.b.w / 2, L.b.y + L.b.h / 2, true);
    else K.vmouse(K.rand(200, 760), K.rand(120, 460), false);
  },
});
