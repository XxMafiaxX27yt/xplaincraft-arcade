  return { hand, seats, deck: { x: 330, y: 160, w: 90, h: 132 }, pile: { x: 470, y: 160, w: 90, h: 132 }, lastBtn: { x: 760, y: 324, w: 180, h: 60 }, colors: { r: { x: 320, y: 186, w: 75, h: 80 }, g: { x: 403, y: 186, w: 75, h: 80 }, b: { x: 486, y: 186, w: 75, h: 80 }, y: { x: 569, y: 186, w: 75, h: 80 } } };
}
function back(x, y, w, h) { K.rect(x, y, w, h, '#2a1846', 10); K.stroke(x + 5, y + 5, w - 10, h - 10, '#ff2bd6', 2, 8); K.text('WILD', x + w / 2, y + h / 2, 14, '#ffd93a', 'center', 'd'); }
function card(x, y, w, h, c, lit = false, wildCol = null) {
  const col = isWild(c) ? null : COLS[colOf(c)];
  if (col) K.rect(x, y, w, h, col, 10);
  else { const g = K.ctx().createLinearGradient(x, y, x + w, y + h); g.addColorStop(0, '#ff3355'); g.addColorStop(0.33, '#ffd93a'); g.addColorStop(0.66, '#3dffa0'); g.addColorStop(1, '#22b8ff'); K.ctx().fillStyle = g; K.ctx().beginPath(); K.ctx().roundRect(x, y, w, h, 10); K.ctx().fill(); if (wildCol) K.rect(x + 8, y + 8, w - 16, h - 16, COLS[wildCol] + 'cc', 8); }
  K.ctx().fillStyle = '#ffffffee'; K.ctx().beginPath(); K.ctx().ellipse(x + w / 2, y + h / 2, w * 0.36, h * 0.3, -0.5, 0, 7); K.ctx().fill();
  const t = label(c), big = t.length <= 2;
  K.text(t, x + w / 2, y + h / 2 + 2, big ? w * 0.42 : w * 0.2, col || '#2a1846', 'center', 'd');
  K.text(t, x + 9, y + 13, 11, '#fff', 'left', 'd');
  if (c === 'X') K.text('🔁', x + w / 2, y + h - 16, 16, '#fff'); if (c === 'O') K.text('🌪', x + w / 2, y + h - 16, 16, '#fff');
  K.stroke(x, y, w, h, lit ? '#ffffff' : '#00000055', lit ? 3 : 1, 10);
}
function sound(f) {
  if (f === 'play') K.tone(620, 0.05, 'triangle', 0.04);
  if (f === 'draw') K.tone(400, 0.05, 'triangle', 0.03);
  if (f === 'plus') K.tone(220, 0.15, 'square', 0.05, 220);
  if (f === 'ouch') K.tone(300, 0.3, 'sawtooth', 0.05, -200);
  if (f === 'call') K.tone(880, 0.12, 'square', 0.05);
  if (f === 'rotate') K.noise(0.4, 0.08, 1800);
  if (f === 'win') K.sfx('win');
}
