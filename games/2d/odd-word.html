<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd Word</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"odd-word","n":203,"title":"ODD WORD","genre":"mystery","modes":["sp","online"],"minPlayers":3,"maxPlayers":8,"desc":"Everyone gets the same secret word - except the IMPOSTOR, who gets a close but different one (COFFEE vs TEA, BEACH vs DESERT) and knows it. Every round everybody describes their word in a few words, then everyone votes. Vote out a friend and they are gone; vote out the impostor and they get one last chance: type the real word and steal the win. The impostor also wins by lasting three rounds. Solo against four bots, or online for up to 8.","controls":"Type a short description + Enter (you cannot say your word) · click / tap a player to vote · a caught impostor types a guess + Enter","scoreLabel":"POINTS","tasks":[{"stat":"won","target":1,"text":"Win a game of Odd Word"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script><script src="../kit/partykit.js"></script>
<script>
const MATCHES = 3, ROUNDS = 3, ROLE_T = 7, DESC_T = 40, SEE_T = 9, VOTE_T = 30, GUESS_T = 25, RES_T = 8, KICK_T = 5;
// [crew word, impostor word, hints only the crew word fits, hints only the impostor word fits, hints that fit both]
const PAIRS = [
  ['COFFEE', 'TEA', 'beans espresso barista latte bitter', 'leaves bag kettle herbal green', 'hot cup morning drink caffeine'],
  ['CAT', 'DOG', 'purr meow whiskers litter yarn', 'bark fetch walk bone leash', 'pet fur tail cute paws'],
  ['BEACH', 'DESERT', 'waves swimming towel shells surf', 'cactus camel dunes thirsty oasis', 'sand hot sun sunglasses wide'],
  ['GUITAR', 'VIOLIN', 'strum chords rock pick band', 'bow orchestra chin classical tiny', 'strings music wood tune play'],
  ['PIZZA', 'BURGER', 'slice crust oven pepperoni italian', 'bun patty fries grill ketchup', 'cheese fast food tasty delivery'],
  ['PLANE', 'HELICOPTER', 'wings runway pilot airport passengers', 'rotor hover blades rescue spinning', 'fly sky loud travel high'],
  ['SNOW', 'RAIN', 'snowman white flakes ski sledge', 'umbrella puddle drops wet thunder', 'weather cold clouds falls winter'],
  ['MOON', 'SUN', 'night craters phases werewolf tides', 'day burn bright sunscreen sunrise', 'sky round space light big'],
  ['SCHOOL', 'OFFICE', 'teacher homework students exam recess', 'boss meeting salary laptop coworker', 'desk work bell monday chairs'],
  ['LION', 'TIGER', 'mane pride roar king savanna', 'stripes orange jungle india solo', 'cat big wild claws hunter'],
  ['APPLE', 'ORANGE', 'red crunchy pie core worm', 'peel juice citrus segments vitamin', 'fruit round tree sweet healthy'],
  ['FOOTBALL', 'BASKETBALL', 'goal kick pitch goalkeeper offside', 'hoop dribble dunk court tall', 'ball team sport score match'],
  ['PIRATE', 'NINJA', 'ship parrot treasure eyepatch sea', 'shadow stars japan stealth black', 'sword fight hidden secret warrior'],
  ['VAMPIRE', 'ZOMBIE', 'blood fangs cape bat coffin', 'brains slow rotten groan horde', 'undead night scary monster bite'],
  ['TRAIN', 'BUS', 'tracks station rails carriage tunnel', 'stop driver road seats double', 'ride ticket travel passengers commute'],
  ['ICE CREAM', 'CAKE', 'cone scoop melts frozen sprinkles', 'candles birthday bake slice oven', 'sweet dessert party sugar chocolate'],
  ['PHONE', 'LAPTOP', 'call pocket selfie text ringtone', 'keyboard typing lid work charger', 'screen apps internet battery games'],
  ['DOCTOR', 'DENTIST', 'stethoscope fever hospital prescription checkup', 'teeth drill braces floss cavity', 'clinic white coat patient appointment'],
  ['OCEAN', 'LAKE', 'salt whales tides waves huge', 'fresh calm fishing pier pond', 'water swim boat blue deep'],
  ['CASTLE', 'PALACE', 'moat drawbridge tower siege walls', 'gold gardens luxury ballroom fancy', 'king queen royal old big'],
  ['SPIDER', 'ANT', 'web eight legs silk scary', 'colony tiny picnic queen marching', 'bug insect small crawl many'],
  ['CHESS', 'CARDS', 'king checkmate board pawn knight', 'deck shuffle poker ace deal', 'game play think win table'],
  ['ROBOT', 'ALIEN', 'metal battery beep machine program', 'ufo planet green abduct outer', 'scifi future strange movie space'],
  ['SHARK', 'DOLPHIN', 'fins jaws teeth scary predator', 'smart clicks friendly jumping tricks', 'sea swim grey fast ocean'],
  ['WINTER', 'AUTUMN', 'snow christmas freezing scarf ice', 'leaves orange falling harvest pumpkin', 'cold season jacket wind cozy'],
  ['TOOTHBRUSH', 'COMB', 'teeth paste bristles mouth floss', 'hair tangles parting pocket styling', 'bathroom morning plastic daily mirror'],
  ['MOVIE', 'BOOK', 'popcorn screen actors trailer cinema', 'pages chapters read author library', 'story ending characters plot sequel'],
  ['BICYCLE', 'SKATEBOARD', 'pedals chain bell seat helmet', 'tricks ramp deck kickflip wheels', 'ride street balance fall fun'],
];
const BOTS = [{ id: 'me', name: 'YOU' }, { id: 'b1', name: 'ECHO' }, { id: 'b2', name: 'RUMOUR' }, { id: 'b3', name: 'NOVA' }, { id: 'b4', name: 'PIXEL' }];
const hints = (pi, which) => PAIRS[pi][which].split(' ');
const norm = (w) => String(w || '').toUpperCase().replace(/[^A-Z]/g, '');
const sameWord = (a, b) => { a = norm(a); b = norm(b); return !!a && (a === b || a === b + 'S' || a + 'S' === b || a === b + 'ES'); };
const saysWord = (txt, word) => norm(word).split('').length > 2 && norm(txt).includes(norm(word));

K.game({
  typing: true,
  bg: '#0d0b1c', touch: { stick: false, buttons: [] },
  init(s) {
    if (!K.net) PK.setFake(BOTS);
    s.pts = {}; s.match = 0; s.text = ''; s.sent = false; s.desc = {}; s.vote = null; s.votes = {}; s.warn = 0; s.over = false; s.botT = {};
    s.onPhase = (s) => {
      if (s.ph === 'desc') { s.text = ''; s.sent = false; s.desc = {}; s.botT = {}; }
      if (s.ph === 'vote') { s.vote = null; s.votes = {}; s.botT = {}; }
      if (s.ph === 'guess') { s.text = ''; s.sent = false; s.botT = {}; }
      if (s.ph === 'end') PK.finish(s, s.pd.pts, { win: 'WORD DETECTIVE' });
    };
    s.ph = 'start'; s.t = 1;
  },
  onNet(s, d, from) {
    if (PK.follow(s, d)) return;
    if (!PK.host()) return;
    const alive = s.pd && !s.pd.out.includes(from);
    if (d.t === 'desc' && s.ph === 'desc' && alive) s.desc[from] = String(d.a).slice(0, 32);
    if (d.t === 'vote' && s.ph === 'vote' && alive && !s.pd.out.includes(d.to)) s.votes[from] = d.to;
    if (d.t === 'guess' && s.ph === 'guess' && from === s.pd.imp) resolve(s, d.g);
  },
  onLeave(s, id) {
    delete s.desc[id]; delete s.votes[id];
    if (!PK.host()) return;
    if (PK.players().length < 3) PK.go(s, 'end', 99, { pts: s.pts });
    else if (s.pd && s.pd.imp === id && s.ph !== 'res') PK.go(s, 'res', RES_T, { ...base(s.pd), why: 'left', pts: { ...s.pts } });
  },
  update(s, dt) {
    if (s.over) return;
    s.t -= dt; s.warn -= dt;
    const me = PK.me(), d = s.pd || {}, pl = live(s), meIn = d.out && !d.out.includes(me);
    if (s.ph === 'desc' && !s.sent && meIn && PK.type(s, 'text', 32)) {
      const t = s.text.trim(), mine = d.imp === me ? PAIRS[d.pair][1] : PAIRS[d.pair][0];
      if (!t) {}
      else if (saysWord(t, mine)) { s.warn = 2; K.sfx('error'); }
      else { s.sent = true; s.desc[me] = t; PK.send({ t: 'desc', a: t }); K.sfx('coin'); }
    }
    if (s.ph === 'vote' && !s.vote && meIn && K.mouse.clicked) cards(pl).forEach((c) => { if (c.id !== me && K.inRect(K.mouse.x, K.mouse.y, c)) { s.vote = c.id; s.votes[me] = c.id; PK.send({ t: 'vote', to: c.id }); K.sfx('click'); } });
    if (s.ph === 'guess' && d.imp === me && !s.sent && PK.type(s, 'text', 20) && s.text.trim()) { s.sent = true; K.sfx('click'); if (PK.host()) resolve(s, s.text.trim()); else PK.send({ t: 'guess', g: s.text.trim() }); }
    if (!K.net) bots(s, dt, pl);
    if (!PK.host()) return;
    if (s.ph === 'start' && s.t <= 0) newMatch(s);
    else if (s.ph === 'role' && s.t <= 0) PK.go(s, 'desc', DESC_T, { ...base(d) });
    else if (s.ph === 'desc' && (s.t <= 0 || pl.every((p) => s.desc[p.id]))) {
      const log = JSON.parse(JSON.stringify(d.log)); pl.forEach((p) => (log[p.id] = log[p.id] || []).push(s.desc[p.id] || '…'));
      PK.go(s, 'see', SEE_T, { ...base(d), log });
    } else if (s.ph === 'see' && s.t <= 0) PK.go(s, 'vote', VOTE_T, { ...base(d) });
    else if (s.ph === 'vote' && (s.t <= 0 || pl.every((p) => s.votes[p.id]))) {
      const count = {}; Object.values(s.votes).forEach((v) => (count[v] = (count[v] || 0) + 1));
      const top = Math.max(0, ...Object.values(count)), most = Object.keys(count).filter((k) => count[k] === top);
      const votes = { ...s.votes };
      if (top > 0 && most.length === 1 && most[0] === d.imp) PK.go(s, 'guess', GUESS_T, { ...base(d), votes });
      else {
        const kicked = top > 0 && most.length === 1 ? most[0] : null, out = kicked ? [...d.out, kicked] : d.out, left = pl.length - (kicked ? 1 : 0);
        if (left <= 2 || d.round + 1 >= ROUNDS) { s.pts[d.imp] = (s.pts[d.imp] || 0) + 3; PK.go(s, 'res', RES_T, { ...base(d), out, votes, kicked, why: left <= 2 ? 'few' : 'lasted', pts: { ...s.pts } }); }
        else PK.go(s, 'kick', KICK_T, { ...base(d), out, votes, kicked });
      }
    } else if (s.ph === 'kick' && s.t <= 0) PK.go(s, 'desc', DESC_T, { ...base(d), round: d.round + 1 });
    else if (s.ph === 'guess' && s.t <= 0) resolve(s, '');
    else if (s.ph === 'res' && s.t <= 0) { s.match++; if (s.match >= MATCHES) PK.go(s, 'end', 99, { pts: s.pts }); else newMatch(s); }
  },
  draw(s) {
    const me = PK.me(), d = s.pd;
    if (s.ph === 'start' || s.ph === 'end' || !d) { K.text('ODD WORD', 480, 250, 56, '#fff', 'center', 'd', 20); return; }
    const pl = live(s), all = PK.players(), imp = d.imp === me, word = imp ? PAIRS[d.pair][1] : PAIRS[d.pair][0], meIn = !d.out.includes(me);
    K.text(`MATCH ${s.match + 1} / ${MATCHES} · ROUND ${d.round + 1} / ${ROUNDS}`, 30, 26, 13, '#8e88b8', 'left', 'd');
    PK.bar(640, 22, 260, s);
    // your secret word, always on screen
    K.rect(700, 40, 240, 34, imp ? '#3a1020' : '#102a24', 8);
    K.text(imp ? `IMPOSTOR · ${word}` : `YOUR WORD · ${word}`, 820, 58, 14, imp ? '#ff3355' : '#3dffa0', 'center', 'd');
    if (s.ph === 'role') {
      K.rect(230, 110, 500, 300, imp ? '#2a0c18' : '#0e2620', 18); K.stroke(230, 110, 500, 300, imp ? '#ff3355' : '#3dffa0', 3, 18);
      K.text(imp ? 'YOU ARE THE IMPOSTOR' : 'YOUR SECRET WORD', 480, 160, imp ? 30 : 18, imp ? '#ff3355' : '#8fe8c4', 'center', 'd', 14);
      K.text(word, 480, 220, word.length > 9 ? 40 : 52, imp ? '#ffd6de' : '#3dffa0', 'center', 'd', 16);
      K.wrapText(imp ? 'Everyone else has a DIFFERENT word that is close to yours. Describe yours so you blend in, and work out theirs - if you get caught you can still win by guessing it.'
        : 'One player is an impostor with a similar but different word. Describe yours so your friends can trust you, but not so clearly that the impostor works it out.', 480, 280, 420, 16, imp ? '#ffd6de' : '#d8fff0', 1.3);
      return;
    }
    if (s.ph === 'desc' || s.ph === 'see') {
      K.text(s.ph === 'desc' ? 'DESCRIBE YOUR WORD' : 'WHAT EVERYONE SAID', 480, 96, 28, '#fff', 'center', 'd', 12);
      if (s.ph === 'desc') {
        if (meIn) {
          PK.box(240, 130, 480, 56, s.text, 'a few words… (not the word itself)', !s.sent, imp ? '#ff3355' : '#3dffa0');
          K.text(s.warn > 0 ? 'you cannot say your word!' : s.sent ? 'SENT ✓ waiting for the others' : 'ENTER to send', 480, 206, 14, s.warn > 0 ? '#ff3355' : s.sent ? '#3dffa0' : '#8e88b8', 'center', 'm');
        } else K.text('you were voted out · watching', 480, 160, 18, '#ff8a8a', 'center', 'd');
        pl.forEach((p, i) => K.text((s.desc[p.id] ? '✓ ' : '… ') + (p.id === me ? 'YOU' : p.name), 480 - ((pl.length - 1) * 110) / 2 + i * 110, 236, 12, s.desc[p.id] ? '#3dffa0' : '#5d5a80', 'center', 'd'));
        history(d, all, 280, me);
      } else cardsView(s, d, pl, me, 130, {});
      return;
    }
    if (s.ph === 'vote' || s.ph === 'kick' || s.ph === 'guess' || s.ph === 'res') {
      const votes = s.ph === 'vote' ? s.votes : d.votes || {}, show = s.ph === 'guess' || s.ph === 'res';
      const title = s.ph === 'vote' ? 'WHO HAS THE ODD WORD?' : s.ph === 'kick' ? (d.kicked ? `${d.kicked === me ? 'YOU WERE' : PK.name(d.kicked) + ' WAS'} VOTED OUT` : 'A TIE - NOBODY GOES')
        : s.ph === 'guess' ? 'IMPOSTOR CAUGHT!' : d.why === 'left' ? 'THE IMPOSTOR LEFT' : d.why === 'guess' ? (d.right ? 'THE IMPOSTOR GUESSED IT!' : 'THE IMPOSTOR LOSES') : 'THE IMPOSTOR GOT AWAY';
      K.text(title, 480, 96, 30, s.ph === 'vote' ? '#fff' : '#ffd93a', 'center', 'd', 14);
      if (s.ph === 'kick') K.text(d.kicked ? `${d.kicked === me ? 'you were' : 'they were'} not the impostor… the impostor is still here` : 'nobody got a clear majority', 480, 126, 15, '#c8c0e8', 'center', 'u');
      if (s.ph === 'guess') {
        if (imp) {
          K.text('One chance: what is everyone else\'s word?', 480, 140, 17, '#ffd6de', 'center', 'u');
          PK.box(280, 170, 400, 56, s.text, 'type the word…', !s.sent, '#ff3355');
          K.text(s.sent ? 'locked in…' : 'ENTER to guess', 480, 246, 14, '#8e88b8', 'center', 'm');
          history(d, all, 290, me);
          return;
        }
        K.text(`${PK.name(d.imp)} had ${PAIRS[d.pair][1]}… and is now guessing your word`, 480, 126, 15, '#c8c0e8', 'center', 'u');
      }
      if (s.ph === 'res') K.text(`impostor: ${d.imp === me ? 'YOU' : PK.name(d.imp)} with ${PAIRS[d.pair][1]} · the word was ${PAIRS[d.pair][0]}${d.why === 'guess' ? ' · guessed ' + (d.guess ? d.guess.toUpperCase() : 'nothing') : ''}`, 480, 126, 15, '#d6d2f5', 'center', 'u');
      cardsView(s, d, s.ph === 'res' ? all.filter((p) => !d.out.includes(p.id) || p.id === d.kicked) : pl, me, 150, votes, show);
      if (s.ph === 'vote') K.text(!meIn ? 'you were voted out · watching' : s.vote ? 'voted · waiting…' : 'tap who you think has the odd word', 480, 524, 15, s.vote ? '#3dffa0' : '#8e88b8', 'center', 'u');
      if (s.ph === 'res') { const pts = d.pts || s.pts; K.text(all.map((p) => `${p.id === me ? 'YOU' : p.name} ${pts[p.id] || 0}`).join('   '), 480, 524, 14, '#ffd93a', 'center', 'd'); }
    }
  },
});
const base = (d) => ({ pair: d.pair, imp: d.imp, round: d.round || 0, out: d.out || [], log: d.log || {} });
const live = (s) => PK.players().filter((p) => !s.pd || !s.pd.out || !s.pd.out.includes(p.id));
function newMatch(s) {
  const pl = PK.players(), pi = Math.floor(Math.random() * PAIRS.length);
  PK.go(s, 'role', ROLE_T, { pair: pi, imp: K.pick(pl).id, round: 0, out: [], log: {} });
}
function resolve(s, guess) {
  if (s.ph !== 'guess') return;
  const d = s.pd, right = sameWord(guess, PAIRS[d.pair][0]);
  if (right) s.pts[d.imp] = (s.pts[d.imp] || 0) + 4;
  else PK.players().forEach((p) => { if (p.id !== d.imp && !d.out.includes(p.id)) s.pts[p.id] = (s.pts[p.id] || 0) + 2; });
  PK.go(s, 'res', RES_T, { ...base(d), votes: d.votes, why: 'guess', guess: String(guess || ''), right, pts: { ...s.pts } });
}
function cards(pl, y0 = 150) {
  const n = pl.length, cols = n <= 4 ? n : Math.ceil(n / 2), rows = n <= 4 ? 1 : 2, w = Math.min(210, 880 / cols - 12), h = rows === 1 ? 170 : 160;
  return pl.map((p, i) => { const r = Math.floor(i / cols), c = i % cols, inRow = Math.min(cols, n - r * cols); return { id: p.id, x: 480 - (inRow * (w + 12) - 12) / 2 + c * (w + 12), y: y0 + r * (h + 12), w, h }; });
}
function cardsView(s, d, pl, me, y0, votes, show = false) {
  cards(pl, y0).forEach((c) => {
    const p = pl.find((x) => x.id === c.id), mine = s.vote === c.id, isImp = show && p.id === d.imp;
    K.rect(c.x, c.y, c.w, c.h, isImp ? '#3a1020' : '#17142e', 12); K.stroke(c.x, c.y, c.w, c.h, mine ? '#22e6ff' : isImp ? '#ff3355' : '#2c2850', mine || isImp ? 3 : 2, 12);
    PK.tag(c.x + 12, c.y + 20, p.id, { size: 13 });
    const said = d.log[p.id] || [];
    said.forEach((a, k) => { const last = k === said.length - 1; K.wrapText(String(a || '…'), c.x + c.w / 2, c.y + 50 + k * 36, c.w - 20, last ? 14 : 12, last ? '#fff' : '#8e88b8', 1.15); });
    Object.keys(votes).filter((v) => votes[v] === p.id).forEach((v, k) => K.circle(c.x + c.w - 14 - k * 15, c.y + c.h - 12, 6, PK.col(v)));
    if (isImp) K.text('IMPOSTOR', c.x + c.w - 12, c.y + 20, 11, '#ff3355', 'right', 'd');
  });
}
function history(d, all, y, me) {
  if (!Object.keys(d.log).length) return;
  K.text('SO FAR', 30, y, 11, '#5d5a80', 'left', 'd');
  all.forEach((p, i) => K.text(`${p.id === me ? 'YOU' : p.name}${d.out.includes(p.id) ? ' (out)' : ''}: ${(d.log[p.id] || []).join(' · ')}`.slice(0, 64), 30 + (i % 2) * 450, y + 22 + Math.floor(i / 2) * 20, 13, p.col, 'left', 'u'));
}
// solo: bots describe with hints (the impostor bot leans on hints both words share), vote for whoever sounds least like the real word,
// and a caught impostor bot works the word out from what the others said
function bots(s, dt, pl) {
  const d = s.pd; if (!d || !d.out) return;
  const crewOnly = hints(d.pair, 2), impOnly = hints(d.pair, 3), both = hints(d.pair, 4);
  const said = (id) => (d.log[id] || []).join(' ').toLowerCase();
  pl.forEach((p) => {
    if (p.id === 'me') return;
    s.botT[p.id] = (s.botT[p.id] ?? K.rand(3, 14)) - dt;
    if (s.botT[p.id] > 0) return;
    if (s.ph === 'desc' && !s.desc[p.id]) {
      const used = Object.values(d.log).flat().join(' ').toLowerCase(), fresh = (l) => l.filter((w) => !used.includes(w));
      const pool = p.id === d.imp ? (Math.random() < 0.7 ? fresh(both) : fresh(impOnly)) : Math.random() < 0.55 ? fresh(crewOnly) : fresh(both);
      const a = K.pick(pool.length ? pool : both), b = Math.random() < 0.35 ? K.pick(p.id === d.imp ? both : crewOnly.concat(both)) : null;
      s.desc[p.id] = b && b !== a ? `${a} and ${b}` : a;
    }
    if (s.ph === 'vote' && !s.votes[p.id]) {
      const cands = pl.filter((q) => q.id !== p.id);
      if (p.id === d.imp) s.votes[p.id] = cands.slice().sort((a, b) => sus(a.id) - sus(b.id) + K.rand(-0.8, 0.8))[cands.length - 1].id;
      else s.votes[p.id] = cands.slice().sort((a, b) => sus(b.id) - sus(a.id))[0].id;
    }
    if (s.ph === 'guess' && p.id === d.imp && !s.sent) {
      s.sent = true;
      const clues = Object.entries(d.log).filter(([id]) => id !== d.imp).map(([id]) => said(id)).join(' '), n = crewOnly.filter((w) => clues.includes(w)).length;
      resolve(s, Math.random() < Math.min(0.85, 0.12 + n * 0.22) ? PAIRS[d.pair][0] : K.pick(PAIRS.filter((_, i) => i !== d.pair))[0]);
    }
  });
  function sus(id) { const t = said(id); return impOnly.filter((w) => t.includes(w)).length * 1.4 - crewOnly.filter((w) => t.includes(w)).length + (t.includes('…') ? 0.5 : 0) + Math.random() * 0.9; }
}
</script></body></html>
