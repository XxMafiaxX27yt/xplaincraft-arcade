<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Masks</title>

<script type="application/json" id="meta">{"id":"the-masks","n":183,"title":"THE MASKS","genre":"horror","desc":"In this village nobody opens the door with a bare face. Someone knocks - look through the peephole, then take the right mask off the wall and open up. The rules are on the card, and every night there is one more: red eyes, three knocks, cracked masks, visitors with no shadow. The top rule always wins. Wear the wrong one and it comes inside. Five nights.","controls":"Click / tap a mask (or keys 1 - 6) to wear it and open · KEEP SHUT button (or X) to leave the door closed · follow the rules card, top rule first","scoreLabel":"VISITORS","tasks":[{"stat":"score","target":25,"text":"Answer 25 visitors correctly in The Masks"}]}</script>

<script>
const MASKS = ['fox', 'owl', 'hare', 'wolf', 'crow', 'deer'];   // hung 2 rows x 3: pairs are one above the other

  { night: 2, text: 'THREE knocks → keep the door SHUT' },
  { night: 4, text: 'NO SHADOW → keep the door SHUT' },
  { night: 1, text: 'RED eyes → wear the CROW' },

const PH = { x: 250, y: 270, r: 215 };

function answer(v, n) {

  if (n >= 4 && v.noShadow) return 'shut';
  if (n >= 1 && v.red) return 'crow';
  if (n >= 3 && v.cracked) return PAIR[v.mask];

  else if (type === 'hare') { c.fillStyle = '#ece8e2'; c.beginPath(); c.ellipse(x - r * 0.35, y - r * 1.1, r * 0.2, r * 0.6, -0.15, 0, 6.28); c.ellipse(x + r * 0.35, y - r * 1.1, r * 0.2, r * 0.6, 0.15, 0, 6.28); c.fill(); c.fillStyle = '#e8a0b0'; c.beginPath(); c.ellipse(x - r * 0.35, y - r * 1.1, r * 0.09, r * 0.45, -0.15, 0, 6.28); c.ellipse(x + r * 0.35, y - r * 1.1, r * 0.09, r * 0.45, 0.15, 0, 6.28); c.fill(); c.fillStyle = '#ece8e2'; c.beginPath(); c.ellipse(x, y, r * 0.8, r * 0.9, 0, 0, 6.28); c.fill(); K.circle(x, y + r * 0.35, r * 0.1, '#e88aa0'); eye(x - r * 0.33, y - r * 0.1, r * 0.13); eye(x + r * 0.33, y - r * 0.1, r * 0.13); }
  else if (type === 'wolf') { K.poly([[x - r, y - r], [x - r * 0.5, y - r * 0.55], [x + r * 0.5, y - r * 0.55], [x + r, y - r], [x + r * 0.95, y + r * 0.1], [x + r * 0.3, y + r], [x - r * 0.3, y + r], [x - r * 0.95, y + r * 0.1]], '#7a7e88'); K.poly([[x - r * 0.35, y + r * 0.2], [x + r * 0.35, y + r * 0.2], [x + r * 0.25, y + r], [x - r * 0.25, y + r]], '#b8bcc4'); K.circle(x, y + r * 0.85, r * 0.13, '#101014'); eye(x - r * 0.4, y - r * 0.2, r * 0.13); eye(x + r * 0.4, y - r * 0.2, r * 0.13); }
  else if (type === 'crow') { K.circle(x, y, r * 0.95, '#5a5a6a'); K.circle(x, y, r * 0.88, '#141218'); K.poly([[x - r * 0.3, y + r * 0.05], [x + r * 0.3, y + r * 0.05], [x, y + r * 1.15]], '#5a5a62'); K.line(x - r * 0.3, y + r * 0.05, x + r * 0.3, y + r * 0.05, '#2a2a30', 2); eye(x - r * 0.38, y - r * 0.25, r * 0.13); eye(x + r * 0.38, y - r * 0.25, r * 0.13); K.ring(x - r * 0.38, y - r * 0.25, r * 0.19, '#3a3a44', 2); K.ring(x + r * 0.38, y - r * 0.25, r * 0.19, '#3a3a44', 2); }
  else { for (const sd of [-1, 1]) { K.line(x + sd * r * 0.4, y - r * 0.6, x + sd * r * 0.9, y - r * 1.4, '#c8b08a', r * 0.1); K.line(x + sd * r * 0.7, y - r * 1.05, x + sd * r * 1.15, y - r * 1.1, '#c8b08a', r * 0.08); K.line(x + sd * r * 0.8, y - r * 1.25, x + sd * r * 0.6, y - r * 1.6, '#c8b08a', r * 0.08); } c.fillStyle = '#b8864e'; c.beginPath(); c.ellipse(x, y, r * 0.7, r * 0.95, 0, 0, 6.28); c.fill(); K.poly([[x - r * 0.3, y + r * 0.4], [x + r * 0.3, y + r * 0.4], [x, y + r * 0.95]], '#e8d8b8'); K.circle(x, y + r * 0.82, r * 0.12, '#1a1010'); eye(x - r * 0.32, y - r * 0.15, r * 0.13); eye(x + r * 0.32, y - r * 0.15, r * 0.13); }
  if (o.cracked) { c.strokeStyle = '#050405'; c.lineWidth = Math.max(2, r * 0.06); c.beginPath(); c.moveTo(x - r * 0.2, y - r * 0.9); c.lineTo(x + r * 0.05, y - r * 0.4); c.lineTo(x - r * 0.15, y); c.lineTo(x + r * 0.2, y + r * 0.45); c.lineTo(x, y + r * 0.85); c.moveTo(x + r * 0.05, y - r * 0.4); c.lineTo(x + r * 0.4, y - r * 0.5); c.stroke(); }
}
K.game({
  bg: '#08070a', touch: { stick: false, buttons: [] },
  init(s) { s.n = 0; s.i = 0; s.ok = 0; s.lives = 3; s.pause = 0; s.msg = 'NIGHT 1'; s.sub = 'wear the SAME mask as your visitor'; s.msgT = 3; s.pause = 3; s.v = null; },
  update(s, dt) {
    if (!s.drone && !K.attract) s.drone = K.drone(49, 0.025, 'triangle');
    s.msgT -= dt;
    if (s.pause > 0) { s.pause -= dt; if (s.pause <= 0) visitor(s); return; }
    const v = s.v; s.t -= dt;
    if (s.st === 'knock') { const k = Math.floor((0.4 + v.knocks * 0.45 - s.t - 0.2) / 0.45) + 1; if (k > s.k && k <= v.knocks) { s.k = k; K.noise(0.07, 0.22, 240); K.shake(3); } if (s.t <= 0) { s.st = 'look'; K.tone(1800, 0.05, 'sine', 0.02); } return; }
    if (s.st === 'res') {
      if (s.t <= 0) {
        if (s.lives <= 0) { s.drone?.(); return K.end(s, { score: s.ok, won: false, title: 'IT IS INSIDE', text: `Night ${s.n + 1}. ${s.ok} visitors answered right. The last one did not leave.` }); }
        s.i++; const per = 5 + s.n;
        if (s.i >= per) { s.n++; s.i = 0; if (s.n >= 5) { s.drone?.(); return K.end(s, { score: s.ok, won: true, stats: { won: 1 }, title: 'THE FESTIVAL IS OVER', text: `${s.ok} visitors, ${3 - s.lives} mistake${3 - s.lives === 1 ? '' : 's'}. You hang the masks back up. One of them is still warm.` }); } const r = RULES.find((q) => q.night === s.n); s.msg = `NIGHT ${s.n + 1} · NEW RULE`; s.sub = r.text; s.msgT = 3.5; s.pause = 3.5; K.sfx('creak'); }
        else { s.pause = 0.7; }
        s.v = null;
      }
      return;
    }
    // looking through the peephole: choose
    s.left -= dt;
    let pick = null;
    MASKS.forEach((m, i) => { if (K.tap('Digit' + (i + 1), 'Numpad' + (i + 1)) || (K.mouse.clicked && K.inRect(K.mouse.x, K.mouse.y, slot(i)))) pick = m; });
    if (K.tap('KeyX') || (K.mouse.clicked && K.inRect(K.mouse.x, K.mouse.y, { x: 520, y: 470, w: 416, h: 50 }))) pick = 'shut';
    if (!pick && s.left > 0) return;
    s.pick = pick || 'late'; s.st = 'res'; s.t = 1.5;
    if (pick === v.ans) { s.ok++; s.good = true; K.sfx(pick === 'shut' ? 'knock' : 'chime'); }
    else { s.good = false; s.lives--; K.sfx('scare'); K.flash('#fff', 0.3); K.shake(20); }
  },
  draw(s) {
    const v = s.v, c = K.ctx(), lit = v && s.st !== 'knock';
    // hallway + the door
    K.rect(0, 0, 500, 540, '#0e0b0c'); K.rect(40, 30, 420, 510, '#2a1a12', 6); K.stroke(40, 30, 420, 510, '#1a100a', 6, 6);
    // the peephole (fisheye view of the porch)

      K.rect(0, 380, 500, 160, '#2a2420'); for (let i = 0; i < 8; i++) K.line(i * 70, 380, i * 70 - 100, 540, '#1e1a16', 2);

      K.rect(bx - 70 * sc, 250, 140 * sc, 200, v.coat, 30); K.rect(bx - 22, 228, 44, 30, v.coat);
      K.rect(bx - 50, 440, 34, 14, '#0c0a0a', 4); K.rect(bx + 16, 440, 34, 14, '#0c0a0a', 4);
      const near = s.st === 'res' && !s.good ? 1.6 : 1;

    }

    // fisheye glass + brass ring
    c.fillStyle = K.rgrad(PH.x, PH.y, PH.r, ['rgba(0,0,0,0)', 'rgba(0,0,0,0)', 'rgba(0,0,0,0.85)']); c.beginPath(); c.arc(PH.x, PH.y, PH.r, 0, 6.28); c.fill();
    K.ring(PH.x, PH.y, PH.r + 6, '#8a6a3a', 12); K.ring(PH.x, PH.y, PH.r, '#3a2a14', 3);
    if (s.st === 'knock' && v) for (let k = 0; k < s.k; k++) K.text('KNOCK', PH.x - 80 + k * 80, 90 + k * 22, 26, '#e8d8c0', 'center', 'd', 10);
    if (v && s.st !== 'knock') K.text(`${v.knocks} knock${v.knocks > 1 ? 's' : ''}`, PH.x, 512, 14, '#b8a890', 'center', 'd');
    // the rules card
    K.rect(512, 14, 432, 226, '#d8ccb0', 4); K.rect(512, 14, 432, 26, '#a89870', 4); K.text('THE RULES · top one first', 728, 28, 13, '#2a1a10', 'center', 'd');
    let ry = 60;
    RULES.forEach((r) => { if (r.night > s.n) return; const isNew = r.night === s.n && s.n > 0; if (isNew) K.rect(518, ry - 13, 420, 26, '#ffd93a88', 4); K.wrapText(r.text, 528, ry, 400, 14, '#2a1a10', 1.2, 'left', 'u'); ry += r.text.length > 44 ? 42 : 30; });
    // the masks on the wall
    MASKS.forEach((m, i) => {
      const b = slot(i), hov = K.inRect(K.mouse.x, K.mouse.y, b), chosen = s.st === 'res' && s.pick === m;
      K.rect(b.x, b.y, b.w, b.h, chosen ? (s.good ? '#1e4a2a' : '#5a1a1a') : hov ? '#3a3242' : '#262030', 8);
      mask(m, b.x + b.w / 2, b.y + b.h / 2 + 10, 26, {});
      K.text(`${i + 1}`, b.x + 12, b.y + 14, 12, '#8a80a0', 'center', 'd'); K.text(m.toUpperCase(), b.x + b.w - 8, b.y + b.h - 10, 10, '#8a80a0', 'right', 'd');
    });

    }

  },
  ai(s) { if (s.st !== 'look' || s.limit - s.left < 1.3) return; const a = Math.random() < 0.9 ? s.v.ans : K.pick(MASKS); if (a === 'shut') K.vtap('KeyX'); else K.vtap('Digit' + (MASKS.indexOf(a) + 1)); },
});
