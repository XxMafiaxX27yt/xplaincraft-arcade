<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anagram Blitz</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"anagram-blitz","n":177,"title":"ANAGRAM BLITZ","genre":"mind","desc":"The letters are jumbled - unscramble them into a word before the clock runs out. Every word you solve gives back a few seconds, words get longer as you go, and a streak of quick answers multiplies your points. Any real word that uses all the letters counts.","controls":"Type the word + Enter (phone: tap to open your keyboard) · SHUFFLE mixes the tiles · SKIP costs 5 seconds","scoreLabel":"POINTS","tasks":[{"stat":"score","target":150,"text":"Score 150 points in Anagram Blitz"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script><script src="../kit/words.js"></script>
<script>
const sorted = (w) => [...w].sort().join('');
function next(s) {
  const len = Math.min(8, 4 + Math.floor(s.solved / 3));
  let w; do w = WORDS.pick(len); while (w === s.word);
  s.word = w; s.key = sorted(w); s.inp = '';
  do s.tiles = K.shuffle([...w]); while (s.tiles.join('') === w);
  s.flip = 1; s.t0 = s.time;
}
K.game({
  bg: '#1a1022', typing: true, touch: { stick: false, buttons: [] },
  init(s) { s.time = 75; s.score = 0; s.solved = 0; s.streak = 0; s.best = 0; s.msgT = 0; next(s); },
  update(s, dt) {
    s.time -= dt; s.msgT -= dt; s.flip = Math.max(0, s.flip - dt * 3); s.shakeT = (s.shakeT || 0) - dt;
    if (s.time <= 0) return K.end(s, { score: s.score, won: null, stats: { won: s.solved >= 15 ? 1 : 0 }, title: 'TIME!', text: `${s.solved} words · best streak ${s.best} · the last one was ${s.word.toUpperCase()}` });
    const m = K.mouse;
    if (m.clicked && K.inRect(m.x, m.y, { x: 790, y: 250, w: 140, h: 44 })) { K.shuffle(s.tiles); s.flip = 1; K.sfx('whoosh'); return; }
    if (m.clicked && K.inRect(m.x, m.y, { x: 790, y: 306, w: 140, h: 44 })) { s.msg = `it was ${s.word.toUpperCase()}`; s.msgT = 1.6; s.good = false; s.time -= 5; s.streak = 0; K.sfx('lose'); next(s); return; }
    const k = K.keyboard(255, 384, 450, {}, { h: 42 });
    if (!k) return;
    if (k === 'BACK') s.inp = s.inp.slice(0, -1);
    else if (k === 'ENTER') {
      const w = s.inp.toLowerCase();
      if (w.length === s.word.length && sorted(w) === s.key && WORDS.has(w)) {
        s.solved++; s.streak++; s.best = Math.max(s.best, s.streak);
        const quick = s.t0 - s.time < 6, pts = w.length * (1 + Math.min(4, Math.floor(s.streak / 3))) + (quick ? 3 : 0);
        s.score += pts; s.time = Math.min(99, s.time + 2 + w.length * 0.6);
        s.msg = `${w.toUpperCase()} +${pts}${quick ? ' QUICK!' : ''}`; s.msgT = 1.2; s.good = true; K.sfx('coin'); K.floatText('+' + pts, 480, 140, '#ffd93a', 26); next(s);
      } else { s.shakeT = 0.3; s.streak = 0; K.sfx('wrong'); s.inp = ''; }
    } else if (s.inp.length < s.word.length) { s.inp += k; K.sfx('tick'); }
  },
  draw(s) {
    const n = s.word.length, B = 64, X0 = 480 - (n * (B + 8)) / 2;
    // which tiles are already used by what has been typed
    const used = Array(n).fill(false); [...s.inp.toLowerCase()].forEach((ch) => { const i = s.tiles.findIndex((t, j) => !used[j] && t === ch); if (i >= 0) used[i] = true; });
    s.tiles.forEach((ch, i) => {
      const x = X0 + i * (B + 8), y = 110 + Math.sin(K.time() * 3 + i) * 3, sc = 1 - s.flip * 0.4;
      K.rect(x + (B * (1 - sc)) / 2, y, B * sc, B, used[i] ? '#3a2a4a' : '#ffd93a', 10); K.text(ch.toUpperCase(), x + B / 2, y + B / 2 + 3, 34, used[i] ? '#6a5a7a' : '#2a1a10', 'center', 'd');
    });
    const sh = s.shakeT > 0 ? Math.sin(K.time() * 60) * 7 : 0;
    for (let i = 0; i < n; i++) { const x = X0 + i * (B + 8) + sh; K.stroke(x, 210, B, B, '#c45cff', 2, 10); K.text((s.inp[i] || '').toUpperCase(), x + B / 2, 210 + B / 2 + 3, 32, '#fff', 'center', 'd'); }
    if (s.msgT > 0) K.text(s.msg, 480, 310, 20, s.good ? '#3dffa0' : '#ff8a8a', 'center', 'd');
    // timer + score
    K.rect(40, 30, 880, 12, '#2a1a3a', 6); K.rect(40, 30, (880 * Math.max(0, s.time)) / 99, 12, s.time < 10 ? '#ff3355' : '#c45cff', 6);
    K.text(`${Math.ceil(Math.max(0, s.time))}s`, 40, 64, 18, s.time < 10 ? '#ff3355' : '#fff', 'left', 'd');
    K.text(`${s.score}`, 920, 64, 22, '#ffd93a', 'right', 'd');
    if (s.streak >= 3) K.text(`STREAK ×${1 + Math.min(4, Math.floor(s.streak / 3))}`, 480, 64, 16, '#ff8a3a', 'center', 'd', 10);
    K.button(790, 250, 140, 44, 'SHUFFLE', { color: '#22e6ff', size: 12 }); K.button(790, 306, 140, 44, 'SKIP −5s', { color: '#ff6a7a', size: 12 });
    K.keyboard(255, 384, 450, {}, { h: 42 });
  },
  ai(s, dt) { s.aw = (s.aw || 0) + dt; if (s.aw < 0.15) return; s.aw = 0; if (s.inp.length < s.word.length) K.vtap('Key' + s.word[s.inp.length].toUpperCase()); else K.vtap('Enter'); },
});
</script></body></html>
