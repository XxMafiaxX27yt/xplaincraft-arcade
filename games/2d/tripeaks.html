<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TriPeaks</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"tripeaks","n":142,"title":"TRIPEAKS","genre":"relax","desc":"Three mountain peaks of cards. Take any open card that is one higher or one lower than the card on the pile (King and Ace connect), build long streaks for bonus points, and flip the stock when you run dry. Clear all three peaks to win the round; three rounds a game.","controls":"Click an open card one higher or lower than the pile · click the stock for a new pile card","scoreLabel":"POINTS","tasks":[{"stat":"won","target":1,"text":"Clear all three peaks"},{"stat":"score","target":2000,"text":"Score 2000 in TriPeaks"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script><script src="../kit/cards.js"></script>
<script>
const CW = 62, CH = 86, ROUNDS = 3;
// layout: 3 peaks (rows of 1, 2, 3 per peak) + a bottom row of 10
function slots() {
  const out = [], base = 480 - 4.5 * 66;
  for (let p = 0; p < 3; p++) out.push({ x: base + 1.5 * 66 + p * 198, y: 30, r: 0 });
  for (let p = 0; p < 3; p++) for (let k = 0; k < 2; k++) out.push({ x: base + 66 + p * 198 + k * 66, y: 70, r: 1 });
  for (let p = 0; p < 3; p++) for (let k = 0; k < 3; k++) out.push({ x: base + 33 + p * 198 + k * 66, y: 110, r: 2 });
  for (let k = 0; k < 10; k++) out.push({ x: base + k * 66, y: 150, r: 3 });
  return out;
}
const SL = slots();
// which slots cover slot i (the two cards in the next row that overlap it)
const covers = SL.map((a, i) => SL.map((b, j) => (b.r === a.r + 1 && Math.abs(b.x - a.x) < 40 ? j : -1)).filter((j) => j >= 0));
function round(s) {
  const d = CARDS.deck(1);
  s.t = SL.map((sl) => ({ ...sl, c: d.pop(), gone: false }));
  s.stock = d; s.pile = [s.stock.pop()]; s.pile[0].up = true; s.streak = 0; s.clear = 0;
  flip(s);
}
const open = (s, i) => !s.t[i].gone && covers[i].every((j) => s.t[j].gone);
function flip(s) { s.t.forEach((t, i) => (t.c.up = open(s, i))); }
const fits = (a, b) => Math.abs(a.r - b.r) === 1 || Math.abs(a.r - b.r) === 12;
function canPlay(s) { const top = s.pile[s.pile.length - 1]; return s.t.some((t, i) => open(s, i) && fits(t.c, top)); }
K.game({
  bg: '#0e2a3a', touch: { stick: false, buttons: [] },
  init(s) { s.score = 0; s.round = 0; s.best = 0; round(s); },
  update(s, dt) {
    const m = K.mouse;
    if (s.clear > 0) { s.clear -= dt; if (s.clear <= 0) { s.round++; if (s.round >= ROUNDS) return K.end(s, { score: s.score, won: true, stats: { won: 1 }, title: 'ALL PEAKS CLEARED', text: `Best streak ${s.best}` }); round(s); } return; }
    if (!m.clicked) return;
    if (K.inRect(m.x, m.y, { x: 330, y: 380, w: CW, h: CH })) {
      if (!s.stock.length) return;
      const c = s.stock.pop(); c.up = true; s.pile.push(c); s.streak = 0; K.sfx('click');
      if (!s.stock.length && !canPlay(s)) return over(s);
      return;
    }
    const i = s.t.map((t, k) => k).reverse().find((k) => !s.t[k].gone && K.inRect(m.x, m.y, { x: s.t[k].x, y: s.t[k].y, w: CW, h: CH }));
    if (i == null) return;
    if (!open(s, i)) { K.sfx('wrong'); return; }
    const top = s.pile[s.pile.length - 1];
    if (!fits(s.t[i].c, top)) { K.sfx('wrong'); K.shake(3); return; }
    s.t[i].gone = true; s.pile.push(s.t[i].c); s.streak++; s.best = Math.max(s.best, s.streak);
    const pts = 10 * s.streak + (s.t[i].r === 0 ? 50 : 0); s.score += pts;
    K.tone(400 + Math.min(20, s.streak) * 40, 0.1, 'triangle', 0.06); if (s.t[i].r === 0) { K.sfx('chime'); K.floatText('PEAK! +50', s.t[i].x + CW / 2, s.t[i].y, '#ffd93a', 18); }
    flip(s);
    if (s.t.every((t) => t.gone)) { s.score += 500 + s.stock.length * 20; s.clear = 2; K.sfx('win'); return; }
    if (!s.stock.length && !canPlay(s)) over(s);
  },
  draw(s) {
    s.t.forEach((t, i) => { if (!t.gone) CARDS.draw(t.c, t.x, t.y, CW, CH, { dim: t.c.up && !fits(t.c, s.pile[s.pile.length - 1]) }); });
    if (s.stock.length) { for (let i = 0; i < Math.min(6, s.stock.length); i++) CARDS.draw({ up: false }, 330 - i * 3, 380 - i * 2, CW, CH); } else CARDS.slot(330, 380, CW, CH, '✕');
    K.text(`${s.stock.length}`, 361, 482, 12, '#bff6ff', 'center', 'm');
    CARDS.draw(s.pile[s.pile.length - 1], 470, 380, CW, CH);
    K.text(`SCORE ${s.score}`, 830, 400, 20, '#ffd93a', 'center', 'd');
    K.text(`ROUND ${s.round + 1} / ${ROUNDS}`, 830, 428, 13, '#8e88b8', 'center', 'm');
    if (s.streak > 1) K.text(`STREAK ×${s.streak}`, 830, 460, 18, '#3dffa0', 'center', 'd');
    K.wrapText('Play any open card one higher or lower than the pile. K and A connect.', 130, 400, 220, 13, '#8e88b8', 1.3);
    if (s.clear > 0) K.text('PEAKS CLEARED!', 480, 300, 40, '#3dffa0', 'center', 'd', 18);
  },
  ai(s) { s.aw = (s.aw || 0) + 1; if (s.aw % 20) return; const top = s.pile[s.pile.length - 1]; const i = s.t.findIndex((t, k) => open(s, k) && fits(t.c, top)); if (i >= 0) { s.t[i].gone = true; s.pile.push(s.t[i].c); flip(s); } else if (s.stock.length) { const c = s.stock.pop(); c.up = true; s.pile.push(c); } },
});
function over(s) { K.sfx('lose'); K.end(s, { score: s.score, won: s.round > 0, stats: { won: s.round > 0 ? 1 : 0 }, title: s.round ? `${s.round} ROUND${s.round > 1 ? 'S' : ''} CLEARED` : 'OUT OF CARDS', text: `${s.t.filter((t) => !t.gone).length} cards left · best streak ${s.best}` }); }
</script></body></html>
