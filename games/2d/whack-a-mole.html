<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Whack-a-Mole</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"whack-a-mole","n":14,"title":"WHACK-A-MOLE","genre":"fun","desc":"45 seconds of bonking. Moles pop up faster and faster. Golden moles are worth 5, helmet moles need two hits, and never ever hit the bunny.","controls":"Click / tap the moles (or keys 1-9 on the number pad layout)","scoreLabel":"POINTS","tasks":[{"stat":"score","target":60,"text":"Score 60 in Whack-a-Mole"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const HOLES = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) HOLES.push({ x: 300 + c * 180, y: 170 + r * 130 });
function pop(s) {
  const free = HOLES.map((h, i) => i).filter((i) => !s.m[i]);
  if (!free.length) return;
  const i = K.pick(free), r = Math.random();
  const kind = r < 0.1 ? 'gold' : r < 0.22 && s.time > 10 ? 'helmet' : r < 0.32 && s.time > 6 ? 'bunny' : 'mole';
  s.m[i] = { kind, t: 0, up: Math.max(0.55, 1.3 - s.time * 0.016), hp: kind === 'helmet' ? 2 : 1, hit: 0 };
}
K.game({
  bg: '#3a7a2a',
  init(s) { s.m = Array(9).fill(null); s.score = 0; s.time = 0; s.next = 0.5; s.hammer = 0; },
  update(s, dt) {
    s.time += dt; s.hammer -= dt;
    if (s.time >= 45) return K.end(s, { score: s.score, won: null, title: 'TIME!', text: `${s.score} points` });
    s.next -= dt;
    if (s.next <= 0) { pop(s); if (s.time > 20 && Math.random() < 0.4) pop(s); s.next = Math.max(0.28, 0.9 - s.time * 0.014); }
    s.m.forEach((m, i) => { if (!m) return; m.t += dt; if (m.hit) { m.hit -= dt; if (m.hit <= 0) s.m[i] = null; } else if (m.t > m.up + 0.3) s.m[i] = null; });
    let hitI = -1;
    const NP = [6, 7, 8, 3, 4, 5, 0, 1, 2];
    for (let k = 0; k < 9; k++) if (K.tap('Digit' + (k + 1), 'Numpad' + (k + 1))) hitI = NP[k];
    if (K.mouse.clicked) { s.hammer = 0.12; HOLES.forEach((h, i) => { if (Math.abs(K.mouse.x - h.x) < 60 && K.mouse.y > h.y - 90 && K.mouse.y < h.y + 30) hitI = i; }); }
    if (hitI < 0) return;
    const m = s.m[hitI];
    if (!m || m.hit || m.t < 0.08) return;
    if (m.kind === 'bunny') { s.score = Math.max(0, s.score - 10); K.sfx('wrong'); K.shake(8); K.floatText('-10 POOR BUNNY', HOLES[hitI].x, HOLES[hitI].y - 80, '#ff3355'); m.hit = 0.4; return; }
    m.hp--;
    if (m.hp > 0) { K.sfx('click'); K.floatText('CLANK', HOLES[hitI].x, HOLES[hitI].y - 80, '#ccc', 16); return; }
    const pts = m.kind === 'gold' ? 5 : m.kind === 'helmet' ? 3 : 1;
    s.score += pts; m.hit = 0.35; K.sfx(m.kind === 'gold' ? 'coin' : 'hit'); K.burst(HOLES[hitI].x, HOLES[hitI].y - 40, m.kind === 'gold' ? '#ffd93a' : '#8a5a2a', 10);
    K.floatText('+' + pts, HOLES[hitI].x, HOLES[hitI].y - 90, '#fff');
  },
  draw(s) {
    K.rect(0, 0, 960, 540, K.grad(0, 0, 0, 540, ['#7ac8ff', '#bfe9ff']));
    K.rect(0, 100, 960, 440, '#4a9a34');
    for (let i = 0; i < 40; i++) K.rect((i * 97) % 960, 110 + ((i * 53) % 420), 3, 10, '#3a8a2a');
    const c = K.ctx();
    HOLES.forEach((h, i) => {
      c.fillStyle = '#2a1608'; c.beginPath(); c.ellipse(h.x, h.y, 62, 22, 0, 0, 6.28); c.fill();
      const m = s.m[i];
      if (m) {
        const up = m.hit ? Math.max(0, m.hit / 0.35) : Math.min(1, m.t / 0.12, (m.up + 0.3 - m.t) / 0.12);
        c.save(); c.beginPath(); c.rect(h.x - 70, h.y - 130, 140, 130); c.clip();
        const y = h.y + 10 - up * 70;
        const body = m.kind === 'bunny' ? '#f2f2f2' : m.kind === 'gold' ? '#ffd93a' : '#8a5a2a';
        if (m.kind === 'bunny') { K.rect(h.x - 22, y - 76, 14, 44, '#f2f2f2', 7); K.rect(h.x + 8, y - 76, 14, 44, '#f2f2f2', 7); K.rect(h.x - 18, y - 70, 6, 34, '#ffb3c8', 3); K.rect(h.x + 12, y - 70, 6, 34, '#ffb3c8', 3); }
        c.fillStyle = body; c.beginPath(); c.ellipse(h.x, y, 40, 48, 0, 0, 6.28); c.fill();
        if (m.kind === 'helmet') { c.fillStyle = m.hp > 1 ? '#9aa4b0' : '#6a7480'; c.beginPath(); c.ellipse(h.x, y - 26, 42, 24, 0, Math.PI, 0); c.fill(); }
        const eyes = m.hit ? 'x' : 'o';
        if (eyes === 'x') { K.text('×', h.x - 14, y - 10, 20, '#111'); K.text('×', h.x + 14, y - 10, 20, '#111'); }
        else { K.circle(h.x - 14, y - 10, 5, '#111'); K.circle(h.x + 14, y - 10, 5, '#111'); }
        K.circle(h.x, y + 4, 7, m.kind === 'bunny' ? '#ffb3c8' : '#ff8a8a');
        if (m.kind === 'gold') { K.glow('#fff', 10); K.text('✦', h.x + 26, y - 30, 16, '#fff'); K.noGlow(); }
        c.restore();
      }
      c.fillStyle = '#5a3a1a'; c.beginPath(); c.ellipse(h.x, h.y + 6, 64, 14, 0, 0, Math.PI); c.fill();
    });
    K.text(String(s.score), 40, 50, 40, '#fff', 'left', 'd', 8);
    K.text(`${Math.max(0, Math.ceil(45 - s.time))}`, 920, 50, 34, s.time > 38 ? '#ff3355' : '#fff', 'right', 'd', 8);
    if (!K.attract) { c.save(); c.translate(K.mouse.x, K.mouse.y); c.rotate(s.hammer > 0 ? 0.9 : 0.2); K.rect(-6, -10, 12, 60, '#8a5a2a', 4); K.rect(-26, -30, 52, 26, '#c33', 6); c.restore(); }
  },
  ai(s) { const i = s.m.findIndex((m) => m && !m.hit && m.kind !== 'bunny' && m.t > 0.2); if (i >= 0) K.vmouse(HOLES[i].x, HOLES[i].y - 40, true); },
});
</script></body></html>
