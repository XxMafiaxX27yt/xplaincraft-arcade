<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Elevator</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"the-elevator","n":18,"title":"THE ELEVATOR","genre":"horror","desc":"A note tells you how your floor looks. Ride the elevator, look out when the doors open, and only step out on the right floor. Step out on the wrong one and you're not coming back.","controls":"Click a floor button · ENTER/click STEP OUT · SPACE close doors","scoreLabel":"FLOORS","tasks":[{"stat":"score","target":5,"text":"Find 5 right floors in The Elevator"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const LIGHT = ['white', 'red', 'flickering', 'off'], PLANT = ['a plant', 'no plant'], PAINT = ['a painting', 'a mirror', 'nothing on the wall'], DOOR = ['one door', 'two doors', 'three doors'];
const floorLook = () => ({ light: K.pick(LIGHT), plant: K.pick(PLANT), paint: K.pick(PAINT), doors: K.irand(1, 3), figure: Math.random() < 0.25 });
function round(s) {
  s.floors = Array.from({ length: 9 }, floorLook); s.target = K.irand(0, 8);
  const t = s.floors[s.target]; t.figure = false; if (t.light === 'off') t.light = 'white';
  s.floors.forEach((f, i) => { if (i !== s.target && f.light === t.light && f.plant === t.plant && f.paint === t.paint && f.doors === t.doors) f.doors = (f.doors % 3) + 1; });
  s.note = `Lights: ${t.light}. ${t.plant[0].toUpperCase() + t.plant.slice(1)}. ${t.paint[0].toUpperCase() + t.paint.slice(1)}. ${DOOR[t.doors - 1]}.`;
  s.cur = -1; s.open = 0; s.moving = 0; s.dest = -1;
}
K.game({
  touch: { stick: false, buttons: [['Space', 'CLOSE']] },
  bg: '#0d0c0a',
  init(s) { s.score = 0; s.rides = 0; round(s); },
  update(s, dt) {
    if (s.moving > 0) { s.moving -= dt; if (s.moving <= 0) { s.cur = s.dest; s.open = 0.01; K.sfx('chime'); s.rides++; } return; }
    if (s.open > 0 && s.open < 1) s.open = Math.min(1, s.open + dt * 2);
    for (let i = 0; i < 9; i++) if (K.mouse.clicked && K.dist(K.mouse.x, K.mouse.y, 820 + (i % 3) * 50, 160 + Math.floor(i / 3) * 56) < 22) { s.dest = i; s.open = 0; s.moving = 1.4; K.sfx('click'); K.tone(110, 1.3, 'sawtooth', 0.02); }
    for (let i = 1; i <= 9; i++) if (K.tap('Digit' + i)) { s.dest = i - 1; s.open = 0; s.moving = 1.4; K.sfx('click'); }
    if (s.open >= 1 && (K.tap('Enter') || (K.mouse.clicked && K.inRect(K.mouse.x, K.mouse.y, { x: 760, y: 360, w: 180, h: 54 })))) {
      if (s.cur === s.target) { s.score++; K.sfx('win'); if (s.score >= 7) return K.end(s, { score: 7, won: true, title: 'HOME', text: 'Your own front door. Your own key fits.' }); round(s); }
      else { K.sfx('scare'); K.shake(22); K.flash('#000', 0.6); return K.end(s, { score: s.score, won: false, title: 'WRONG FLOOR', text: 'The doors close behind you. There is no button on this side.' }); }
    }
    if (s.open > 0 && K.tap('Space')) s.open = 0;
    if (s.rides > 14 + s.score * 2) { K.sfx('lose'); K.end(s, { score: s.score, won: false, title: 'THE CABLE SNAPS', text: 'You rode too long.' }); }
  },
  draw(s) {
    K.rect(40, 40, 680, 460, '#1a1712');
    const f = s.floors[s.cur];
    if (f && s.open > 0) {
      const lc = { white: '#d8d4c8', red: '#7a1a1a', flickering: Math.random() < 0.3 ? '#111' : '#bbb5a0', off: '#0a0a0a' }[f.light];
      K.rect(80, 70, 600, 400, lc); K.rect(80, 380, 600, 90, '#2a2420'); K.alpha(0.6); K.rect(80, 70, 600, 400, f.light === 'off' ? 'rgba(0,0,0,0.85)' : 'rgba(0,0,0,0.2)'); K.alpha(1);
      for (let i = 0; i < f.doors; i++) K.rect(130 + i * 170, 200, 90, 180, '#4a3020', 3);
      if (f.paint === 'a painting') { K.rect(560, 130, 90, 70, '#6a4a2a'); K.rect(568, 138, 74, 54, '#3a6a8a'); }
      if (f.paint === 'a mirror') { K.rect(565, 120, 80, 100, '#aac'); K.rect(570, 125, 70, 90, '#cde'); }
      if (f.plant === 'a plant') { K.rect(610, 330, 40, 50, '#7a4a2a'); K.circle(630, 310, 34, '#2a6a2a'); }
      if (f.figure) { K.circle(380, 250, 20, '#000'); K.rect(362, 268, 36, 112, '#000', 10); }
      const w = 300 * (1 - s.open); K.rect(80, 70, w, 400, '#6a6a70'); K.rect(680 - w, 70, w, 400, '#6a6a70');
    } else { K.rect(80, 70, 300, 400, '#6a6a70'); K.rect(380, 70, 300, 400, '#6a6a70'); K.line(380, 70, 380, 470, '#333', 3); }
    if (s.moving > 0) { K.text('▼ ▲', 380, 40, 18, '#f84', 'center', 'd'); K.shake(1); }
    K.rect(740, 40, 200, 460, '#2a2622', 8);
    K.rect(760, 60, 160, 50, '#000'); K.text(s.cur < 0 ? '--' : String(s.cur + 1), 840, 85, 30, '#f84', 'center', 'm', 10);
    for (let i = 0; i < 9; i++) { const x = 820 + (i % 3) * 50 - 50 + 50, y = 160 + Math.floor(i / 3) * 56; K.circle(x - 50 + 50 - 50 + 50, y, 20, s.dest === i ? '#f84' : '#555'); K.text(String(i + 1), x, y, 16, '#fff', 'center', 'd'); }
    K.button(760, 360, 180, 54, 'STEP OUT', { color: K.C.green });
    K.rect(40, 506, 900, 28, '#f2e8c8', 4); K.text('NOTE: ' + s.note, 490, 520, 15, '#3a2a10', 'center', 'm');
    K.text(`FLOOR ${s.score + 1} OF 7`, 840, 450, 14, '#ccc', 'center', 'd');
  },
  ai(s, dt) { s.aiT = (s.aiT || 0) - dt; if (s.aiT <= 0 && s.moving <= 0) { s.aiT = 2.5; K.vtap('Digit' + K.irand(1, 9)); } },
});
</script></body></html>
