<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bowling</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"bowling","n":31,"title":"BOWLING","genre":"fun","desc":"Ten frames of neon bowling with real scoring: strikes, spares, the tenth-frame bonus. Set your position, aim the arrow, then time the power and the spin. Pins knock into each other.","controls":"← → position · Space to lock aim, then power, then spin (or tap three times)","scoreLabel":"PINS","tasks":[{"stat":"score","target":120,"text":"Score 120 in Bowling"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
// lane is drawn top-down: ball rolls up the screen
const LX = 340, LW = 280, TOP = 50, FOUL = 470, PR = 9;
const PINPOS = [[0, 0], [-1, 1], [1, 1], [-2, 2], [0, 2], [2, 2], [-3, 3], [-1, 3], [1, 3], [3, 3]];
function rack(s) { s.pins = PINPOS.map(([c, r]) => ({ x: 480 + c * 22, y: 120 - r * 22, vx: 0, vy: 0, down: false })); }
function newBall(s) { s.ball = null; s.phase = 'pos'; s.bx = 480; s.ang = 0; s.pow = 0; s.spin = 0; s.meter = 0; s.mdir = 1; }
function total(fr) {
  let t = 0; const rolls = fr.flat();
  let i = 0;
  for (let f = 0; f < 10; f++) {
    if (rolls[i] === undefined) break;
    if (rolls[i] === 10) { if (rolls[i + 2] === undefined) break; t += 10 + rolls[i + 1] + rolls[i + 2]; i += 1; }
    else if (rolls[i] + (rolls[i + 1] ?? 0) === 10) { if (rolls[i + 2] === undefined) break; t += 10 + rolls[i + 2]; i += 2; }
    else { if (rolls[i + 1] === undefined) break; t += rolls[i] + rolls[i + 1]; i += 2; }
  }
  return t;
}
K.game({
  bg: '#0a0614',
  init(s) { s.frames = [[]]; rack(s); newBall(s); s.msg = ''; s.msgT = 0; s.score = 0; },
  update(s, dt) {
    s.msgT -= dt;
    const lock = K.tap('Space') || K.mouse.clicked;
    if (s.phase === 'pos') { const d = K.dir(); s.bx = K.clamp(s.bx + d.x * 200 * dt, LX + 20, LX + LW - 20); if (K.mouse.moved) s.bx = K.clamp(K.mouse.x, LX + 20, LX + LW - 20); s.ang = Math.sin(K.time() * 2.2) * 0.25; if (lock) s.phase = 'power'; }
    else if (s.phase === 'power') { s.meter += s.mdir * dt * 1.6; if (s.meter > 1 || s.meter < 0) { s.mdir *= -1; s.meter = K.clamp(s.meter, 0, 1); } if (lock) { s.pow = 0.45 + s.meter * 0.55; s.phase = 'spin'; s.meter = 0.5; } }
    else if (s.phase === 'spin') { s.meter += s.mdir * dt * 2; if (s.meter > 1 || s.meter < 0) { s.mdir *= -1; s.meter = K.clamp(s.meter, 0, 1); } if (lock) { s.spin = (s.meter - 0.5) * 2; s.standBefore = s.pins.filter((p) => !p.down).length; s.ball = { x: s.bx, y: FOUL, vx: Math.sin(s.ang) * 620 * s.pow, vy: -Math.cos(s.ang) * 620 * s.pow }; s.phase = 'roll'; K.sfx('whoosh'); } }
    else if (s.phase === 'roll' || s.phase === 'settle') {
      const b = s.ball;
      if (b) { b.vx += s.spin * 260 * dt * (b.y < 300 ? 1 : 0.2); b.x += b.vx * dt; b.y += b.vy * dt; if (Math.random() < dt * 20) K.noise(0.05, 0.02, 200); if (b.x < LX + 10 || b.x > LX + LW - 10) { b.vx = 0; b.x = K.clamp(b.x, LX + 10, LX + LW - 10); b.gutter = true; } if (b.y < TOP - 20) s.ball = null; }
      for (const p of s.pins) {
        if (b && !b.gutter && !p.down && Math.hypot(p.x - b.x, p.y - b.y) < PR + 14) { const a = Math.atan2(p.y - b.y, p.x - b.x); p.vx = Math.cos(a) * 380 + b.vx * 0.3; p.vy = Math.sin(a) * 380 + b.vy * 0.4; p.down = true; K.sfx('knock'); b.vx *= 0.92; }
        if (p.down) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(0.15, dt); p.vy *= Math.pow(0.15, dt); for (const q of s.pins) if (!q.down && Math.hypot(p.x - q.x, p.y - q.y) < PR * 2 && Math.hypot(p.vx, p.vy) > 60) { q.down = true; const a = Math.atan2(q.y - p.y, q.x - p.x), sp = Math.hypot(p.vx, p.vy) * 0.75; q.vx = Math.cos(a) * sp; q.vy = Math.sin(a) * sp; K.sfx('knock'); } }
      }
      if (!s.ball && s.phase === 'roll') { s.phase = 'settle'; s.t = 1; }
      if (s.phase === 'settle') { s.t -= dt; if (s.t <= 0) roll(s); }
    }
  },
  draw(s) {
    K.rect(LX - 30, TOP - 30, LW + 60, FOUL - TOP + 80, '#120a24'); K.rect(LX, TOP - 30, LW, FOUL - TOP + 80, K.grad(LX, 0, LX + LW, 0, ['#c99a5a', '#e0b878', '#c99a5a']));
    for (let i = 1; i < 14; i++) K.line(LX + i * 20, TOP - 30, LX + i * 20, FOUL + 50, '#00000014', 1);
    for (let i = 0; i < 7; i++) K.poly([[LX + 40 + i * 33, 330], [LX + 46 + i * 33, 318], [LX + 52 + i * 33, 330]], '#8a3a2a');
    K.rect(LX, FOUL, LW, 3, '#ff3355');
    K.rect(LX - 30, TOP - 30, 30, FOUL - TOP + 80, '#2a1a3a'); K.rect(LX + LW, TOP - 30, 30, FOUL - TOP + 80, '#2a1a3a');
    s.pins.forEach((p) => { if (p.down && Math.hypot(p.vx, p.vy) < 5 && (p.x < LX || p.x > LX + LW || p.y < TOP - 40)) return; K.circle(p.x, p.y, PR, p.down ? '#ddd' : '#fff'); K.ring(p.x, p.y, PR * 0.55, '#ff3355', 2); });
    const bx = s.ball ? s.ball.x : s.bx, by = s.ball ? s.ball.y : FOUL;
    K.glow('#22e6ff', 14); K.circle(bx, by, 14, '#2a4aaf'); K.noGlow(); K.circle(bx - 4, by - 4, 2, '#fff'); K.circle(bx + 3, by - 5, 2, '#fff'); K.circle(bx, by + 2, 2, '#fff');
    if (s.phase === 'pos' || s.phase === 'power' || s.phase === 'spin') { K.line(s.bx, FOUL - 20, s.bx + Math.sin(s.ang) * 160, FOUL - 20 - Math.cos(s.ang) * 160, '#ffd93a', 3); }
    if (s.phase === 'power' || s.phase === 'spin') { const lbl = s.phase === 'power' ? 'POWER' : 'SPIN'; K.rect(700, 220, 30, 220, '#222', 6); K.rect(700, 440 - 220 * s.meter, 30, 220 * s.meter, s.phase === 'power' ? '#ff8a3a' : '#c45cff', 6); K.text(lbl, 715, 460, 12, '#fff', 'center', 'd'); if (s.phase === 'spin') K.text('← hook · · · hook →', 715, 200, 10, '#c9c3ff', 'center', 'm'); }
    // scoreboard
    for (let f = 0; f < 10; f++) { const x = 20 + f * 30, fr = s.frames[f] || []; K.rect(x, 495, 28, 36, f === s.frames.length - 1 ? '#2a2050' : '#16122a', 3); K.text(fr.map((v, i) => (v === 10 && (i === 0 || f === 9) ? 'X' : i > 0 && fr[i - 1] + v === 10 && fr[i - 1] !== 10 ? '/' : v || '-')).join(''), x + 14, 505, 9, '#fff', 'center', 'm'); }
    K.text(`TOTAL ${total(s.frames)}`, 940, 30, 20, '#ffd93a', 'right', 'd');
    if (s.msgT > 0) K.text(s.msg, 480, 250, 40, '#ffd93a', 'center', 'd', 18);
    K.text(s.phase === 'pos' ? 'move ← →, then SPACE / tap' : s.phase === 'power' ? 'SPACE / tap for power' : s.phase === 'spin' ? 'SPACE / tap for spin' : '', 160, 300, 13, '#c9c3ff', 'center', 'u');
  },
  ai(s) { s.aw = (s.aw || 0) + 1; if (s.phase === 'pos' && s.aw % 40 === 0) K.vtap('Space'); if (s.phase === 'power' && s.meter > 0.85) K.vtap('Space'); if (s.phase === 'spin' && Math.abs(s.meter - 0.5) < 0.05) K.vtap('Space'); },
});
function roll(s) {
  const standing = s.pins.filter((p) => !p.down).length, knocked = s.standBefore - standing;
  const fr = s.frames[s.frames.length - 1], f = s.frames.length;
  fr.push(knocked);
  if (knocked === 10) { s.msg = 'STRIKE!'; s.msgT = 1.4; K.sfx('win'); }
  else if (standing === 0) { s.msg = 'SPARE!'; s.msgT = 1.2; K.sfx('coin'); }
  else if (knocked === 0) { s.msg = 'MISS'; s.msgT = 0.8; }
  if (f < 10) {
    if (fr[0] === 10 || fr.length === 2) { s.frames.push([]); rack(s); }
    else s.pins = s.pins.filter((p) => !p.down);
  } else {
    if (fr.length === 3 || (fr.length === 2 && fr[0] + fr[1] < 10)) { s.score = total(s.frames); return K.end(s, { score: s.score, won: null, title: s.score >= 200 ? 'BOWLING LEGEND' : s.score >= 120 ? 'GREAT GAME' : 'GAME OVER', text: `Final score ${s.score}` }); }
    if (standing === 0) rack(s); else s.pins = s.pins.filter((p) => !p.down);
  }
  newBall(s);
}
</script></body></html>
