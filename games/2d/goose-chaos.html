<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goose Chaos</title>

<script type="application/json" id="meta">{"id":"goose-chaos","n":185,"title":"GOOSE CHAOS","genre":"mystery","desc":"It is a lovely day in the garden, and you are a horrible goose. Work through today's to-do list: steal his keys, his sandwich, his hat, sink his radio, trip him over his own rake, honk while he reads. He chases you if he sees you with his things - but he cannot follow you into the pond. HONK makes him jump and drop whatever he is holding.","controls":"WASD / arrows / stick to waddle · Space (GRAB) to pick up or drop · E (HONK) to honk · drop things on your nest or in the pond","scoreLabel":"POINTS","tasks":[{"stat":"score","target":500,"text":"Finish a whole to-do list in Goose Chaos"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const SHED = { x: 30, y: 40, w: 150, h: 110 }, POND = 700, NEST = { x: 850, y: 290 }, EDGE = 680;
const SPOTS = { shed: { x: 120, y: 200, t: 3, do: 'tidying the shed' }, patch: { x: 170, y: 350, t: 4, do: 'weeding' }, bench: { x: 470, y: 135, t: 6, do: 'reading' }, picnic: { x: 420, y: 360, t: 3, do: 'having lunch' } };
const ROUTE = ['shed', 'patch', 'bench', 'picnic'];
const TASKS = {
  keys: { text: 'put his KEYS in your nest', item: 'keys', to: 'nest' },
  sandwich: { text: 'put his SANDWICH in your nest', item: 'sandwich', to: 'nest' },
  carrots: { text: 'put 3 CARROTS in your nest', item: 'carrot', to: 'nest', need: 3 },
  hat: { text: 'steal his HAT (honk first) → nest', item: 'hat', to: 'nest' },
  radio: { text: 'drop his RADIO in the pond', item: 'radio', to: 'pond' },
  bell: { text: 'drop the BELL in the pond', item: 'bell', to: 'pond' },
  rake: { text: 'make him trip over his RAKE', special: true },
  honk: { text: 'honk at him 3× while he reads', special: true },
};
const ICON = { keys: '🔑', sandwich: '🥪', carrot: '🥕', radio: '📻', bell: '🔔' };
const item = (id, x, y, st = 'home') => ({ id, x, y, home: { x, y }, st, heavy: id === 'radio' });
const inPond = (x, y) => x > POND && Math.hypot(x - NEST.x, y - NEST.y) > 52;
function hitShed(o, r) { const cx = K.clamp(o.x, SHED.x, SHED.x + SHED.w), cy = K.clamp(o.y, SHED.y, SHED.y + SHED.h), d = Math.hypot(o.x - cx, o.y - cy); if (d < r) { const a = d ? Math.atan2(o.y - cy, o.x - cx) : Math.PI / 2; o.x = cx + Math.cos(a) * r; o.y = cy + Math.sin(a) * r; } }
K.game({
  bg: '#4f8a3e', touch: { buttons: [['Space', 'GRAB'], ['KeyE', 'HONK']] },
  init(s) {
    s.goose = { x: 820, y: 400, fx: -1, fy: 0, carry: null, honk: 0, vx: 0, vy: 0 };
    s.items = [item('keys', 110, 168), item('sandwich', 460, 430), item('radio', 565, 112), item('bell', 630, 70), item('rake', 205, 175),
      item('carrot', 95, 425, 'planted'), item('carrot', 150, 455, 'planted'), item('carrot', 210, 425, 'planted'), item('carrot', 250, 460, 'planted')];
    s.items.push({ id: 'hat', x: 0, y: 0, home: null, st: 'worn' });
    s.g = { x: 120, y: 200, st: 'work', t: 2, wp: 0, hold: null, hat: true, say: '', sayT: 0 };
    s.list = K.shuffle(Object.keys(TASKS)).slice(0, 5); s.done = {}; s.honks = 0; s.time = 180; s.bonus = 0;
  },
  update(s, dt) {
    s.time -= dt;
    const G = s.goose, g = s.g, d = K.dir(), L = Math.hypot(d.x, d.y) || 1;
    // the goose
    const swim = inPond(G.x, G.y), sp = (swim ? 130 : 190) * (G.carry?.heavy ? 0.72 : 1);
    G.x += (d.x / L) * sp * dt + G.vx * dt; G.y += (d.y / L) * sp * dt + G.vy * dt; G.vx *= Math.pow(0.02, dt); G.vy *= Math.pow(0.02, dt);
    if (d.x || d.y) { G.fx = d.x / L; G.fy = d.y / L; G.step = (G.step || 0) + dt; }
    G.x = K.clamp(G.x, 36, 930); G.y = K.clamp(G.y, 46, 506); hitShed(G, 16);
    const bx = G.x + G.fx * 22, by = G.y + G.fy * 22 - 8;
    if (K.tap('Space')) {
      if (G.carry) {
        const it = G.carry; G.carry = null; it.x = bx; it.y = by + 8;
        if (Math.hypot(it.x - NEST.x, it.y - NEST.y) < 60) { it.st = 'nest'; it.x = NEST.x + K.rand(-22, 22); it.y = NEST.y + K.rand(-14, 14); K.sfx('coin'); }
        else if (inPond(it.x, it.y)) { it.st = 'pond'; K.sfx('splash'); K.burst(it.x, it.y, '#9ad8ff', 14); it.sunk = 1.2; }
        else { it.st = 'ground'; K.sfx('step'); }

        const it = s.items.filter((q) => (q.st === 'home' || q.st === 'ground' || q.st === 'planted') && Math.hypot(q.x - bx, q.y - by - 8) < 38).sort((a, b) => Math.hypot(a.x - bx, a.y - by) - Math.hypot(b.x - bx, b.y - by))[0];
        if (it) { if (it.st === 'planted') { K.sfx('pop'); K.burst(it.x, it.y, '#6a4a2a', 8); } else K.sfx('select'); it.st = 'goose'; G.carry = it; }
      }

    if (K.tap('KeyE', 'KeyH') && G.honk <= 0) {
      G.honk = 0.45; K.tone(330, 0.16, 'sawtooth', 0.07, -60); K.tone(400, 0.12, 'square', 0.03, -80);
      if (Math.hypot(g.x - G.x, g.y - G.y) < 150 && g.st !== 'stun' && g.st !== 'trip') {
        if (g.st === 'work' && ROUTE[g.wp] === 'bench') { s.honks++; if (s.honks >= 3) s.done.honk = true; }
        if (g.hold) { const it = g.hold; g.hold = null; it.st = 'ground'; it.x = g.x + K.rand(-20, 20); it.y = g.y + 24; }
        else if (g.hat) { g.hat = false; const h = s.items.find((q) => q.id === 'hat'); h.st = 'ground'; h.x = g.x + K.rand(-30, 30); h.y = g.y + 30; }
        g.st = 'stun'; g.t = 1.3; g.say = '!!'; g.sayT = 1; K.shake(4);
      }
    }
    // things sinking, carrots + the rest that fell in the pond come back to the bank

    // the gardener
    g.sayT -= dt; g.t -= dt;
    const carrying = G.carry && G.x < POND + 20, dG = Math.hypot(G.x - g.x, G.y - g.y);
    const walk = (tx, ty, v) => { const a = Math.atan2(ty - g.y, tx - g.x), dd = Math.hypot(tx - g.x, ty - g.y); g.x += Math.cos(a) * Math.min(dd, v * dt); g.y += Math.sin(a) * Math.min(dd, v * dt); g.x = Math.min(g.x, EDGE); hitShed(g, 18); g.moving = dd > 2; return dd < 6; };
    g.moving = false;
    if (g.st === 'stun' || g.st === 'trip') { if (g.t <= 0) { g.st = dG < 240 && G.x < POND ? 'chase' : 'route'; g.t = 4; } }
    else {
      if (g.st !== 'chase' && g.st !== 'return' && carrying && dG < 260) { g.st = 'chase'; g.t = 6; g.say = 'HEY!'; g.sayT = 1.2; K.tone(180, 0.2, 'square', 0.04, 60); }
      if (g.st === 'route' || g.st === 'work') { const lost = s.items.find((q) => q.st === 'ground' && q.id !== 'hat' && Math.hypot(q.x - g.x, q.y - g.y) < 250 && q.x < EDGE + 5); if (lost && !(lost.id === 'rake' && !g.sawRake)) { g.st = 'fetch'; g.tgt = lost; } }
      if (g.st === 'chase') {
        if (G.x > POND - 4) { if (walk(EDGE, G.y, 150)) { g.say = '#@!'; g.sayT = 0.5; } g.t -= dt; if (g.t <= 3) g.st = 'route'; }
        else if (dG > 360 || g.t <= 0) g.st = 'route';
        else { walk(G.x, G.y, 182); if (dG < 30) { if (G.carry) { const it = G.carry; G.carry = null; it.st = 'gardener'; g.hold = it; g.st = 'return'; } else g.st = 'route'; const a = Math.atan2(G.y - g.y, G.x - g.x); G.vx = Math.cos(a) * 420; G.vy = Math.sin(a) * 420; K.sfx('hit'); g.say = 'GOTCHA'; g.sayT = 1; } }
      } else if (g.st === 'fetch') {
        const it = g.tgt; if (it.st !== 'ground') g.st = 'route';
        else if (walk(it.x, it.y, 125)) { it.st = 'gardener'; g.hold = it; g.st = 'return'; if (it.id === 'rake') g.sawRake = false; }
      } else if (g.st === 'return') {
        const it = g.hold; if (!it) g.st = 'route';
        else if (it.id === 'hat') { g.hold = null; g.hat = true; it.st = 'worn'; g.st = 'route'; }
        else if (walk(it.home.x, it.home.y + (it.id === 'carrot' ? 0 : 0), 120)) { it.x = it.home.x; it.y = it.home.y; it.st = it.id === 'carrot' ? 'planted' : 'home'; g.hold = null; g.st = 'route'; }
      } else if (g.st === 'route') { const w = SPOTS[ROUTE[g.wp]]; if (walk(w.x, w.y, 110)) { g.st = 'work'; g.t = w.t; } }
      else if (g.st === 'work' && g.t <= 0) { g.wp = (g.wp + 1) % ROUTE.length; g.st = 'route'; }
      // the hat: he picks it up when he walks past it
      const hat = s.items.find((q) => q.id === 'hat'); if (hat.st === 'ground' && Math.hypot(hat.x - g.x, hat.y - g.y) < 24) { hat.st = 'worn'; g.hat = true; }
      // tripping over the rake he did not see lying there
      const rk = s.items.find((q) => q.id === 'rake');
      if (rk.st === 'ground' && g.moving && g.st !== 'fetch' && Math.hypot(rk.x - g.x, rk.y - g.y) < 26) { g.st = 'trip'; g.t = 2.2; g.say = 'BONK'; g.sayT = 1.5; s.done.rake = true; K.sfx('boom'); K.shake(10); g.sawRake = true; if (g.hold) { g.hold.st = 'ground'; g.hold = null; } }
    }
    // the list
    for (const k of s.list) { const T = TASKS[k]; if (T.special || s.done[k]) continue; const n = s.items.filter((q) => q.id === T.item && q.st === T.to).length; if (n >= (T.need || 1)) { s.done[k] = true; K.sfx('win'); K.floatText('✓ ' + T.text, 480, 240, '#ffd93a', 18); } }
    const left = s.list.filter((k) => !s.done[k]).length;
    if (!left) return K.end(s, { score: 500 + Math.floor(s.time), won: true, stats: { won: 1 }, title: 'LIST DONE', text: `Every job ticked off with ${Math.floor(s.time)}s left. The gardener has gone inside to have a lie down.` });
    if (s.time <= 0) return K.end(s, { score: (s.list.length - left) * 100, won: false, title: 'SUNSET', text: `${s.list.length - left} of ${s.list.length} jobs done. Tomorrow is another day. HONK.` });
  },
  draw(s) {
    const c = K.ctx(), G = s.goose, g = s.g;
    for (let i = 0; i < 12; i++) K.rect(i * 80, 0, 40, 540, '#4a8439');
    K.rect(0, 0, 960, 34, '#2e5a24'); K.rect(0, 512, 960, 28, '#2e5a24'); K.rect(0, 0, 26, 540, '#2e5a24');
    for (let x = 0; x < 960; x += 26) { K.circle(x, 30, 16, '#356a2a'); K.circle(x + 13, 516, 16, '#356a2a'); }
    // pond + island nest
    c.fillStyle = '#3a7ab8'; c.beginPath(); c.roundRect(POND, 30, 300, 490, 60); c.fill(); c.fillStyle = '#4a8ac8'; c.beginPath(); c.roundRect(POND + 12, 44, 276, 462, 50); c.fill();
    for (let i = 0; i < 7; i++) K.ring(POND + 60 + ((i * 97) % 220), 80 + ((i * 131) % 400), 8 + ((K.time() * 12 + i * 5) % 18), '#9ad8ff44', 1.5);
    K.circle(NEST.x, NEST.y, 52, '#6a9a4a'); K.circle(NEST.x, NEST.y, 30, '#8a6a3a'); K.circle(NEST.x, NEST.y, 20, '#6a4a28');
    // shed, patch, bench, blanket
    K.rect(SHED.x, SHED.y, SHED.w, SHED.h, '#8a5a3a', 4); K.poly([[SHED.x - 8, SHED.y + 4], [SHED.x + SHED.w / 2, SHED.y - 22], [SHED.x + SHED.w + 8, SHED.y + 4]], '#5a3a2a'); K.rect(SHED.x + 56, SHED.y + 46, 38, 64, '#4a2e1e');
    K.rect(60, 395, 220, 100, '#6a4a2e', 8); for (let i = 0; i < 4; i++) K.rect(66, 405 + i * 22, 208, 3, '#5a3e24');
    K.rect(410, 66, 130, 26, '#8a6a42', 4); K.rect(416, 92, 8, 14, '#5a4026'); K.rect(526, 92, 8, 14, '#5a4026');
    K.rect(370, 395, 180, 100, '#e8e0e0', 6); for (let i = 0; i < 6; i++) for (let j = 0; j < 4; j++) if ((i + j) % 2) K.rect(370 + i * 30, 395 + j * 25, 30, 25, '#d84a4a');
    // items
    s.items.forEach((it) => {
      if (it.st === 'goose' || it.st === 'gardener' || it.st === 'worn' || (it.st === 'pond' && !(it.sunk > 0))) return;
      const sink = it.st === 'pond' ? it.sunk / 1.2 : 1; K.alpha(sink);
      if (it.st === 'planted') { K.rect(it.x - 8, it.y - 18, 4, 12, '#3a9a3a'); K.rect(it.x - 2, it.y - 22, 4, 16, '#3a9a3a'); K.rect(it.x + 4, it.y - 18, 4, 12, '#3a9a3a'); K.circle(it.x, it.y - 4, 6, '#e8742a'); }
      else drawItem(it.id, it.x, it.y);
      K.alpha(1);
    });
    // gardener
    const gb = g.moving ? Math.sin(K.time() * 12) * 2 : 0, tilt = g.st === 'trip' ? 1 : 0;
    K.alpha(0.3); c.fillStyle = '#000'; c.beginPath(); c.ellipse(g.x, g.y + 22, 18, 7, 0, 0, 6.28); c.fill(); K.alpha(1);
    c.save(); c.translate(g.x, g.y); c.rotate(tilt * 1.4);
    K.rect(-14, -10 + gb, 28, 32, '#3a5a8a', 8); K.rect(-10, -4 + gb, 20, 24, '#4a6a9a', 4); K.circle(0, -18 + gb, 12, '#e8b890');
    if (g.hat) { K.circle(0, -24 + gb, 18, '#e8cc6a'); K.circle(0, -26 + gb, 11, '#d8b84a'); K.rect(-11, -26 + gb, 22, 3, '#a84a3a'); }
    if (g.st === 'work' && ROUTE[g.wp] === 'bench') K.rect(-12, 0, 24, 16, '#f0f0f0', 2);
    c.restore();
    if (g.hold) drawItem(g.hold.id, g.x + 18, g.y - 2);
    if (g.sayT > 0) { K.rect(g.x - 34, g.y - 66, 68, 22, '#fff', 8); K.text(g.say, g.x, g.y - 55, 13, '#2a2a2a', 'center', 'd'); }
    else if (g.st === 'work' && !K.attract) K.text(SPOTS[ROUTE[g.wp]].do, g.x, g.y - 50, 11, '#ffffffaa', 'center', 'u');
    if (g.st === 'trip') K.text('★ ✦ ★', g.x, g.y - 42, 14, '#ffd93a', 'center', 'u');
    // the goose
    const swim = inPond(G.x, G.y), wad = Math.sin((G.step || 0) * 18) * 3;
    if (!swim) { K.rect(G.x - 8 + wad, G.y + 10, 6, 10, '#ff9a2a', 2); K.rect(G.x + 3 - wad, G.y + 10, 6, 10, '#ff9a2a', 2); } else K.ring(G.x, G.y + 6, 26 + Math.sin(K.time() * 4) * 3, '#c8e8ff66', 2);
    K.alpha(0.25); c.fillStyle = '#000'; c.beginPath(); c.ellipse(G.x, G.y + 14, 20, 6, 0, 0, 6.28); c.fill(); K.alpha(1);
    c.fillStyle = '#f4f4f0'; c.beginPath(); c.ellipse(G.x - G.fx * 4, G.y + 2, 22, 15, Math.atan2(G.fy, G.fx) * 0.3, 0, 6.28); c.fill();
    const hx = G.x + G.fx * (G.honk > 0.2 ? 24 : 16), hy = G.y - 18 + G.fy * 8 - (G.honk > 0.2 ? 6 : 0);
    K.line(G.x + G.fx * 6, G.y - 2, hx, hy, '#f4f4f0', 10); K.circle(hx, hy, 9, '#f4f4f0');
    K.poly([[hx + G.fx * 6 - G.fy * 3, hy - 3], [hx + G.fx * 18, hy + (G.honk > 0.2 ? -2 : 1)], [hx + G.fx * 6 + G.fy * 3, hy + 3]], '#ff9a2a');
    K.circle(hx + G.fx * 2 - (G.fx === 0 ? 3 : 0), hy - 3, 2, '#111');
    if (G.honk > 0.15) K.text('HONK!', hx + G.fx * 30, hy - 22, 16, '#fff', 'center', 'd', 6);
    if (G.carry) drawItem(G.carry.id, hx + G.fx * 20, hy + 6);
    // to-do list
    const LX = 690; K.alpha(0.88); K.rect(LX, 6, 264, 28 + s.list.length * 20, '#f4ecd8', 6); K.alpha(1); K.text('TO DO', LX + 12, 20, 12, '#3a2a1a', 'left', 'd'); K.text(`${Math.max(0, Math.ceil(s.time))}s`, LX + 252, 20, 12, s.time < 30 ? '#c42a2a' : '#3a2a1a', 'right', 'd');

  },
  ai(s) {
    const G = s.goose, g = s.g; ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach((k) => K.vhold(k, false));
    const go = (x, y) => { if (Math.abs(G.x - x) > 8) K.vhold(G.x < x ? 'ArrowRight' : 'ArrowLeft'); if (Math.abs(G.y - y) > 8) K.vhold(G.y < y ? 'ArrowDown' : 'ArrowUp'); return Math.hypot(G.x - x, G.y - y) < 24; };

    if (G.carry) { const to = ['radio', 'bell'].includes(G.carry.id) ? { x: 780, y: 120 } : NEST; if (G.carry.id === 'rake') { if (go(270 - G.fx * 22, 280) && s.aw <= 0) { K.vtap('Space'); s.aw = 1; } return; } if (go(to.x - 20, to.y) && s.aw <= 0) { K.vtap('Space'); s.aw = 1; } return; }
    const reading = g.st === 'work' && ROUTE[g.wp] === 'bench', calm = g.st === 'work' || g.st === 'route';
    const k = s.list.find((q) => !s.done[q] && (q === 'honk' ? reading : q === 'hat' ? !s.g.hat || calm : true)) || s.list.find((q) => !s.done[q] && q !== 'honk' && q !== 'hat'); if (!k) { go(NEST.x, NEST.y); return; }
    if (k === 'honk' || (k === 'hat' && s.g.hat)) { if (go(g.x + 60, g.y + 40) && s.aw <= 0) { K.vtap('KeyE'); s.aw = 0.8; } return; }
    const want = k === 'rake' ? 'rake' : TASKS[k].item, it = s.items.find((q) => q.id === want && ['home', 'ground', 'planted'].includes(q.st));
    if (it && go(it.x - G.fx * 22, it.y) && s.aw <= 0) { K.vtap('Space'); s.aw = 0.5; }
  },
});
function drawItem(id, x, y) {
  if (id === 'rake') { K.line(x - 26, y + 10, x + 20, y - 10, '#8a6a42', 4); K.line(x + 14, y - 22, x + 28, y + 2, '#7a7a80', 4); for (let i = 0; i < 4; i++) K.line(x + 16 + i * 3.5, y - 18 + i * 6, x + 24 + i * 3.5, y - 22 + i * 6, '#7a7a80', 2); }
  else if (id === 'hat') { K.circle(x, y, 16, '#e8cc6a'); K.circle(x, y - 2, 10, '#d8b84a'); K.rect(x - 10, y - 2, 20, 3, '#a84a3a'); }
  else if (id === 'carrot') { K.poly([[x - 5, y - 6], [x + 5, y - 6], [x, y + 14]], '#e8742a'); K.rect(x - 4, y - 14, 3, 8, '#3a9a3a'); K.rect(x + 1, y - 14, 3, 8, '#3a9a3a'); }
  else K.text(ICON[id], x, y, 24, '#fff');
}
