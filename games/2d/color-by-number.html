<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Color by Number</title>
<link rel="stylesheet" href="../kit/kit.css">
<script type="application/json" id="meta">{"id":"color-by-number","n":138,"title":"COLOR BY NUMBER","genre":"relax","desc":"A grey grid full of little numbers. Pick a colour, paint every square with its number, and a picture slowly appears: a fox, a rocket, a sunflower, an octopus and twenty more. The squares for your colour light up so you never hunt for long. Drag to paint many at once. No timer.","controls":"Pick a colour at the bottom · click / drag the squares with that number · H = hint","scoreLabel":"PICTURES","tasks":[{"stat":"score","target":1,"text":"Finish a colour-by-number picture"},{"stat":"score","target":3,"text":"Finish 3 pictures in one sitting"}]}</script>
</head><body>
<script src="../../sdk/arcade-sdk.js"></script><script src="../kit/kit.js"></script>
<script>
const EMOJI = ['🦊', '🚀', '🌻', '🐙', '🍉', '🐸', '🍄', '🦄', '🐢', '🍩', '🐝', '🐳', '🌵', '🎃', '⛄', '🐧', '🍕', '🦋', '🍓', '🐱', '🌈', '🦉', '🍔', '🐞'];
const N = 24, GX = 230, GY = 22, CS = 18;
// draw an emoji small, then turn it into a grid of a few numbered colours (k-means)
function makePicture(e) {
  const cv = document.createElement('canvas'); cv.width = cv.height = N; const c = cv.getContext('2d', { willReadFrequently: true });
  c.textAlign = 'center'; c.textBaseline = 'middle'; c.font = `${N - 2}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`; c.fillText(e, N / 2, N / 2 + 1);
  const d = c.getImageData(0, 0, N, N).data, px = [];
  for (let i = 0; i < N * N; i++) px.push(d[i * 4 + 3] > 110 ? [d[i * 4], d[i * 4 + 1], d[i * 4 + 2]] : null);
  const solid = px.filter(Boolean); if (solid.length < 40) return null;
  const k = Math.min(8, Math.max(4, Math.round(solid.length / 60)));
  let cent = []; for (let i = 0; i < k; i++) cent.push(solid[Math.floor((i + 0.5) * solid.length / k)].slice());
  const near = (p) => { let b = 0, bd = 1e9; cent.forEach((q, j) => { const dd = (p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2 + (p[2] - q[2]) ** 2; if (dd < bd) { bd = dd; b = j; } }); return b; };
  for (let it = 0; it < 8; it++) { const sum = cent.map(() => [0, 0, 0, 0]); solid.forEach((p) => { const j = near(p); sum[j][0] += p[0]; sum[j][1] += p[1]; sum[j][2] += p[2]; sum[j][3]++; }); cent = cent.map((q, j) => (sum[j][3] ? [sum[j][0] / sum[j][3], sum[j][1] / sum[j][3], sum[j][2] / sum[j][3]] : q)); }
  // merge colours that ended up almost the same, drop empty ones
  const used = new Map(); px.forEach((p) => { if (p) { const j = near(p); used.set(j, (used.get(j) || 0) + 1); } });
  const keep = [...used.keys()].sort((a, b) => lum(cent[a]) - lum(cent[b]));
  const cols = keep.map((j) => `rgb(${cent[j].map((v) => Math.round(v)).join(',')})`);
  const cells = px.map((p) => (p ? keep.indexOf(near(p)) + 1 : 0));
  return { e, cols, cells };
}
const lum = (c) => c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11;
function next(s) {
  for (let t = 0; t < EMOJI.length; t++) { const p = makePicture(EMOJI[s.order[s.pi++ % s.order.length]]); if (p) { s.pic = p; break; } }
  s.done = s.pic.cells.map((v) => v === 0); s.sel = 1; s.finished = 0; s.hint = 0;
}
const left = (s, n) => s.pic.cells.filter((v, i) => v === n && !s.done[i]).length;
K.game({
  bg: '#14111f', touch: { stick: false, buttons: [] },
  init(s) { s.order = K.shuffle(EMOJI.map((_, i) => i)); s.pi = 0; s.count = 0; next(s); if (K.attract) s.done = s.done.map((v, i) => v || i % 3 !== 0); },
  update(s, dt) {
    const m = K.mouse, P = s.pic;
    s.hint -= dt;
    if (s.finished > 0) { s.finished -= dt; if (s.finished <= 0) next(s); return; }
    if (m.clicked) {
      P.cols.forEach((c, i) => { if (K.inRect(m.x, m.y, sw(P, i))) { s.sel = i + 1; K.sfx('click'); } });
      if (K.inRect(m.x, m.y, { x: 20, y: 380, w: 180, h: 40 })) { s.hint = 2; K.sfx('chime'); }
      if (K.inRect(m.x, m.y, { x: 20, y: 430, w: 180, h: 40 })) return K.end(s, { score: s.count, won: null, title: 'LOVELY', text: `${s.count} picture${s.count === 1 ? '' : 's'} coloured.` });
    }
    if (K.tap('KeyH')) s.hint = 2;
    for (let i = 1; i <= Math.min(9, P.cols.length); i++) if (K.tap('Digit' + i)) s.sel = i;
    if (m.down) {
      const x = Math.floor((m.x - GX) / CS), y = Math.floor((m.y - GY) / CS);
      if (x >= 0 && y >= 0 && x < N && y < N) {
        const i = y * N + x;
        if (!s.done[i] && P.cells[i] === s.sel) { s.done[i] = true; K.tone(500 + s.sel * 40, 0.03, 'triangle', 0.03); if (!left(s, s.sel)) { K.sfx('coin'); const nx = P.cols.findIndex((c, j) => left(s, j + 1)); if (nx >= 0) s.sel = nx + 1; } }
        else if (!s.done[i] && m.clicked && P.cells[i] !== s.sel) { s.wrong = { i, t: 0.4 }; K.sfx('tick'); }
      }
    }
    if (s.wrong) { s.wrong.t -= dt; if (s.wrong.t <= 0) s.wrong = null; }
    if (s.done.every(Boolean)) { s.count++; s.finished = 2.6; K.sfx('win'); K.flash('#fff', 0.2); }
  },
  draw(s) {
    const P = s.pic;
    for (let i = 0; i < N * N; i++) {
      const x = GX + (i % N) * CS, y = GY + Math.floor(i / N) * CS, v = P.cells[i];
      if (v === 0) { K.rect(x, y, CS, CS, '#f4f1ea'); continue; }
      if (s.done[i]) { K.rect(x, y, CS + 0.5, CS + 0.5, P.cols[v - 1]); continue; }
      const mine = v === s.sel;
      K.rect(x, y, CS, CS, mine ? (s.hint > 0 && Math.sin(K.time() * 20) > 0 ? '#ffd93a' : '#c9c3e8') : '#e6e2ee');
      K.stroke(x, y, CS, CS, '#00000014', 1);
      K.text(String(v), x + CS / 2, y + CS / 2 + 1, 10, mine ? '#2a2050' : '#9a96b0', 'center', 'd');
    }
    if (s.wrong) K.stroke(GX + (s.wrong.i % N) * CS, GY + Math.floor(s.wrong.i / N) * CS, CS, CS, '#ff3355', 3);
    K.stroke(GX, GY, N * CS, N * CS, '#8b5cf6', 2);
    // left panel
    K.text('COLOR BY NUMBER', 110, 40, 15, '#fff', 'center', 'd');
    K.text(`PICTURE ${s.count + 1}`, 110, 64, 12, '#8e88b8', 'center', 'm');
    const total = P.cells.filter(Boolean).length, got = P.cells.filter((v, i) => v && s.done[i]).length;
    K.rect(30, 84, 160, 10, '#24203f', 5); K.rect(30, 84, 160 * (got / total), 10, '#3dffa0', 5);
    K.text(`${Math.round((got / total) * 100)}%`, 110, 110, 14, '#3dffa0', 'center', 'd');
    if (s.finished > 0) { K.text(P.e, 110, 220, 80, '#fff'); K.text('DONE!', 110, 300, 26, '#ffd93a', 'center', 'd', 12); }
    K.button(20, 380, 180, 40, 'HINT (H)', { color: '#ffd93a', size: 12 });
    K.button(20, 430, 180, 40, 'FINISH', { color: '#8e88b8', size: 12 });
    // palette
    P.cols.forEach((c, i) => { const r = sw(P, i), n = left(s, i + 1); K.rect(r.x, r.y, r.w, r.h, c, 10); if (s.sel === i + 1) K.stroke(r.x - 3, r.y - 3, r.w + 6, r.h + 6, '#fff', 3, 12); K.text(n ? String(i + 1) : '✓', r.x + r.w / 2, r.y + r.h / 2 + 1, 16, lumOf(c) > 140 ? '#111' : '#fff', 'center', 'd'); });
  },
});
const sw = (P, i) => ({ x: 680 + (i % 2) * 120, y: 40 + Math.floor(i / 2) * 64, w: 104, h: 52 });
const lumOf = (c) => { const m = c.match(/\d+/g).map(Number); return m[0] * 0.3 + m[1] * 0.59 + m[2] * 0.11; };
</script></body></html>
