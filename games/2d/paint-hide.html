    if (iHunt && s.ph === 'paint') { K.rect(0, 0, 960, 540, '#05050a'); K.text("YOU'RE THE HUNTER", 480, 210, 34, '#ff3355', 'center', 'd', 14); K.text(`eyes closed... counting ${Math.max(0, Math.ceil(s.t))}`, 480, 260, 20, '#e8e0f0', 'center', 'u'); K.text('when the lights go down, sweep your spotlight and shoot the hiders. watch for blinking eyes!', 480, 300, 15, '#8e88b8', 'center', 'u'); return; }
    c.drawImage(scene, 0, 0);
    s.marks.forEach((k) => { K.circle(k.x, k.y, 5, '#111'); if (k.hit) K.ring(k.x, k.y, 10, '#ff3355', 2); });
    s.dust.forEach((d) => { K.alpha(d.t * 0.6); K.circle(d.x, d.y, 6 * (1.4 - d.t), '#e8e0d0'); K.alpha(1); });
    // hiders
    s.p.forEach((p) => {
      if (p.hunter) return;
      const x0 = Math.round(p.x - BW / 2), y0 = Math.round(p.y - BH / 2);
      if (!p.alive) { K.alpha(0.85); for (let i = 0; i < GW * GH; i++) { c.fillStyle = p.g[i]; c.fillRect(x0 + (i % GW) * CS, y0 + Math.floor(i / GW) * CS, CS, CS); } K.alpha(1); K.stroke(x0, y0, BW, BH, '#ff3355', 2); K.text('✕', p.x, p.y, 26, '#ff3355'); K.text(p.me ? 'YOU' : p.name, p.x, y0 - 10, 11, '#ff6a7a', 'center', 'd'); return; }
      for (let i = 0; i < GW * GH; i++) { c.fillStyle = p.g[i]; c.fillRect(x0 + (i % GW) * CS, y0 + Math.floor(i / GW) * CS, CS, CS); }
      if (!p.closed && !p.blinking) { K.rect(x0 + 9, y0 + 11, 7, 6, '#ffffff'); K.rect(x0 + 24, y0 + 11, 7, 6, '#ffffff'); K.rect(x0 + 11, y0 + 12, 3, 4, '#111'); K.rect(x0 + 26, y0 + 12, 3, 4, '#111'); }
      if (!iHunt) { K.stroke(x0 - 1, y0 - 1, BW + 2, BH + 2, p.me ? '#ffffffaa' : p.col + '55', 1); K.text(p.me ? 'YOU' : p.name, p.x, y0 - 9, 10, p.me ? '#fff' : p.col, 'center', 'd'); }
    });
    // the hunt: lights down, spotlight
    if (s.ph === 'hunt' || s.ph === 'res') {
      if (iHunt && s.ph === 'hunt') K.darkness([{ x: s.aim.x, y: s.aim.y, r: 150 }], 0.86);
      else { K.alpha(0.35); K.rect(0, 0, 960, 540, '#000'); K.alpha(1); K.ring(s.aim.x, s.aim.y, 150, '#ffffff55', 2); }
      K.ring(s.aim.x, s.aim.y, 14, '#ff3355', 2); K.line(s.aim.x - 22, s.aim.y, s.aim.x - 8, s.aim.y, '#ff3355', 2); K.line(s.aim.x + 8, s.aim.y, s.aim.x + 22, s.aim.y, '#ff3355', 2); K.line(s.aim.x, s.aim.y - 22, s.aim.x, s.aim.y - 8, '#ff3355', 2); K.line(s.aim.x, s.aim.y + 8, s.aim.x, s.aim.y + 22, '#ff3355', 2);
      if (me && !me.hunter && me.closed && me.alive) { K.alpha(0.92); K.rect(0, 0, 960, 540, '#000'); K.alpha(1); K.text('eyes closed', 480, 270, 18, '#666', 'center', 'u'); }
    }
    // HUD
    const phase = s.ph === 'paint' ? 'PAINT & HIDE' : s.ph === 'hunt' ? 'THE HUNT' : 'ROUND OVER';
    K.rect(0, 0, 960, 30, '#000a'); K.text(`ROUND ${s.round + 1}/${s.rounds} · ${phase} · ${Math.max(0, Math.ceil(s.t))}s`, 12, 15, 13, '#fff', 'left', 'd');
    K.text(`hunter: ${H ? (H.me ? 'YOU' : H.name) : '-'}`, 480, 15, 13, '#ff6a7a', 'center', 'd');
    if (s.ph === 'hunt') K.text(`shots ${'●'.repeat(Math.max(0, s.shots))}`, 948, 15, 13, '#ffd93a', 'right', 'd');
    if (s.ph === 'paint' && me && !me.hunter) {
      const L = PXL(me), bl = Math.round(camo(me) * 100), bc = bl > 85 ? '#3dffa0' : bl > 70 ? '#ffd93a' : '#ff8a6a';
      K.rect(L, 288, 200, 244, '#14121ef0', 10); K.text('YOUR BODY', L + 80, 296, 10, '#8e88b8', 'center', 'd');
      for (let i = 0; i < GW * GH; i++) K.rect(L + 16 + (i % GW) * 16, 300 + Math.floor(i / GW) * 16, 15, 15, me.g[i]);
      K.rect(L + 152, 302, 36, 36, s.cur, 6); K.stroke(L + 152, 302, 36, 36, '#fff', 2, 6); K.text('colour', L + 170, 348, 9, '#8e88b8', 'center', 'u');
      K.text('blend', L + 170, 374, 10, '#8e88b8', 'center', 'u'); K.text(`${bl}%`, L + 170, 394, 16, bc, 'center', 'd');
      K.rect(L + 16, 466, 60, 26, '#2a2440', 6); K.text('FILL', L + 46, 479, 11, '#fff', 'center', 'd');
      s.recent.forEach((cc, i) => K.rect(L + 16 + i * 28, 500, 24, 24, cc, 4));
      K.text('click the room to pick a colour · paint your body to match where you stand', L > 400 ? 360 : 600, 524, 13, '#ffffffcc', 'center', 'u');
    }
    if (s.ph === 'hunt' && me && !me.hunter && me.alive) K.text('stay still · hold EYES (Shift / E) when the spotlight comes', 480, 524, 13, '#ffffffcc', 'center', 'u');
    if (s.ph === 'hunt' && iHunt) K.text('click to shoot · watch for blinking eyes and footsteps', 480, 524, 13, '#ffffffcc', 'center', 'u');
    if (s.ph === 'res') { K.rect(300, 200, 360, 130, '#000c', 12); K.text(s.resText || '', 480, 236, 18, '#fff', 'center', 'd'); s.p.slice().sort((a, b) => b.pts - a.pts).slice(0, 4).forEach((p, i) => K.text(`${p.me ? 'YOU' : p.name}  ${p.pts}`, 480, 266 + i * 16, 12, p.col, 'center', 'd')); }
  },
  ai(s, dt) {
    const me = meP(s); if (!me) return; ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach((k) => K.vhold(k, false));
    if (s.ph === 'paint' && !me.hunter) { if (!me.spot) botHide(s, me, 0); const d = Math.hypot(me.spot.x - me.x, me.spot.y - me.y); if (d > 6) { K.vhold(me.spot.x > me.x ? 'ArrowRight' : 'ArrowLeft', Math.abs(me.spot.x - me.x) > 4); K.vhold(me.spot.y > me.y ? 'ArrowDown' : 'ArrowUp', Math.abs(me.spot.y - me.y) > 4); } else if (!me.painted) { me.g = me.g.map((_, i) => hex(cellBg(me, i))); me.painted = true; } }
    if (s.ph === 'hunt' && me.hunter) { s.aiT = (s.aiT || 0) - dt; const t = s.p.find((p) => !p.hunter && p.alive); if (t) { s.aim.x += (t.x - s.aim.x) * Math.min(1, dt * 1.5); s.aim.y += (t.y - s.aim.y) * Math.min(1, dt * 1.5); if (s.aiT <= 0 && Math.hypot(t.x - s.aim.x, t.y - s.aim.y) < 10) { K.vmouse(s.aim.x, s.aim.y, true); s.aiT = 2; } else K.vmouse(s.aim.x, s.aim.y); } }
  },
});
