<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>NOVEXYT Arcade</title>
<meta name="description" content="NOVEXYT ARCADE — 200+ 2D and 3D games, solo, with friends and online.">
<meta name="theme-color" content="#06050d">
<link rel="icon" type="image/png" href="assets/icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/arcade.css">
<link rel="stylesheet" href="css/cosmetics.css">
<link rel="stylesheet" href="css/screens.css">
</head>
<body>
<div id="bg" aria-hidden="true"><div class="bg-glow"></div><div class="bg-grid"></div></div>
<div class="scanlines" aria-hidden="true"></div>
<div id="boot" class="boot"></div>
<div id="app" class="app hidden">
  <header id="topbar" class="topbar"></header>
  <main id="view" class="view"></main>
</div>
<div id="game-layer" class="game-layer hidden"></div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<noscript>This arcade needs JavaScript.</noscript>
<script type="module" src="js/app.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});</script>
</body>
</html>
